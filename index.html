    if (ev.near.has(j)) p *= 0.15;            // мирным нельзя называть само слово — почти невозможно
    return p;
  }
  // Σ q·bm — сколько ассоциаций «израсходовано» с точки зрения распределения q
  function blockedMass(q, bm) { let s = 0; for (let i = 0; i < q.length; i++) s += q[i] * bm[i]; return s; }
  // P(подсказка | шпион без слова); шпион «целится» в смесь η·q + (1−η)·равномерно
  function Pspy(ev, q, pm, eta, Bq) {
    const cand = G.cand, n = cand.length || 1;
    let aq = 0, au = 0;
    for (const [j, s] of ev.Ap) { const ci = G.candPos[j]; if (ci < 0) continue; aq += q[ci] * s; au += s; }
    au /= n;
    let gq = 0, gu = 0;
    for (let p = 0; p < G.L.P; p++) if (ev.g[p]) { gq += pm[p] * ev.g[p]; gu += G.pu[p] * ev.g[p]; }
    const B = eta * (Bq == null ? (q === G.q ? G.Bq : blockedMass(q, G.bm)) : Bq) + (1 - eta) * G.Bu;
    let res = MS.A * (eta * aq + (1 - eta) * au) + (MS.G + FLOW_G * MS.A * B) * (eta * gq + (1 - eta) * gu) + (MS.V + FLOW_V * MS.A * B) * ev.v + MS.O * EPS;
    if (ev.letter) {
      let lm = 0; for (let i = 0; i < cand.length; i++) if (G.L.words[cand[i]].first === ev.letter) lm += eta * q[i] + (1 - eta) / n;
      res += LETTER_P * (0.02 + 0.5 * lm);

  }
  const llrOf = (ev, j, lps, bm, fwd) => clip(Math.log(Pk(ev, j, bm, fwd)) - lps, LLR_LO, LLR_HI);
  function packMass(q) {
    const pm = new Float64Array(G.L.P);

  }
  // Байесовское обновление апостериора q по подсказке (устойчивое: ρ — шанс, что говорил шпион/ошибка)
  function updateQ(ev, rho, lam) {
    const q = G.q, n = q.length; if (!n) return;
    if (ev.kc < 1) { if (!G.qPrev || G.qPrev.length !== n) G.qPrev = new Float64Array(n); G.qPrev.set(q); }
    const ps = Pspy(ev, q, G.pm, 1);
    let z = 0;
    for (let i = 0; i < n; i++) { const l = (1 - rho) * Pk(ev, G.cand[i]) + rho * ps; q[i] *= lam === 1 ? l : Math.pow(l, lam); z += q[i]; }
    if (!(z > 0)) { q.fill(1 / n); z = 1; }
    const floor = 1e-7 / n;
    let z2 = 0;
    for (let i = 0; i < n; i++) { q[i] = Math.max(q[i] / z, floor); z2 += q[i]; }
    for (let i = 0; i < n; i++) q[i] /= z2;
    if (ev.kc < 1 && G.qPrev) {        // модель мирного: шпион понял связь с вероятностью kc, иначе ничего не узнал
      for (let i = 0; i < n; i++) q[i] = ev.kc * q[i] + (1 - ev.kc) * G.qPrev[i];

    G.pm = packMass(q);

  // Подсказка прозвучала: похожие ключи больше нельзя повторять, у слов «расходуются» ассоциации
  function block(m) {
    let changed = false;
    for (const hits of m.per) for (const [k] of hits) {
      if (G.blocked.has(k)) continue;
      G.blocked.add(k);
      for (const pp of G.L.keys[k].post) {
        const ci = G.candPos[pp.j];
        if (ci < 0) continue;
        const wgt = pp.j === G.jStar ? (knowsFwd(pp.j, pp.i) ? 1 : 0) : revWeight(pp.j, pp.i);
        if (!wgt) continue;
        if (!G.bm[ci]) G.bmList.push(ci);
        G.bm[ci] = Math.min(1, G.bm[ci] + pp.r * wgt); changed = true;
      }
    }
    if (changed) {
      G.Bq = blockedMass(G.q, G.bm);
      let s = 0; for (let i = 0; i < G.bm.length; i++) s += G.bm[i];
      G.Bu = G.bm.length ? s / G.bm.length : 0;
    }
  }
  // Ожидаемое (по весам w) лог-отношение «знает слово / шпион» для подсказки — как её увидят мирные.
  // lps — log P(подсказка | шпион) на момент подсказки (если не задан — считается сейчас), bm — снимок «расхода».
  function expLLR(ev, w, wpm, lps, bm) {
    if (lps == null) lps = Math.log(Pspy(ev, G.q, G.pm, D.eta));
    bm = bm || G.bm;
    const L = G.L;
    let e = 0, e2 = 0;
    if (ev.letter || w.length <= 64) {
      for (let i = 0; i < w.length; i++) { if (w[i] < 1e-9) continue; const x = llrOf(ev, G.cand[i], lps, bm); e += w[i] * x; e2 += w[i] * x * x; }
    } else {
      // разреженно: отдельно — слова с совпадениями и с «расходом», остальные — одним числом на тему
      const rest = Float64Array.from(wpm);
      const done = new Set();
      const visit = ci => {
        if (ci < 0 || done.has(ci)) return;
        done.add(ci);
        const x = llrOf(ev, G.cand[ci], lps, bm);
        e += w[ci] * x; e2 += w[ci] * x * x; rest[L.words[G.cand[ci]].p] -= w[ci];
      };
      for (const j of ev.near) visit(G.candPos[j]);
      for (const j of ev.A.keys()) visit(G.candPos[j]);
      let gv = ev.v > 0;
      for (let p = 0; p < L.P && !gv; p++) if (ev.g[p] > 0) gv = true;
      // слова с «израсходованными» ассоциациями — по отдельности, но только заметные по весу
      // (остальные, суммарно < 5% массы, идут общим числом по теме — иначе при неизвестной теме это тысячи слов)
      if (gv) { const thr = 0.05 / w.length; for (const ci of G.bmList) if (w[ci] >= thr) visit(ci); }
      for (let p = 0; p < L.P; p++) {
        if (rest[p] <= 1e-12) continue;
        const x = clip(Math.log(MK.G * ev.g[p] + MK.V * ev.v + MK.O * EPS) - lps, LLR_LO, LLR_HI);
        e += rest[p] * x; e2 += rest[p] * x * x;
      }
    }
    return {mean: e, std: Math.sqrt(Math.max(0, e2 - e * e))};
  }
  // Апостериор «слушателя-шпиона» на слово после подсказки (для оценки риска мирного «выдать слово»)
  function postAfter(ev, ci) {
    const q = G.q, n = q.length;
    const ps = Pspy(ev, q, G.pm, 1);
    let z = 0, t = 0;
    for (let i = 0; i < n; i++) { const v = q[i] * ((1 - G.rhoPub) * Pk(ev, G.cand[i]) + G.rhoPub * ps); z += v; if (i === ci) t = v; }
    return z > 0 ? t / z : 0;
  }
  // Риск «выдать слово»: насколько вырастет уверенность шпиона (в лог-шансах) × шанс, что он вообще поймёт связь.
  // Лог-шансы, а не вероятность: даже «добивающая» подсказка заметно укрепляет догадку шпиона.
  const logit = p => { const x = clip(p, 1e-4, 1 - 1e-4); return Math.log(x / (1 - x)); };
  function leakOf(ev, ci) {
    const q0 = G.q[ci];
    const full = postAfter(ev, ci);
    return ev.kc * Math.max(0, logit(full) - logit(q0));
  }

  /* ---------- undercover: «а вдруг подставной — я?» ----------
     Гипотезы M — какое слово у большинства: моё (тогда подставной кто-то из других, его слово — из «похожих» на моё)
     или одно из слов, для которых моё — подстава (тогда подставной я). Улики — чужие подсказки: к какому слову они ближе. */
  const lse2 = (x, y) => { const m = Math.max(x, y); return m + Math.log(Math.exp(x - m) + Math.exp(y - m)); };
  function lme(arr) {     // log(mean(exp(arr)))
    if (!arr.length) return UC_LO;
    let m = -Infinity; for (const x of arr) if (x > m) m = x;
    let s = 0; for (const x of arr) s += Math.exp(x - m);
    return m + Math.log(s / arr.length);
  }
  function buildUc() {
    const L = G.L, j0 = G.jStar;
    const pw = L.packWords[L.words[j0].p];
    const alts = [];
    for (const x of pw) if (x !== j0 && nearList(L, x).includes(j0)) alts.push(x);     // для них моё слово — подстава
    for (const x of nearList(L, j0)) if (!alts.includes(x)) alts.push(x);                // и просто похожие
    if (!alts.length) for (const x of U.shuffle(pw.filter(x => x !== j0), r).slice(0, 6)) alts.push(x);
    const S = [j0, ...alts.slice(0, 8)];
    let dec = nearList(L, j0).slice(0, 5);
    if (!dec.length) dec = S.slice(1);
    const Ul = [...new Set([...S, ...dec])];
    const pos = new Map(Ul.map((j, u) => [j, u]));
    const K = G.K, N = G.nPl;
    // уверенные недооценивают шанс «подставной — я», робкие переоценивают
    const pW0 = clip(1 / (1 + Math.exp(-(Math.log((N - K) / K) + 0.8 * (T.confidence - 0.5)))), 0.3, 0.95);
    const near = Ul.filter(j => j !== j0).map(j => { const n = L.words[j].n; return {w: L.words[j].w, n, toks: n.split(/[\s-]+/).filter(Boolean).map(t => [t, U.stem(t)])}; });
    return {S, SU: S.map(j => pos.get(j)), decU: dec.map(j => pos.get(j)), U: Ul, pos, Uset: new Set(Ul), near, packN: pw.length,
      a: clip(K / Math.max(1, N - 1), 0.05, 0.6), b: clip((K - 1) / Math.max(1, N - 1), 0, 0.6), pW0, lam: D.ucLam,
      selfLam: D.ucSelf * (1.15 - 0.3 * T.confidence), cacheN: -1, cache: null};
  }
  // Лог-правдоподобие подсказки для слов U (относительно лучшего, с отсечкой — одна подсказка не решает всё)
  // Последний элемент строки — «осторожный подставной»: понял, что слово другое, но не знает какое, и говорит
  // общее/расплывчатое или что-то из темы (как шпион без слова). Поэтому «вода» — лёгкая улика и в undercover.
  function ucRow(ev, bm) {
    const uc = G.uc, n = uc.U.length, row = new Float64Array(n + 1);
    let mx = -Infinity;
    for (let u = 0; u < n; u++) {
      const j = uc.U[u];
      const v = Math.log(PkA(ev, j, j === G.jStar ? ev.Aself : (ev.Auc.get(j) || 0), bm));
      row[u] = v; if (v > mx) mx = v;
    }
    const pw = G.L.words[G.jStar].p;
    let am = 0; for (const [j, val] of ev.A) if (G.L.words[j].p === pw) am += val;
    const vs = Math.log(MS.A * am / Math.max(1, uc.packN) + MS.G * ev.g[pw] + MS.V * ev.v + MS.O * EPS);
    row[n] = vs; if (vs > mx) mx = vs;
    for (let u = 0; u <= n; u++) row[u] = Math.max(UC_LO, row[u] - mx);
    return row;
  }
  function ucPost() {
    const uc = G.uc;
    if (uc.cacheN === G.entries.length && uc.cache) return uc.cache;
    const nS = uc.S.length;
    const lp = new Float64Array(nS);
    lp[0] = Math.log(uc.pW0);
    for (let s = 1; s < nS; s++) lp[s] = Math.log((1 - uc.pW0) / (nS - 1));
    const oddW = new Map();
    const la = Math.log(uc.a), l1a = Math.log(1 - uc.a), lb = uc.b > 0 ? Math.log(uc.b) : -Infinity, l1b = Math.log(1 - uc.b);
    for (const id of others()) {
      const p = rec(id);
      if (!p.ucL) { oddW.set(id, uc.a); continue; }
      // кто подозрителен (при условии, что большинство — со мной): вес улик lam
      const lw0 = p.ucL[uc.SU[0]] * uc.lam, ld0 = p.ucOdd * uc.lam;
      const m0 = lse2(l1a + lw0, la + ld0);
      oddW.set(id, Math.exp(la + ld0 - m0));
      // «подставной — я?» — с самоуверенностью человека: свои выводы о себе слабее (selfLam)
      const sl = uc.selfLam;
      const lw = p.ucL[uc.SU[0]] * sl;
      lp[0] += lse2(l1a + lw, la + p.ucOdd * sl);
      for (let s = 1; s < nS; s++) { const lv = p.ucL[uc.SU[s]] * sl; lp[s] += uc.b > 0 ? lse2(l1b + lv, lb + lw) : lv; }
    }
    let mx = -Infinity; for (const x of lp) if (x > mx) mx = x;
    let z = 0; const pM = new Float64Array(nS);
    for (let s = 0; s < nS; s++) { pM[s] = Math.exp(lp[s] - mx); z += pM[s]; }
    for (let s = 0; s < nS; s++) pM[s] /= z;
    uc.cache = {pM, pOdd: 1 - pM[0], oddW};
    uc.cacheN = G.entries.length;
    return uc.cache;
  }
  // «Подставной подстраивается»: с вероятностью β (растёт с кругом) он уже понял слово большинства и говорит про него.
  // Поэтому подсказка «про наше слово» — слабое алиби, а «про похожее слово» — сильная улика (асимметрия).
  const ucBeta = round => clip(0.12 + 0.12 * ((round || 1) - 1), 0.1, 0.45);
  const ucGamma = round => clip(0.12 + 0.08 * ((round || 1) - 1), 0.1, 0.3);
  // log P(подсказка | подставной), если у большинства слово с индексом majU, а у подставных — слова oddU:
  // говорит про своё слово / уже подстроился под слово большинства (β) / осторожничает, как шпион без слова (γ)
  const ucOddLog = (row, majU, oddU, round) => {
    const b = ucBeta(round), g = ucGamma(round);
    return lse2(lse2(Math.log(1 - b - g) + lme(oddU.map(u => row[u])), Math.log(b) + row[majU]), Math.log(g) + row[row.length - 1]);
  };
  // насколько подсказка выглядит «как у большинства» (а не у подставного)
  const ucSep = (row, majU, oddU, round) => clip(row[majU] - ucOddLog(row, majU, oddU, round), -3, 2.5);
  // придумать ассоциацию к чужому слову труднее, чем проверить её (между «догадкой» шпиона и проверкой знающим)
  const knowsGen = (j, i) => hashJI(j, i, 0x2545f491) < 0.5 * (kFwd(i) + kRev(i, D));
  // штраф за повтор подсказок прошлых партий
  const pastPen = n => ((G.past && G.past.get(n)) || 0) * PAST_PEN;

  /* ---------- игроки, события ---------- */
  function rec(id) {
    let p = G.pl.get(id);
    if (!p) {
      p = {id, Epos: 0, Eneg: 0, Pneg: 0, n: 0, skips: 0, imit: 0, worst: null, gut: gauss(r) * D.gut * (0.4 + T.noise), clues: [], ents: []};
      G.pl.set(id, p);
    }
    return p;
  }
  const addE = (p, v) => { if (v >= 0) p.Epos += v; else p.Eneg += v; };
  const addP = (p, v) => { p.Pneg += v; };

  function ingest(e) {
    if (!G || !e || e.id == null) return;
    const cnt = G.cnt.get(e.id) || 0;
    const round = e.round != null ? e.round : cnt + 1;
    const key = e.id + '|' + round;
    if (G.seen.has(key)) return;
    G.seen.add(key);
    G.cnt.set(e.id, cnt + 1);
    if (round > G.maxRound) G.maxRound = round;
    const isMe = e.id === selfId;
    const text = e.skipped ? '' : String(e.text == null ? '' : e.text).trim();
    G.entries.push({id: e.id, round, text, skipped: !text});
    if (!text) {
      if (!isMe) { const p = rec(e.id); p.skips++; addE(p, SKIP_LLR); G.evals.set(key, {kind: 'skip', x: 0}); }
      return;
    }
    const m = lexMatch(G.L, text);
    const ev = evalMatch(m);
    if (isMe) {
      G.said.push({id: e.id, toks: m.toks});
      G.myClues.push(text);
      if (!envPast) { memAdd(G.memKey, m.n); if (G.word) memAdd('w:' + G.word, m.n); }
      if (G.role === 'word' && !G.uc) updateQ(ev, G.rhoPub, DIFF.normal.lam);
      G.saidNorm.add(m.n); block(m);
      return;
    }
    if (!envPast && G.word && !G.uc) memAdd('w:' + G.word, m.n);
    const p = rec(e.id);
    p.n++; p.clues.push(text);
    // подражание: подсказка почти повторяет чужую
    let imit = 0;
    for (const s of G.said) {
      if (s.id === e.id) continue;
      for (const [a, sa] of m.toks) for (const [b, sb] of s.toks) { const v = simFast(a, sa, b, sb); if (v > imit) imit = v; }
    }
    G.said.push({id: e.id, toks: m.toks});
    if (imit >= MATCH_T) { p.imit++; addE(p, IMIT_LLR * imit); addP(p, IMIT_LLR * imit); }
    // оценка — на состоянии ДО этой подсказки
    if (G.uc) {
      const uc = G.uc, row = ucRow(ev);
      if (!p.ucL) { p.ucL = new Float64Array(row.length); p.ucOdd = 0; }
      for (let u = 0; u < row.length; u++) p.ucL[u] += row[u];
      const lw = row[uc.SU[0]], lo = ucOddLog(row, uc.SU[0], uc.decU, round);
      p.ucOdd += lo;       // лог-правдоподобие «подставной» по этой подсказке
      const sep = clip(lw - lo, -3, 2.5);
      if (!p.worst || sep < p.worst.v) p.worst = {text, v: sep};
      G.evals.set(key, {kind: ev.kind, x: sep});
      G.saidNorm.add(m.n); block(m);
      return;
    }
    const lps = Math.log(Pspy(ev, G.q, G.pm, D.eta));
    if (G.role === 'word') {
      const llr = G.jStar >= 0 ? llrOf(ev, G.jStar, lps, null, true) : 0;
      addE(p, llr);
      if (!p.worst || llr < p.worst.v) p.worst = {text, v: llr};
      G.evals.set(key, {kind: ev.kind, x: llr});
      updateQ(ev, G.rhoPub, DIFF.normal.lam);
    } else {
      // для реплик: какая доля моей уверенности приходится на слова, к которым подходит подсказка
      let fm = 0, fz = 0;
      for (const [j, val] of ev.A) { const ci = G.candPos[j]; if (ci < 0) continue; fm += G.q[ci] * val; fz += val / Math.max(1, G.cand.length); }
      G.evals.set(key, {kind: ev.kind, x: fz > 0 ? fm / fz : 0});
      // шпион запоминает, как подсказку увидят мирные; пересчитывает по свежему апостериору при голосовании
      p.ents.push({ev, lps, bm: Float32Array.from(G.bm), text});
      if (!G.fellows.has(e.id)) {
        updateQ(ev, G.rhoSpy, D.lam);
        G.lastEv.push(ev); if (G.lastEv.length > 2) G.lastEv.shift();
        // тема неизвестна: заранее (пока слушаю) готовлю ключи самых вероятных слов — свой ход будет быстрым
        if (G.cand.length > 150) for (const ci of topIdx(G.q, D.topM + 2)) for (const k of G.L.words[G.cand[ci]].ak) keyMatch(G.L, k);
      }
    }
    G.saidNorm.add(m.n); block(m);
  }
  // Шпион: как мирные (знающие слово) видят подсказки игрока — по текущему апостериору
  function pubEvidence(p) {
    let pos = 0, neg = 0, worst = null;
    for (const en of p.ents) {
      const x = expLLR(en.ev, G.q, G.pm, en.lps, en.bm).mean;
      if (x >= 0) pos += x; else neg += x;
      if (!worst || x < worst.v) worst = {text: en.text, v: x};
    }
    const extra = SKIP_LLR * p.skips + p.Pneg;      // пропуски и подражание
    return {pos, neg: neg + extra, worst};
  }
  function ingestAccuse(from, to) {
    if (!G || from == null || to == null || from === to) return;
    const k = from + '>' + to;
    if (G.accSeen.has(k)) return;
    G.accSeen.add(k);
    let s = G.accusers.get(to); if (!s) G.accusers.set(to, s = new Set());
    s.add(from);
    if (to === selfId) G.accusedMe.add(from);
  }
  function sync(ctx) {
    if (!G || !ctx) return;
    if (Array.isArray(ctx.history)) for (const e of ctx.history) ingest(e);
    if (Array.isArray(ctx.feed)) for (const f of ctx.feed) if (f && f.kind === 'accuse') ingestAccuse(f.from, f.to);
  }
  // Кто реально участвует в партии (есть в истории) — за наблюдателей не голосуем
  function others() {
    const ids = [];
    const inHist = new Set(G.entries.map(e => e.id));
    for (const p of env.players || []) if (p && p.id !== selfId && (inHist.has(p.id) || !inHist.size)) ids.push(p.id);
    for (const id of inHist) if (id !== selfId && !ids.includes(id)) ids.push(id);
    return ids;
  }

  /* ---------- подозрения ---------- */
  // Мирный: свои оценки. Шпион (pub=true): как, по его мнению, видят игроков мирные.
  function suspicion(pub) {
    const ids = others();
    const negW = 0.7 + 0.6 * T.suspicion;
    const wE = D.evid * (0.75 + 0.5 * T.confidence);
    let s0;
    let hW = 0.2 + 1.1 * (pub ? 0.6 : T.herd);
    if (G.uc) {
      // undercover: «кто не в теме» — чьи подсказки ближе к похожему слову, чем к моему
      const uc = G.uc, post = ucPost(), la = Math.log(uc.a / (1 - uc.a));
      const ev = ids.map(id => { const o = clip(post.oddW.get(id) ?? uc.a, 1e-4, 1 - 1e-4); return Math.log(o / (1 - o)) - la; });
      s0 = ids.map((id, i) => { const p = rec(id); return wE * 1.2 * ev[i] + wE * negW * (-SKIP_LLR * p.skips - 0.5 * p.Pneg) + p.gut; });
      G.lastEvid = new Map(ids.map((id, i) => [id, +(-ev[i]).toFixed(2)]));
      hW *= 1 + 0.8 * post.pOdd;      // подозреваю, что подставной я, — держусь толпы
    } else {
      const evid = ids.map(id => {
        const p = rec(id);
        if (pub) { const pe = pubEvidence(p); p.worstPub = pe.worst; return {pos: pe.pos, neg: pe.neg}; }
        return {pos: p.Epos, neg: p.Eneg};
      });
      s0 = ids.map((id, i) => -wE * (evid[i].pos + evid[i].neg * negW) + (pub ? 0.5 : 1) * rec(id).gut);
      G.lastEvid = new Map(ids.map((id, i) => [id, +(evid[i].pos + evid[i].neg).toFixed(2)]));
    }
    const K = G.K;
    const sm = U.softmax(s0, 1);
    const pS0 = new Map(ids.map((id, i) => [id, Math.min(0.99, K * sm[i])]));
    const S = ids.map((id, i) => {
      let h = 0;
      const acc = G.accusers.get(id);
      if (acc) for (const a of acc) {
        if (a === selfId) continue;
        const cred = a === selfId ? 1 : clip(1 - (pS0.get(a) ?? K / Math.max(1, ids.length)), 0.15, 1);
        h += cred * hW;
      }
      h = Math.min(h, 3 * hW);
      let ret = 0;
      if (!pub && G.role === 'word' && G.accusedMe.has(id)) ret = 0.4 + 0.6 * T.suspicion;
      return s0[i] + h + ret;
    });
    return {ids, S};
  }
  function suspicionMap(pub) {
    const {ids, S} = suspicion(pub);
    const sm = U.softmax(S, 1);
    const out = {};
    ids.forEach((id, i) => { out[id] = +Math.min(0.99, G.K * sm[i]).toFixed(3); });
    return out;
  }

  /* ---------- время «на подумать» ---------- */
  function think(base, spread, H) {
    const raw = T.pace * (base + spread * H + r() * 700) * (G ? G.fatigue : 1);
    return Math.round(clip(raw, 900, 4500) / speed);
  }
  // По темпу (SPEC-v2): calm/normal — в рамке, внутри — по характеру (pace) и сложности решения (H — «разброс» вариантов)
  function thinkFor(kind, H, round) {
    const tb = TEMPO[tempo];
    if (!tb) {
      if (kind === 'clue') return think(1000 + (round >= 2 ? 250 : 0), 2000, H);
      if (kind === 'vote') return think(1500, 2200, H);
      if (kind === 'guess') return think(1600, 2000, H);
      return Math.round(clip(T.pace * (700 + 900 * H + 900 * r()), 600, 2400) / speed);
    }
    const [lo, hi] = tb[kind];
    const f = clip(0.08 + 0.5 * H + 0.3 * r() + 0.45 * (T.pace - 1) + (round >= 2 ? 0.05 : 0) + (G ? 2 * (G.fatigue - 1) : 0), 0, 1);
    return Math.round((lo + (hi - lo) * f) / speed);
  }

  /* ---------- текст подсказки: без повторов и не слишком близко к слову ---------- */
  // Не слишком ли близко к секретному слову (движок отклонит «Это слишком очевидно!»); с запасом
  function closeTo(n, toks, wtoks, wn) {
    for (const [t, st] of toks) for (const [a, sa] of wtoks) {
      if (simFast(t, st, a, sa, 0.6) >= 0.6) return true;
      if (sa.length >= 4 && t.includes(sa)) return true;
      if (st.length >= 4 && a.includes(st)) return true;
      if (a.length >= 3 && sa.length >= 3 && t.startsWith(sa) && t.length <= sa.length + 4) return true;   // как в движке
    }
    return U.similar(n, wn) >= 0.6 || n.replace(/[\s-]/g, '') === wn.replace(/[\s-]/g, '');
  }
  // Не слишком ли близко к своему слову; в undercover — и к похожим словам темы: подставной не знает, что он подставной,
  // и не должен случайно назвать однокоренное к слову мирных (Человек-муравей → «человек» про Человека-паука)
  function closeText(n, toks) {
    if (!G.wordToks) return false;
    if (closeTo(n, toks, G.wordToks, G.word)) return true;
    if (G.uc) for (const o of G.uc.near) if (closeTo(n, toks, o.toks, o.n)) return true;
    return false;
  }
  function closeToWord(k) {
    let v = G.closeCache.get(k);
    if (v !== undefined) return v;
    const key = G.L.keys[k];
    if (!key.toks) key.toks = tokensOf(key.n).map(t => [t, U.stem(t)]);
    v = closeText(key.n, key.toks);
    G.closeCache.set(k, v);
    return v;
  }
  const okShape = text => text.length <= 28 && U.norm(text).split(' ').filter(Boolean).length <= 2;
  const usable = k => !G.blocked.has(k) && !G.saidNorm.has(G.L.keys[k].n) && okShape(G.L.keys[k].text) && !closeToWord(k);
  function fallbackText() {
    const vv = U.shuffle(vagueList(), r);
    const fine = t => { const n = U.norm(t); return n && !G.saidNorm.has(n) && okShape(t) && !closeText(n, tokensOf(n).map(x => [x, U.stem(x)])); };
    for (const v of vv) if (fine(v)) return v;
    for (let i = 0; i < 80; i++) {
      const t = vv[i % vv.length] + ' ' + vv[(i * 7 + 3) % vv.length];
      if (fine(t)) return t;
    }
    return 'что-то знакомое';
  }

  /* ---------- подсказка мирного ---------- */
  function wordClue(ctx) {
    if (G.uc) return ucClue(ctx);
    const L = G.L;
    const round = ctx.round || G.maxRound;
    const ci = G.jStar >= 0 ? G.candPos[G.jStar] : -1;
    const w = G.jStar >= 0 ? L.words[G.jStar] : null;
    const cands = [];
    if (w) {
      for (let t = 0; t < w.ak.length; t++) { const i = w.ar[t]; if (knowsFwd(G.jStar, i)) cands.push({k: w.ak[t], kind: 'a', rank: i}); }
      for (const k of L.genKeys[w.p] || []) cands.push({k, kind: 'g'});
    }
    for (const k of U.shuffle(L.vagueKeys, r).slice(0, 5)) cands.push({k, kind: 'v'});   // «вода» — пара вариантов, а не 40
    const list = [];
    const seen = new Set();
    for (const c of cands) { if (seen.has(c.k) || !usable(c.k)) continue; seen.add(c.k); c.text = L.keys[c.k].text; list.push(c); }
    // своя тема без ассоциаций: «на букву …» как редкий ход со 2-го круга
    if (w && !w.ak.length && round >= 2 && w.first && /[а-я]/.test(w.first)) {
      const t = 'буква ' + w.first.toUpperCase();
      if (!G.saidNorm.has(U.norm(t))) list.push({kind: 'l', text: t});
    }
    if (!list.length) return {text: fallbackText(), H: 0.5};

    const accused = G.accusedMe.size > 0;
    // доказать своим (уверенные — сильнее), не выдать шпиону (осторожные — сильнее)
    // уже доказал своим, что знаешь слово, — дальше важнее не подсказать шпиону (убывающая отдача)
    const aP = (0.6 + 0.7 * T.confidence) * (round >= 2 ? 1.25 : 1) * (accused ? 1.3 : 1) / (1 + D.proofDecay * clip(0.4 + 0.1 * G.nPl, 0.7, 1.6) * G.myProof);
    // чем больше игроков, тем больше подсказок услышит шпион — каждому нужно быть осторожнее
    const crowd = clip(0.4 + 0.1 * G.nPl, 0.7, 1.6);
    const aL = D.leak * crowd * (0.3 + 1.2 * T.caution) * (round >= 2 ? 0.85 : 1) * (accused ? 0.75 : 1);
    // вкус: осторожные любят тонкие и «общие на несколько слов» ассоциации, болтливые — самые очевидные
    const style = T.caution - 0.5;
    const lpsCache = new Map();
    const util = list.map(c => {
      const ev = c.kind === 'l' ? evalText(c.text) : evalKey(c.k);
      let lps = lpsCache.get(ev); if (lps === undefined) { lps = Math.log(Pspy(ev, G.q, G.pm, D.eta)); lpsCache.set(ev, lps); }
      const llr = G.jStar >= 0 ? llrOf(ev, G.jStar, lps, null, true) : 0;
      const proof = (c.kind === 'a' ? recogFwd(c.rank) : 1) * llr;              // поймут ли свои
      const leak = ci >= 0 ? leakOf(ev, ci) : 0;               // насколько догадается шпион
      let taste = 0;
      if (c.kind === 'a') {
        let share = 0; for (const pp of L.keys[c.k].post) if (L.words[pp.j].p === w.p) share++;
        taste = style * (0.22 * (c.rank - 4) + 0.5 * Math.log(share));
      } else if (c.kind === 'g') taste = style * 1.2;
      else if (c.kind === 'v') taste = style * 1.2 - 0.4;       // «вода» — запасной вариант, generic всегда приятнее
      c.proof = proof; c.leak = leak;
      return aP * proof - aL * leak + taste - (c.kind === 'l' ? 2.0 : 0) - pastPen(c.k != null ? L.keys[c.k].n : U.norm(c.text)) + gauss(r) * 0.15 * T.noise;
    });
    const temp = 0.45 * D.temp * (0.6 + T.noise) * G.fatigue * (round >= 3 ? 1.1 : 1);
    const probs = U.softmax(util, temp);
    let choice = U.weightedPick(list, probs, r);
    // человеческие ошибки (Новичок чаще): случайная из своих или «перепутал» с соседним словом
    const slip = T.slip * D.mist;
    if (r() < slip) {
      if (r() < 0.3 && w) {
        const alt = confusedClue(w);
        if (alt) { choice = alt; note('Ошибка: перепутал(а) с соседним словом → «' + alt.text + '»'); }
      } else {
        const nv = list.filter(c => c.kind !== 'v');
        choice = U.pick(nv.length ? nv : list, r); note('Ошибка: подсказка наугад');
      }
    }
    G.myProof += Math.max(0, choice.proof ?? 0);
    note(`Подсказка «${choice.text}»: доказ. ${(choice.proof ?? 0).toFixed(2)}, риск ${(choice.leak ?? 0).toFixed(2)}`);
    return {text: choice.text, H: entropyN(probs)};
  }
  // «Перепутал»: ассоциация соседнего слова (делит с моим словом хотя бы одну ассоциацию)
  function confusedClue(w) {
    const L = G.L;
    const mine = new Set(w.ak);
    const nb = new Set();
    for (const k of w.ak) for (const pp of L.keys[k].post) if (pp.j !== G.jStar && L.words[pp.j].p === w.p) nb.add(pp.j);
    const arr = U.shuffle([...nb], r);
    for (const j of arr) for (const k of L.words[j].ak) if (!mine.has(k) && usable(k)) return {k, kind: 'x', text: L.keys[k].text};
    return null;
  }

  /* ---------- подсказка в режиме undercover ----------
     sepW — насколько подсказка «моя», а не похожего слова: доказывает своим, но и подставному подсказывает, что он не в теме.
     Если подозреваю, что подставной — я, подстраиваюсь под вероятное слово большинства (blend), не выдавая своё. */
  function ucClue(ctx) {
    const L = G.L, uc = G.uc;
    const round = ctx.round || G.maxRound;
    const post = ucPost();
    const pM = post.pM, pW = pM[0], nS = uc.S.length;
    const w = L.words[G.jStar];
    const cands = [];
    for (let t = 0; t < w.ak.length; t++) { const i = w.ar[t]; if (knowsFwd(G.jStar, i)) cands.push({k: w.ak[t], kind: 'a', rank: i}); }
    for (const k of L.genKeys[w.p] || []) cands.push({k, kind: 'g'});
    for (const k of U.shuffle(L.vagueKeys, r).slice(0, 5)) cands.push({k, kind: 'v'});
    if (post.pOdd > 0.12) {
      const order = Array.from({length: nS - 1}, (_, s) => s + 1).filter(s => pM[s] > 0.04).sort((a, b) => pM[b] - pM[a]).slice(0, 2);
      for (const s of order) {
        const j = uc.S[s], x = L.words[j];
        for (let t = 0; t < x.ak.length; t++) if (knowsGen(j, x.ar[t])) cands.push({k: x.ak[t], kind: 'b', rank: x.ar[t]});
      }
    }
    const list = [], seen = new Set();
    for (const c of cands) { if (seen.has(c.k) || !usable(c.k)) continue; seen.add(c.k); c.text = L.keys[c.k].text; list.push(c); }
    if (!list.length) return {text: fallbackText(), H: 0.5};
    const accused = G.accusedMe.size > 0;
    const crowd = clip(0.4 + 0.1 * G.nPl, 0.7, 1.6);
    const aP = (0.6 + 0.7 * T.confidence) * (round >= 2 ? 1.2 : 1) * (accused ? 1.3 : 1) / (1 + D.proofDecay * crowd * G.myProof);
    // «не спугнуть»: в первом круге, пока подставной, возможно, ещё не сказал своё, точная подсказка выдаёт слово —
    // чем больше игроков говорят после меня, тем дороже; потом — дешевле
    const spokeNow = G.entries.filter(e => e.round === round).length;
    const after = Math.max(0, G.nPl - 1 - spokeNow) / Math.max(1, G.nPl - 1);
    const aL = aP * D.ucLeak * (0.2 + 0.9 * T.caution) * (round === 1 ? 0.5 + after : 0.5) * (accused ? 0.7 : 1);
    const aB = (0.7 + 0.6 * T.confidence) * (accused ? 1.3 : 1);
    const style = T.caution - 0.5;
    const util = list.map(c => {
      const row = ucRow(evalKey(c.k));
      const sepW = ucSep(row, uc.SU[0], uc.decU, round);           // как меня увидят, если слово большинства — моё
      let blend = 0;                                                // …и если слово большинства — другое (подставной — я)
      for (let s = 1; s < nS; s++) if (pM[s] > 0.01) blend += pM[s] * ucSep(row, uc.SU[s], [uc.SU[0]], round);
      const taste = c.kind === 'g' ? style * 1.0 : (c.kind === 'v' ? style - 0.5 : (c.kind === 'a' ? style * 0.15 * (c.rank - 4) : 0));
      c.sep = sepW;
      const civ = aP * sepW - aL * Math.max(0, sepW - 0.3);
      return pW * civ + aB * blend + taste - pastPen(L.keys[c.k].n) + gauss(r) * 0.15 * T.noise;
    });
    const temp = 0.45 * D.temp * (0.6 + T.noise) * G.fatigue * (round >= 3 ? 1.1 : 1);
    const probs = U.softmax(util, temp);
    let choice = U.weightedPick(list, probs, r);
    if (r() < T.slip * D.mist) { const nv = list.filter(c => c.kind !== 'v'); choice = U.pick(nv.length ? nv : list, r); note('Ошибка: подсказка наугад'); }
    G.myProof += Math.max(0, choice.sep || 0) * pW;
    note(`Undercover: «${choice.text}» (${choice.kind}), «своя» ${(choice.sep ?? 0).toFixed(2)}, подставной — я? ${post.pOdd.toFixed(2)}`);
    return {text: choice.text, H: entropyN(probs)};
  }

  /* ---------- подсказка шпиона ---------- */
  // m самых вероятных (частичный отбор вставками: m ≪ n, без сортировки всего массива)
  function topIdx(q, m) {
    m = Math.min(m, q.length);
    const out = [];   // индексы по убыванию q; при равенстве — по возрастанию индекса (как устойчивая сортировка)
    if (m <= 0) return out;
    for (let i = 0; i < q.length; i++) {
      const v = q[i];
      if (out.length === m) { if (v <= q[out[m - 1]]) continue; out.pop(); }
      let k = out.length;
      out.push(i);
      while (k > 0 && q[out[k - 1]] < v) { out[k] = out[k - 1]; k--; }
      out[k] = i;
    }
    return out;
  }
  function lastPosterior() {
    if (!G.lastEv.length || !G.q.length) return null;
    const n = G.q.length;
    const ql = new Float64Array(n).fill(1 / n);
    for (const ev of G.lastEv) {
      const ps = Pspy(ev, ql, packMass(ql), 1);
      let z = 0;
      for (let i = 0; i < n; i++) { ql[i] *= (1 - G.rhoSpy) * Pk(ev, G.cand[i]) + G.rhoSpy * ps; z += ql[i]; }
      for (let i = 0; i < n; i++) ql[i] /= z || 1;
    }
    return ql;
  }
  function spyClue(ctx) {
    const L = G.L;
    const round = ctx.round || G.maxRound;
    const M = D.topM + (P.style === 'sly' ? 2 : 0);
    const top = topIdx(G.q, M);
    const cands = [];
    const seen = new Set();
    const push = (k, kind) => { if (k < 0 || seen.has(k) || !usable(k)) return; seen.add(k); cands.push({k, kind, text: L.keys[k].text}); };
    for (const ci of top) {
      const j = G.cand[ci], w = L.words[j];
      for (let t = 0; t < w.ak.length; t++) if (knowsRev(j, w.ar[t])) push(w.ak[t], 'a');
    }
    // слова, на которые (по памяти шпиона) указали две последние чужие подсказки, — их можно «подхватить»
    const recentWords = new Set();
    for (const ev of G.lastEv) {
      const arr = [...ev.A].filter(([j]) => G.candPos[j] >= 0).sort((a, b) => b[1] - a[1]).slice(0, 4);
      for (const [j] of arr) recentWords.add(j);
    }
    if (T.mimic >= 0.5) for (const j of recentWords) {
      const w = L.words[j];
      for (let t = 0; t < w.ak.length; t++) if (knowsRev(j, w.ar[t])) push(w.ak[t], 'a');
    }
    const packOrder = Array.from(G.pm.keys()).sort((a, b) => G.pm[b] - G.pm[a]).slice(0, 2);
    for (const p of packOrder) if (G.pm[p] > 0.05) for (const k of L.genKeys[p] || []) push(k, 'g');
    for (const k of U.shuffle(L.vagueKeys, r).slice(0, 8)) push(k, 'v');
    if (top.length && !L.hasAssoc[L.words[G.cand[top[0]]].p] && round >= 2) {
      for (const ci of top.slice(0, 3)) {
        const f = L.words[G.cand[ci]].first;
        if (!f || !/[а-я]/.test(f)) continue;
        const t = 'буква ' + f.toUpperCase();
        if (!G.saidNorm.has(U.norm(t)) && !cands.some(c => c.text === t)) cands.push({kind: 'l', text: t});
      }
    }
    if (!cands.length) return {text: fallbackText(), H: 0.5};
    // подражание: (1) «подхватить» слово, на которое указали последние подсказки; (2) говорить в том же стиле,
    // что и остальные (все конкретны — не быть единственным расплывчатым), но не повторять дословно
    const ql = lastPosterior();
    const qlpm = ql ? packMass(ql) : null;
    const mu = 0.1 + 0.35 * T.mimic;
    // блеф: иногда шпион рискует — бьёт в самое вероятное слово, а не в «безопасную середину»
    const kappa = D.spyRisk * (0.3 + T.caution) * (G.bluff ? -0.6 : 1);
    const recent = G.lastEv.length ? G.lastEv : [];
    const specific = recent.length ? recent.filter(ev => ev.A.size > 0).length / recent.length : 0.5;
    const util = cands.map(c => {
      const ev = c.kind === 'l' ? evalText(c.text) : evalKey(c.k);
      const lps = Math.log(Pspy(ev, G.q, G.pm, D.eta));
      const em = expLLR(ev, G.q, G.pm, lps);
      const mm = ql ? expLLR(ev, ql, qlpm, lps).mean : em.mean;
      const styleFit = T.mimic * 0.6 * (c.kind === 'a' ? specific - 0.5 : 0.5 - specific);
      let follow = 0;      // «подхватить» мысль предыдущих игроков — другим словом, но про то же
      if (c.kind === 'a' && recentWords.size) for (const pp of L.keys[c.k].post) if (recentWords.has(pp.j)) { follow = T.mimic * 1.3; break; }
      c.fit = em.mean; c.risk = em.std;
      return (1 - mu) * em.mean + mu * mm + styleFit + follow - kappa * em.std - (c.kind === 'l' ? 1.0 : 0)
        - 0.6 * pastPen(c.k != null ? L.keys[c.k].n : U.norm(c.text)) + gauss(r) * 0.2 * T.noise;
    });
    const temp = 0.35 * D.temp * (0.6 + T.noise) * G.fatigue;
    const probs = U.softmax(util, temp);
    let choice = U.weightedPick(cands, probs, r);
    if (r() < T.slip * D.mist * 0.5) choice = U.pick(cands, r);
    note(`Шпион: «${choice.text}» (подходит ${(choice.fit ?? 0).toFixed(2)}, разброс ${(choice.risk ?? 0).toFixed(2)})`);
    return {text: choice.text, H: entropyN(probs)};
  }

  /* ---------- голосование ---------- */
  function plackett(items, logits, need, temp) {
    const picks = [];
    const it = items.slice(), lg = logits.slice();
    while (picks.length < need && it.length) {
      const pr = U.softmax(lg, temp);
      const x = U.weightedPick(it.map((_, i) => i), pr, r);
      picks.push(it[x]); it.splice(x, 1); lg.splice(x, 1);
    }
    return picks;
  }
  function doVote(ctx) {
    const need = Math.max(1, ctx.need || G.K || 1);
    const spy = G.role === 'spy';
    const {ids, S} = suspicion(spy);
    let items = ids.slice(), lg = S.slice();
    if (spy && G.fellows.size) {
      const keep = items.map((id, i) => !G.fellows.has(id) ? i : -1).filter(i => i >= 0);
      if (keep.length >= need) { items = keep.map(i => ids[i]); lg = keep.map(i => S[i]); }
    }
    const temp = D.voteT * (1.25 - 0.5 * T.confidence) * (0.8 + 0.5 * T.noise) * G.fatigue;
    let nsLogit = null;
    if (ctx.allowNoSpy) {
      // «шпиона нет» — если даже наименее убедительный игрок уверенно подходит к слову
      const nOthers = Math.max(1, ids.length);
      const wE = D.evid * (0.75 + 0.5 * T.confidence);
      let minE = Infinity; for (const id of ids) minE = Math.min(minE, G.lastEvid.get(id) ?? 0);
      if (!isFinite(minE)) minE = 0;
      nsLogit = Math.log(NOSPY_PRIOR / (1 - NOSPY_PRIOR) * nOthers / need) + NOSPY_BIAS + wE * clip(minE, -2, 4)
        - 0.3 * (1 - T.confidence) + (spy ? 0.3 : 0);
    }
    const allItems = nsLogit != null ? items.concat(['nospy']) : items;
    const allLg = nsLogit != null ? lg.concat([nsLogit]) : lg;
    const pr = U.softmax(allLg, temp);
    const H = entropyN(pr);
    if (!items.length) return {picks: nsLogit != null ? ['nospy'] : [], H};
    const first = U.weightedPick(allItems.map((_, i) => i), pr, r);
    if (allItems[first] === 'nospy') { note('Голос: шпиона нет'); return {picks: ['nospy'], H}; }
    const picks = [allItems[first]];
    if (need > 1) {
      const restI = items.map((id, i) => i).filter(i => items[i] !== picks[0]);
      picks.push(...plackett(restI.map(i => items[i]), restI.map(i => lg[i]), need - 1, temp));
    }
    note('Голос: ' + picks.map(nameOf).join(', '));
    return {picks, H};
  }

  /* ---------- угадывание слова шпионом ---------- */
  function doGuess(ctx) {
    const opts = (ctx.options || []).filter(o => typeof o === 'string' && o);
    if (!opts.length) return {word: '', H: 0};
    if (G.role !== 'spy') {
      const mine = opts.find(o => U.norm(o) === U.norm(G.word || ''));
      return {word: mine || U.pick(opts, r), H: 0};
    }
    const L = G.L;
    const byNorm = new Map();
    G.cand.forEach((j, ci) => { const n = L.words[j].n; byNorm.set(n, (byNorm.get(n) || 0) + G.q[ci]); });
    const tiny = 0.2 / Math.max(1, G.cand.length);
    const ps = opts.map(o => {
      const n = U.norm(o);
      if (byNorm.has(n)) return byNorm.get(n);
      // нет точного совпадения — ищем по написанию (опечатки/регистр); в огромном списке не ищем
      if (G.cand.length > 400) return tiny;
      let best = 0, bp = 0;
      const sn = U.stem(n);
      G.cand.forEach((j, ci) => { const w = L.words[j]; const s = simFast(n, sn, w.n, U.stem(w.n), 0.85); if (s > best) { best = s; bp = G.q[ci]; } });
      return best >= 0.85 ? bp : tiny;
    });
    const z = ps.reduce((a, b) => a + b, 0) || 1;
    const logits = ps.map(p => Math.log(Math.max(p / z, 1e-9)));
    const pr = U.softmax(logits, D.guessT * (0.7 + T.noise));
    const word = U.weightedPick(opts, pr, r);
    note('Угадываю: ' + word);
    return {word, H: entropyN(pr)};
  }

  /* ---------- реплики-обвинения ---------- */
  function phrase(cat, target, extra) {
    const pool = (PHRASES[cat] || PHRASES.gut).slice();
    const dat = dative(target);
    const ok = pool.filter(t => (dat || !t.includes('{dat}')) && (extra.clue || !t.includes('{clue}')));
    const tpl = ok.length ? U.pick(ok, r) : U.pick(PHRASES.gut.filter(t => !t.includes('{dat}')), r);
    return tpl
      .replace(/\{([^{}|]*)\|([^{}|]*)\}/g, (_, m, f) => gender === 'f' ? f : m)
      .replace(/\{name\}/g, target)
      .replace(/\{dat\}/g, dat || target)
      .replace(/\{clue\}/g, extra.clue || '');
  }
  function doAccuse(ctx) {
    const round = ctx.round || G.maxRound;
    if (G.accusedRounds.has(round)) return null;
    const spy = G.role === 'spy';
    const {ids, S} = suspicion(spy);
    let items = ids.slice(), lg = S.slice();
    if (spy) {
      const keep = items.map((id, i) => !G.fellows.has(id) ? i : -1).filter(i => i >= 0);
      items = keep.map(i => ids[i]); lg = keep.map(i => S[i]);
    }
    if (!items.length) return null;
    const pr = U.softmax(lg, 1);
    const base = G.K / Math.max(1, ids.length);
    const pTop = Math.min(0.99, G.K * Math.max(...pr) * (items.length / Math.max(1, ids.length)));
    let conf = clip((pTop - base) / Math.max(0.05, 1 - base), 0, 1);
    if (spy) {   // шпион «отводит» подозрение: говорит, когда подозревают его самого
      const mine = (G.accusers.get(selfId) || new Set()).size;
      conf = clip(conf * 0.6 + 0.25 * mine + (P.style === 'sly' ? 0.15 : 0), 0, 1);
    } else if (G.uc) {   // «подставной, кажется, я» — перевожу стрелки
      const po = ucPost().pOdd;
      if (po > 0.4) conf = clip(conf * 0.7 + 0.35 * po + 0.2 * (G.accusers.get(selfId) || new Set()).size, 0, 1);
    }
    const pAcc = clip(0.75 * T.chatty * (0.35 + (0.8 + T.suspicion) * conf) + 0.15 * (T.suspicion - 0.5), 0, 0.85);
    if (r() >= pAcc) return null;
    const to = U.weightedPick(items, U.softmax(lg, 0.6), r);
    const p = rec(to);
    const tName = nameOf(to);
    const worst = spy ? p.worstPub : p.worst;
    let cat;
    const x = r();
    if (!spy && G.accusedMe.has(to) && x < 0.5) cat = 'retaliate';
    else if (p.skips && x < 0.6) cat = 'skip';
    else if (worst && worst.v < -0.8 && x < 0.6) cat = 'clue';
    else if ((G.accusers.get(to) || new Set()).size && x < 0.5) cat = 'herd';
    else if (conf < 0.15 && x < 0.5) cat = 'unsure';
    else cat = r() < 0.55 ? P.style : 'gut';
    const clueTxt = worst && worst.text && worst.text.length <= 22 ? worst.text : '';
    const text = phrase(cat === 'clue' && !clueTxt ? 'gut' : cat, tName, {clue: clueTxt});
    G.accusedRounds.add(round);
    note(`Обвиняю ${tName} (уверенность ${conf.toFixed(2)})`);
    return {to, text};
  }

  /* ---------- живые реплики (Brain.chat) ---------- */
  const STYLE_ALIAS = {civWinRight: 'civWin', civWinMiss: 'civWin', ucCivWin: 'civWin', civLoseRight: 'civLose', civLoseGuessed: 'civLose',
    ucCivLose: 'civLose', spyGuessed: 'spyWin', ucKnewWin: 'spyWin', defendSpy: 'defend', defendUc: 'defend'};
  function fillLine(tpl, vars) {
    let ok = true;
    const out = tpl
      .replace(/\{([^{}|]*)\|([^{}|]*)\}/g, (_, m, f) => gender === 'f' ? f : m)
      .replace(/\{(name|dat|clue|mine|other|spy)\}/g, (_, k) => { const v = vars[k]; if (!v) ok = false; return v || ''; });
    return ok ? out : null;
  }
  // Реплика категории cat: характерные — чаще, недавние (у любого бота, между партиями) — в последнюю очередь;
  // никогда — со словом/однокоренным (своё слово + extra — например, раскрытые на итоге слова)
  function chatLine(cat, vars, extra) {
    const per = ((CHAT_STYLE[P.style] || {})[STYLE_ALIAS[cat] && !(CHAT_STYLE[P.style] || {})[cat] ? STYLE_ALIAS[cat] : cat]) || [];
    const gen = CHAT[cat] || [];
    const items = per.map(t => ({t, k: r() * 1.8})).concat(gen.map(t => ({t, k: r()}))).sort((a, b) => b.k - a.k);
    const fresh = items.filter(x => !RECENT_LINES.includes(x.t)), stale = items.filter(x => RECENT_LINES.includes(x.t));
    // свое слово; в undercover — и похожие (вдруг одно из них — слово мирных); шпиону — самые вероятные кандидаты
    const guessW = G.role === 'spy' && G.q.length ? topIdx(G.q, 3).map(ci => G.L.words[G.cand[ci]].w) : [];
    const words = [G.word, ...(G.uc ? G.uc.near.map(o => o.w) : []), ...guessW, ...(extra || [])].filter(x => typeof x === 'string' && x);
    if (vars.name && vars.dat === undefined) vars.dat = dative(vars.name);
    for (const {t} of fresh.concat(stale)) {
      if (G.usedLines.has(t)) continue;
      const text = fillLine(t, vars);
      if (!text || text.length > CHAT_MAX) continue;
      if (words.some(wd => mentionsWord(text, wd))) continue;
      G.usedLines.add(t);
      RECENT_LINES.push(t); if (RECENT_LINES.length > 60) RECENT_LINES.shift();
      return text;
    }
    return null;
  }
  const isGV = kind => kind === 'g' || kind === 'v';
  // Реакция на чужую подсказку: со смыслом (сомнение к конкретной подсказке, согласие), частота — по болтливости и «интересности»
  function chatClue(ctx) {
    let e = ctx.entry;
    const about = ctx.about != null ? ctx.about : (e && e.id);
    if ((!e || e.id == null) && Array.isArray(ctx.history)) for (let i = ctx.history.length - 1; i >= 0; i--) if (ctx.history[i] && ctx.history[i].id === about) { e = ctx.history[i]; break; }
    if (!e || e.id == null || e.id === selfId) return null;
    ingest(e);
    let round = e.round;
    if (round == null) { for (let i = G.entries.length - 1; i >= 0; i--) if (G.entries[i].id === e.id) { round = G.entries[i].round; break; } }
    const key = e.id + '|' + round;
    if (G.chatted.has(key)) return null;
    const ev = G.evals.get(key) || {kind: e.text ? 'o' : 'skip', x: 0};
    let cat, interest;
    if (ev.kind === 'skip') { cat = 'skip'; interest = 1.1; }
    else if (G.role === 'spy') {
      // шпион играет роль: поддакивает «понятным» подсказкам, цепляется к расплывчатым, напарника прикрывает
      if (G.fellows.has(e.id)) { cat = r() < 0.6 ? 'agree' : 'hmm'; interest = 0.5; }
      else if (isGV(ev.kind) || ev.kind === 'o') { cat = 'vague'; interest = 1.1; }
      else if (ev.x > 1.5) { cat = 'agree'; interest = 0.8; }
      else { cat = G.bluff && r() < 0.5 ? 'bluff' : 'hmm'; interest = 0.45; }
    } else if (G.uc) {
      const po = ucPost().pOdd;
      if (po > 0.55) {
        // кажется, подставной — я: честные характеры иногда проговариваются, остальные поддакивают
        if (r() < 0.12 + 0.4 * T.slip + (P.style === 'newbie' || P.style === 'kind' ? 0.12 : 0)) { cat = 'selfDoubt'; interest = 1.0; }
        else if (ev.x < -1) { cat = 'agree'; interest = 0.7; }
        else { cat = 'hmm'; interest = 0.4; }
      } else if (ev.x > 1) { cat = 'agree'; interest = 0.8; }
      else if (ev.x < -1) { cat = 'doubt'; interest = 1.5; }
      else if (isGV(ev.kind)) { cat = 'vague'; interest = 0.8; }
      else { cat = 'hmm'; interest = 0.35; }
    } else {
      if (ev.x < -0.8) { cat = 'doubt'; interest = 1.5; }
      else if (isGV(ev.kind)) { cat = 'vague'; interest = 0.9; }
      else if (ev.x > 1 && ev.kind === 'a') { cat = 'agree'; interest = 0.8; }
      else { cat = 'hmm'; interest = 0.35; }
    }
    const recent = G.entries.length - G.lastChatAt <= 2;
    const p = clip((0.05 + 0.45 * T.chatty) * interest * (recent ? 0.35 : 1), 0, 0.8);
    if (r() >= p) return null;
    const text = chatLine(cat, {name: nameOf(e.id), clue: e.text && e.text.length <= 24 ? e.text : ''});
    if (!text) return null;
    G.chatted.add(key); G.lastChatAt = G.entries.length;
    note(`Реплика (${cat}): ${text}`);
    return {text, thinkMs: thinkFor('chat', 0.3)};
  }
  // Защита, когда обвинили: не раскрывая слово; шпион блефует и переводит стрелки
  function chatAccused(ctx) {
    let from = ctx.about;
    if (from == null || from === selfId) {
      const f = (ctx.feed || []).slice().reverse().find(x => x && x.kind === 'accuse' && x.to === selfId);
      from = f ? f.from : null;
    }
    if (from != null && from !== selfId) ingestAccuse(from, selfId);
    const round = ctx.round || G.maxRound;
    const key = from + '|' + round;
    if (G.defended.has(key)) return null;
    G.defended.add(key);
    const po = G.uc ? ucPost().pOdd : 0;
    const spyish = G.role === 'spy' || po > 0.5;
    if (r() >= clip(0.45 + 0.45 * T.chatty + (spyish ? 0.15 : 0), 0, 0.95)) return null;
    let cat = 'defend';
    if (G.role === 'spy' && r() < 0.5) cat = 'defendSpy';
    else if (po > 0.5 && r() < 0.35) cat = 'defendUc';
    let other = '';
    if (cat === 'defendSpy') {
      const {ids, S} = suspicion(G.role === 'spy');
      let best = null, bv = -Infinity;
      ids.forEach((id, i) => { if (id !== from && !G.fellows.has(id) && S[i] > bv) { bv = S[i]; best = id; } });
      if (best != null) other = nameOf(best);
    }
    const mine = G.myClues.length ? G.myClues[G.myClues.length - 1] : '';
    const vars = {name: from != null ? nameOf(from) : '', mine: mine.length <= 24 ? mine : '', other};
    const text = chatLine(cat, vars) || (cat !== 'defend' ? chatLine('defend', vars) : null);
    if (!text) return null;
    G.lastChatAt = G.entries.length;
    note(`Защищаюсь: ${text}`);
    return {text, thinkMs: thinkFor('chat', 0.5)};
  }
  // Реакция на итог: радость или оправдание (один раз за партию)
  function chatReveal(ctx) {
    const res = ctx.result;
    if (!res || typeof res !== 'object' || G.revealChat) return null;
    G.revealChat = true;
    const spies = Array.isArray(res.spies) ? res.spies : [];
    const meSpy = spies.includes(selfId);
    const accusedMe = Array.isArray(res.accused) && res.accused.includes(selfId);
    const caughtMe = Array.isArray(res.caught) && res.caught.includes(selfId);
    const myVote = (Array.isArray(res.votes) ? res.votes : []).find(v => v && v.from === selfId);
    const votedRight = !!(myVote && Array.isArray(myVote.to) && myVote.to.some(id => spies.includes(id)));
    const ucMode = res.mode === 'undercover' || !!G.uc;
    const pending = !!res.guessNeeded && res.final === false;
    // запасная память: какие подсказки уже звучали к этому слову
    if (!envPast && typeof res.word === 'string' && res.word) { const wn = U.norm(res.word); for (const e of G.entries) if (e.text) memAdd('w:' + wn, U.norm(e.text)); }
    let cat;
    if (res.noSpy) cat = res.reason === 'noSpyRight' ? 'noSpyRight' : 'noSpyWrong';
    else if (meSpy) {
      if (pending && caughtMe) cat = 'spyPending';
      else if (ucMode && r() < 0.65) cat = G.uc && ucPost().pOdd > 0.5 ? (res.winner === 'spies' ? 'ucKnewWin' : 'ucKnew') : 'ucSurprise';
      else if (res.winner === 'spies') cat = res.reason === 'guessed' ? 'spyGuessed' : 'spyWin';
      else if (res.winner === 'draw') cat = 'tie';
      else cat = 'spyLose';
    } else if (pending) cat = 'civPending';
    else if (res.winner === 'players') cat = ucMode && r() < 0.3 ? 'ucCivWin' : (votedRight ? (r() < 0.6 ? 'civWinRight' : 'civWin') : (r() < 0.5 ? 'civWinMiss' : 'civWin'));
    else if (res.winner === 'draw') cat = 'tie';
    else if (res.reason === 'guessed') cat = 'civLoseGuessed';
    else cat = ucMode && r() < 0.3 ? 'ucCivLose' : (votedRight && r() < 0.6 ? 'civLoseRight' : 'civLose');
    if (r() >= clip(0.3 + 0.5 * T.chatty + (meSpy || accusedMe ? 0.3 : 0), 0, 0.95)) return null;
    const spyName = spies.length ? nameOf(spies.find(id => id !== selfId) ?? spies[0]) : '';
    const text = chatLine(cat, {spy: spyName}, [res.word, res.decoy]);
    if (!text) return null;
    note(`Итог (${cat}): ${text}`);
    return {text, thinkMs: thinkFor('chat', 0.4)};
  }

  /* =====================================================================
     Публичный интерфейс Brain (SPEC §3)
     ===================================================================== */
  const brain = {
    start(info) {
      info = info || {};
      findSelf();
      games++;
      const packsIn = (env.packs && env.packs.length ? env.packs : (Spy.data && Spy.data.packs) || []).filter(p => p && Array.isArray(p.words));
      let packs = packsIn.slice();
      const role = info.role === 'spy' ? 'spy' : 'word';
      let packIdx = info.packId != null ? packs.findIndex(p => p.id === info.packId) : -1;
      if (packIdx < 0 && info.packId != null && Spy.data && typeof Spy.data.get === 'function') {
        const p = Spy.data.get(info.packId);
        if (p && Array.isArray(p.words)) { packs.push(p); packIdx = packs.length - 1; }
      }
      if (role === 'word' && info.word) {
        if (packIdx < 0) { packs.push({id: info.packId || 'custom', title: '', generic: [], words: [{w: info.word, a: []}]}); packIdx = packs.length - 1; }
        else if (!packs[packIdx].words.some(w => w && U.norm(w.w) === U.norm(info.word))) {
          packs[packIdx] = Object.assign({}, packs[packIdx], {words: packs[packIdx].words.concat([{w: info.word, a: []}])});
        }
      }
      const L = getLex(packs);
      let cand;
      if (role === 'spy') cand = info.packKnown !== false && packIdx >= 0 ? L.packWords[packIdx].slice() : L.words.map((_, j) => j);
      else cand = packIdx >= 0 ? L.packWords[packIdx].slice() : L.words.map((_, j) => j);
      const candPos = new Int32Array(L.words.length).fill(-1);
      cand.forEach((j, i) => { candPos[j] = i; });
      const n = cand.length;
      const q = new Float64Array(n).fill(n ? 1 / n : 0);
      const pu = new Float64Array(L.P);
      for (const j of cand) pu[L.words[j].p] += 1 / (n || 1);
      const K = Math.max(1, info.spiesCount || 1);
      const fellows = new Set((info.fellowSpies || []).filter(id => id !== selfId));
      const nPl = Math.max(3, (env.players || []).length || 6);
      let jStar = -1;
      if (role === 'word' && info.word && packIdx >= 0) {
        const wn = U.norm(info.word);
        jStar = L.packWords[packIdx].find(j => L.words[j].n === wn) ?? -1;
      }
      G = {
        role, word: role === 'word' ? (info.word || null) : null, packIdx, packKnown: info.packKnown !== false,
        L, cand, candPos, q, pu, pm: null, jStar, K, fellows, noSpyPossible: !!info.noSpyPossible,
        rhoPub: clip(0.3 + (K - 1) / (nPl - 1), 0, 0.5),     // модель «как рассуждает шпион» для оценки риска
        rhoSpy: clip(D.rho + (fellows.size ? 0 : (K - 1) / (nPl - 1)), 0, 0.5),
        seen: new Set(), cnt: new Map(), entries: [], pl: new Map(), said: [], saidNorm: new Set(), blocked: new Set(),
        accusers: new Map(), accSeen: new Set(), accusedMe: new Set(), accusedRounds: new Set(),
        evCache: new Map(), closeCache: new Map(), lastEv: [], notes: [], maxRound: 1,
        fatigue: 1 + 0.03 * Math.min(games - 1, 8),
        wordToks: null, bm: new Float64Array(n), bmList: [], Bq: 0, Bu: 0, lastEvid: new Map(), myProof: 0, nPl,
        evals: new Map(), myClues: [], chatted: new Set(), defended: new Set(), usedLines: new Set(), lastChatAt: -9, revealChat: false,
        past: new Map(), memKey: 'b:' + name + ':' + (packIdx >= 0 ? packs[packIdx].id : '?'), bluff: false, uc: null,
        mode: (info.mode || env.mode) === 'undercover' ? 'undercover' : 'classic',
      };
      G.pm = packMass(q);
      if (G.word) { const wn = U.norm(G.word); G.wordToks = wn.split(/[\s-]+/).filter(Boolean).map(t => [t, U.stem(t)]); G.word = wn; }
      for (const p of env.players || []) if (p && p.id !== selfId) rec(p.id);
      // undercover: бот не знает, шпион ли он, — держит гипотезы «у большинства моё слово / похожее»

    // PeerJS подключается <script async>: если тег есть, а window.Peer ещё нет — ждём до T.peerWait
    available() {

    const ep = {keys, me, bus: null, vcs: new Map(), tx: Promise.resolve(), rx: Promise.resolve(), dead: false, handle: null,
      q: [], ret: new Map(), flushT: null, flushQ: false};
    // Исходящие: очередь + пачки. Всё, что накопилось для одной темы, уходит одной публикацией — массивом [obj, …]
    // (≤ relayBatch байт), в темпе bus.rateWait. retained-темы (meta, снимки view) хранят только последнее значение
    // и уступают очереди, но не дольше relayRetLag. Порядок публикаций в теме = порядок вызовов (цепочка ep.tx).
    ep.pub = (topic, obj, qos, retain) => {
      if (retain) { const prev = ep.ret.get(topic); ep.ret.set(topic, {obj, qos, at: prev ? prev.at : clock.now()}); }
      else {
        const s = JSON.stringify(obj);
        ep.q.push({topic, s, len: utf8Len(s), qos});
        if (ep.q.length > 2000) ep.q.shift();
      }
      if (!ep.flushQ) { ep.flushQ = true; Promise.resolve().then(() => { ep.flushQ = false; ep.flush(); }); }   // синхронная серия — одной пачкой
    };
    ep.flush = () => {
      const bus = ep.bus;
      if (ep.flushT || !bus) return;
      while (ep.q.length || ep.ret.size) {
        if (bus.dead) { ep.q = []; ep.ret.clear(); return; }
        if (!bus.up()) return;   // ни одного брокера — копим (пачки крупнее); bus.onUp позовёт снова
        const w = bus.rateWait();
        if (w > 0) { ep.flushT = clock.setTimeout(() => { ep.flushT = null; ep.flush(); }, w); return; }
        bus.rateTake();
        let topic, str, qos = 0, retain = false;
        const r0 = ep.ret.size ? ep.ret.entries().next().value : null;
        if (r0 && (!ep.q.length || clock.now() - r0[1].at >= T.relayRetLag)) {
          ep.ret.delete(r0[0]);
          topic = r0[0]; qos = r0[1].qos; retain = true;
          str = r0[1].obj === null ? null : '[' + JSON.stringify(r0[1].obj) + ']';
        } else {
          topic = ep.q[0].topic;
          const parts = []; let size = 2;
          for (let i = 0; i < ep.q.length;) {
            const x = ep.q[i];
            if (x.topic !== topic) { i++; continue; }
            if (parts.length && size + x.len > T.relayBatch) break;
            parts.push(x.s); size += x.len + 1; if (x.qos) qos = 1;
            ep.q.splice(i, 1);
          }
          str = '[' + parts.join(',') + ']';
        }
        ep.tx = ep.tx.then(() => (str === null ? EMPTY : seal(ctx, keys.key, str)))
          .then(b => { if (ep.bus) ep.bus.publish(topic, b, qos, retain); }, e => dbg('relay seal', e && e.message));
      }
    };
    // дождаться, пока очередь уйдёт в брокеры (не дольше ms)
    ep.idle = ms => new Promise(res => {
      const t0 = clock.now();
      const chk = () => {
        if ((!ep.q.length && !ep.ret.size) || clock.now() - t0 >= ms || !ep.bus || ep.bus.dead || !ep.bus.up()) ep.tx.then(res, res);
        else clock.setTimeout(chk, 50);
      };
      chk();
    });
    ep.onRaw = (topic, payload, retain, idx) => {
      ep.rx = ep.rx.then(async () => {
        if (ep.dead) return;
        if (!payload.length) { ep.handle(topic, null, retain, idx); return; }
        const obj = await unseal(ctx, keys.key, payload);
        if (Array.isArray(obj)) { for (const x of obj) if (x && typeof x === 'object' && !ep.dead) ep.handle(topic, x, retain, idx); }
        else if (obj && typeof obj === 'object') ep.handle(topic, obj, retain, idx);
      }).catch(e => console.error('[net] relay:', e));
    };
    eps.add(ep);
    return ep;
  }
  // grace — дать уйти очереди (до relayIdle) и подтверждениям брокеров (до grace); before — сделать перед закрытием шины
  function closeEp(ep, grace, before) {
    if (ep.dead) return;
    ep.dead = true; eps.delete(ep);
    for (const vc of [...ep.vcs.values()]) endVc(ep, vc, true);
    const bus = ep.bus;
    ep.idle(grace ? T.relayIdle : 0).then(() => { if (!bus) return; try { before && before(bus); } catch (e) { } bus.close(grace); });
  }
  // ---- виртуальное соединение
  function newVc(ep, n, remote, out) {
    const vc = {n, remote, out, seq: 0, rxNext: 1, buf: new Map(), gapT: null, dead: false, conn: null, pidTopic: null, ackAt: 0};
    vc.conn = makeConn({
      send: f => {
        if (vc.dead) return;
        const env = {n, s: ++vc.seq, f: ep.me, d: f};
        ep.pub(vc.out, env, 1, false);
        if (vc.pidTopic && f && f.t === 'm' && f.d && f.d.t === 'view') ep.pub(vc.pidTopic, env, 1, true);
      },
      close: () => { if (vc.dead) return; endVc(ep, vc, false); ep.pub(vc.out, {k: 'fin', n, f: ep.me}, 1, false); },
    });
    ep.vcs.set(n, vc);
    return vc;
  }
  function endVc(ep, vc, notify) {
    if (vc.dead) return;
    vc.dead = true; ep.vcs.delete(vc.n); clock.clearTimeout(vc.gapT);
    if (notify) vc.conn._ended();
  }
  function drain(vc) {
    while (!vc.dead && vc.buf.has(vc.rxNext)) { const d = vc.buf.get(vc.rxNext); vc.buf.delete(vc.rxNext); vc.rxNext++; vc.conn._data(d); }
    clock.clearTimeout(vc.gapT); vc.gapT = null;
    if (!vc.dead && vc.buf.size) vc.gapT = clock.setTimeout(() => { vc.gapT = null; if (!vc.dead && vc.buf.size) { vc.rxNext = Math.min(...vc.buf.keys()); drain(vc); } }, T.relayGap);
  }
  function recv(vc, s, d) {
    if (vc.dead || !(s >= 1) || s < vc.rxNext || vc.buf.has(s)) return;   // дубль из второго брокера
    vc.buf.set(s, d);
    drain(vc);
  }
  // retained-снимок: всё до него, чего нет, уже неважно — догоняем
  function recvRetained(vc, s, d) {
    if (vc.dead || !(s >= vc.rxNext)) return;
    for (const k of [...vc.buf.keys()].sort((a, b) => a - b)) {
      if (k >= s) break;
      const x = vc.buf.get(k); vc.buf.delete(k); vc.rxNext = k + 1; vc.conn._data(x);
      if (vc.dead) return;
    }
    if (!vc.buf.has(s)) vc.buf.set(s, d);
    vc.rxNext = s;
    drain(vc);
  }
  const wsOk = () => typeof envGet(ctx, 'WebSocket') === 'function';

  // ---- хост
  async function listen(addr, h, meta) {
    const code = meta.code;
    const keys = await roomKeys(ctx, code);
    const hid = hex(await sha256(ctx, 'spyg2|host|' + code + '|' + meta.pid)).slice(0, 20);
    const P = 'spyg2/' + keys.h + '/';
    const tab = uid(8), since = lastSince = Math.max(Date.now(), lastSince + 1);
    const ep = makeEp(keys, 'h' + hid.slice(0, 11));
    const L = {name: 'relay', up: false, closed: false};
    let rival = null, started = false, metaT = null;
    const pidTopics = new Set(), seen = new Set(), finned = new Set();
    const publishMeta = () => { if (!L.closed && started) ep.pub(P + 'meta', {v: 2, open: true, hostSeen: Date.now(), hid, tab, since}, 1, true); };
    const loop = () => { metaT = clock.setTimeout(() => { publishMeta(); loop(); }, T.relayMetaEvery); };
    ep.handle = (topic, obj, retain) => {
      if (L.closed) return;
      if (topic === P + 'meta') {
        if (!obj) return;
        if (obj.hid === hid) {
          // эту же комнату (тот же хост) подняла другая вкладка позже нас — уступаем. clientId у вкладок общий,
          // брокер выбивает старое подключение; переподключившись, старая вкладка видит retained meta новой и уходит.
          if (obj.tab !== tab && (obj.since || 0) > since && started) { dbg('relay: комнату забрала другая вкладка'); L.close(true); h.onEnd && h.onEnd('replaced'); }
          return;
        }
        if (obj.open) rival = obj;
        return;
      }
      if (topic !== P + 'h' || !obj) return;
      const f = obj.f;
      if (typeof f !== 'string' || !CID_RE.test(f) || typeof obj.n !== 'string' || !CID_RE.test(obj.n)) return;
      if (obj.k === 'syn') {
        const vc = ep.vcs.get(obj.n);
        if (vc) { if (vc.remote === f && clock.now() - vc.ackAt > 1500) { vc.ackAt = clock.now(); ep.pub(P + 'c/' + f, {k: 'ack', n: obj.n, f: ep.me}, 1, false); } return; }
        if (seen.has(obj.n)) return;   // это соединение уже было и закрылось — не воскрешаем
        seen.add(obj.n);
        const nv = newVc(ep, obj.n, f, P + 'c/' + f);
        if (typeof obj.ph === 'string' && /^[0-9a-f]{16}$/.test(obj.ph)) { nv.pidTopic = P + 'v/' + obj.ph; pidTopics.add(nv.pidTopic); }
        nv.ackAt = clock.now();
        ep.pub(P + 'c/' + f, {k: 'ack', n: obj.n, f: ep.me}, 1, false);
        h.onConn(nv.conn);
      } else if (obj.k === 'fin') {
        const vc = ep.vcs.get(obj.n);
        if (vc && vc.remote === f) endVc(ep, vc, true);
      } else if (obj.s) {
        const vc = ep.vcs.get(obj.n);
        if (vc && vc.remote === f) recv(vc, obj.s, obj.d);
        else if (!vc && !finned.has(obj.n)) { finned.add(obj.n); ep.pub(P + 'c/' + f, {k: 'fin', n: obj.n, f: ep.me}, 0, false); }   // «такого соединения нет» — клиент сразу переподключится
      }
    };
    ep.bus = relayBus(ctx, {
      clientId: 'sh' + hid, clean: false,   // постоянная сессия: брокер копит входящие, пока хост спит
      onMessage: ep.onRaw,
      onState: () => { const up = ep.bus.up(); if (up && started) publishMeta(); if (up !== L.up) { L.up = up; if (started) h.onState(); } },
    });
    ep.bus.onUp = ep.flush;
    ep.bus.subscribe([[P + 'h', 1], [P + 'meta', 0]]);
    const fail = e => { L.closed = true; closeEp(ep, 0); throw e; };
    if (!await ep.bus.wait(() => ep.bus.up(), T.relayConnect)) fail(netError('net_unavailable', 'нет ни одного брокера'));
    await ep.bus.wait(() => rival || (ep.bus.subAt(P + 'meta') && clock.now() - ep.bus.subAt(P + 'meta') >= T.relayMetaWait), T.relayConnect);
    await ep.rx;
    if (rival && Date.now() - (rival.hostSeen || 0) < T.relayStale) fail(netError('taken'));
    started = true; L.up = ep.bus.up();
    publishMeta(); loop();
    L.wake = () => { if (L.closed) return; ep.bus.wake(); publishMeta(); };
    L.close = (keepMeta) => {
      if (L.closed) return;
      L.closed = true; L.up = false; clock.clearTimeout(metaT);
      if (keepMeta !== true) {   // комната закрыта: стереть retained meta и снимки, перестать копить входящие
        ep.pub(P + 'meta', null, 1, true);
        for (const t of pidTopics) ep.pub(t, null, 1, true);
        closeEp(ep, 1500, bus => bus.unsubscribe([P + 'h', P + 'meta']));
        return;
      }
      closeEp(ep, 1500);
    };
    return L;
  }

  // ---- клиент
  async function clientState(o) {
    if (cs) return cs;
    const code = o.code;
    const keys = await roomKeys(ctx, code);
    const ph = hex(await sha256(ctx, 'spyg2|p|' + code + '|' + o.pid)).slice(0, 16);
    const cid = 'c' + uid(15), P = 'spyg2/' + keys.h + '/';
    const ep = makeEp(keys, cid);
    const st = cs = {keys, ph, cid, P, ep, metaBy: [], pend: new Map()};
    st.meta = () => { let m = null; for (const x of st.metaBy) if (x && (!m || (x.hostSeen || 0) > (m.hostSeen || 0))) m = x; return m; };
    st.cleared = () => !st.meta() && st.metaBy.some(x => x === null);
    ep.handle = (topic, obj, retain, idx) => {
      if (topic === P + 'meta') {
        st.metaBy[idx] = obj && obj.open ? obj : null;
        if (st.cleared()) for (const p of [...st.pend.values()]) p.closed();
        ep.bus.kick();
        return;
      }
      if (topic === P + 'v/' + ph) {
        if (!obj || !retain || typeof obj.n !== 'string') return;
        const vc = ep.vcs.get(obj.n);
        if (vc && vc.remote === obj.f) recvRetained(vc, obj.s, obj.d);
        else if (hooks && hooks.oob) hooks.oob(obj.d);   // связи с хостом нет — всё равно показать последнее состояние
        return;
      }
      if (topic !== P + 'c/' + cid || !obj || typeof obj.n !== 'string') return;
      if (obj.k === 'ack') { const p = st.pend.get(obj.n); if (p && typeof obj.f === 'string' && CID_RE.test(obj.f)) p.ack(obj.f); }
      else if (obj.k === 'fin') { const vc = ep.vcs.get(obj.n); if (vc && vc.remote === obj.f) endVc(ep, vc, true); }
      else if (obj.s) { const vc = ep.vcs.get(obj.n); if (vc && vc.remote === obj.f) recv(vc, obj.s, obj.d); }
    };
    ep.bus = relayBus(ctx, {
      clientId: 's' + cid, clean: true, onMessage: ep.onRaw,
      onState: (idx, up) => { if (up) st.metaBy[idx] = undefined; },   // переподписка пришлёт retained meta заново
    });
    ep.bus.onUp = ep.flush;
    ep.bus.subscribe([[P + 'meta', 0], [P + 'c/' + cid, 1], [P + 'v/' + ph, 0]]);
    return st;
  }
  async function connect(addr, o) {
    const t0 = clock.now();
    const st = await clientState(o);
    const {ep, P} = st, bus = ep.bus;
    if (!await bus.wait(() => bus.up(), Math.max(1000, Math.min(T.relayConnect, o.timeout || T.relayConnect)))) throw netError('net_unavailable', 'нет ни одного брокера');
    const sub = () => bus.subAt(P + 'meta');
    await bus.wait(() => st.meta() || st.cleared() || (sub() && clock.now() - t0 >= T.relayFind && clock.now() - sub() >= 1500), T.relayFind + T.relayConnect);
    await ep.rx;
    const m = st.meta();
    if (!m) throw netError('not_found');
    if (Date.now() - (m.hostSeen || 0) > T.relayStale) throw netError('not_found', 'stale');
    const n = 'n' + uid(11);
    return new Promise((resolve, reject) => {
      let fin = false, synT = null, waitT = null;
      const stop = (e, conn) => {
        if (fin) return; fin = true;
        clock.clearTimeout(synT); clock.clearTimeout(waitT); st.pend.delete(n);
        if (e) reject(e); else resolve(conn);
      };
      st.pend.set(n, {
        ack: hostCid => { const vc = newVc(ep, n, hostCid, P + 'h'); stop(null, vc.conn); },
        closed: () => stop(netError('not_found', 'room closed')),
      });
      const syn = () => {
        if (fin) return;
        if ((o.isDone && o.isDone()) || ep.dead) { stop(netError('closed')); return; }
        ep.pub(P + 'h', {k: 'syn', n, f: st.cid, ph: st.ph, v: 2}, 1, false);
        synT = clock.setTimeout(syn, T.relaySyn);
      };
      waitT = clock.setTimeout(() => { if (!fin && o.onWaiting) o.onWaiting(); }, T.relayAck);
      syn();
    });
  }

  return {
    name: 'relay', maxFrame: 100000,   // view до ~60 КБ идёт одним сообщением; больше 100 КБ — ядро режет
    available: () => !!(TE && TD && wsOk() && cryptoOf(ctx) && (ctx.relays || RELAYS).length),
    listen, connect,
    wake() { for (const ep of eps) if (ep.bus) ep.bus.wake(); },
    close() { const s = cs; cs = null; if (s) closeEp(s.ep, 500); },
  };
}

const DRIVERS = {memory: memoryDriver, local: localDriver, peer: peerDriver, room: roomDriver, relay: relayDriver};
const AUTO = ['room', 'relay', 'peer', 'local'];

// ================================================================= ядро: хост/клиент, рукопожатие, heartbeat, переподключение
function createNet(opts) {
  opts = opts || {};
  const clock = opts.clock || REAL_CLOCK;
  const T = Object.assign({}, TIMING, opts.timing || {});
  const ctx = {clock, T, env: opts.env || G, relays: opts.relays || null};
  const node = {id: Math.random()};
  const H = {msg: [], peer: [], status: []};
  let forced = null, S = null, status = 'idle', sseq = 0, lastInfo = {};

  // драйверы создаются на каждую сессию: отложенная уборка старой сессии не задевает ресурсы новой
  const driver = (s, name) => s.drv[name] || (s.drv[name] = DRIVERS[name](ctx, node, s.hooks));
  const on = (list, fn) => { if (typeof fn !== 'function') return () => { }; list.push(fn); return () => { const i = list.indexOf(fn); if (i >= 0) list.splice(i, 1); }; };
  const emit = (list, ...args) => { for (const fn of list.slice()) { try { fn(...args); } catch (e) { console.error('[net] ошибка в обработчике:', e); } } };
  const setStatus = (st, info) => { if (st === status) return; status = st; lastInfo = Object.assign({transport: transportName()}, info || {}); dbg('status', st, lastInfo); emit(H.status, st, lastInfo); };
  const emitPeer = ev => { dbg('peer', ev.type, ev.pid); emit(H.peer, ev); };
  const emitMsg = (m, from) => emit(H.msg, m, from);
  const alive = () => (S && S.alive ? S : null);

  function transportName() {
    const s = alive(); if (!s) return null;
    if (s.role === 'host') return s.listeners.map(l => l.name).join('+') || null;
    return s.driver ? s.driver.name : null;
  }

  async function candidates(s) {
    const want = forced || (Spy.config && Spy.config.net) || null;
    if (want) {
      if (!DRIVERS[want]) { console.warn('[net] неизвестный транспорт', want); }
      else { const d = driver(s, want); return (await d.available()) ? [d] : []; }
    }
    // ровно один транспорт, по приоритету SPEC-v2: room (если claude.use('room') дал объект) > relay (WebSocket + WebCrypto) > peer (window.Peer) > local
    for (const n of AUTO) { const d = driver(s, n); if (await d.available()) return [d]; }
    return [];
  }

  // ---------- сессия
  function newSession(role, pid) {
    const s = {id: ++sseq, role, pid, code: null, alive: true, timers: new Set(), drv: {},
      listeners: [], links: new Map(), pending: new Set(),
      link: null, driver: null, used: new Set(), attempt: null, queue: [], rc: null, hold: false, held: [],
      tickT: null, lastTick: clock.now()};
    s.hooks = {
      // relay: retained-снимок от хоста, когда связи с ним нет (хост спит) — показать последнее состояние
      oob: f => { if (s.alive && S === s && s.role === 'client' && !s.link && f && f.t === 'm' && f.d !== undefined) emitMsg(f.d, 'host'); },
    };
    return s;
  }
  function stimer(s, fn, ms) {
    const id = clock.setTimeout(() => { s.timers.delete(id); if (s.alive) fn(); }, ms);
    s.timers.add(id); return id;
  }
  function sclear(s, id) { if (id != null) { clock.clearTimeout(id); s.timers.delete(id); } }
  function teardown(s, bye) {
    if (!s || !s.alive) return;
    s.alive = false; LIVE.delete(api);
    for (const id of s.timers) clock.clearTimeout(id); s.timers.clear();
    if (s.attempt) { const a = s.attempt; s.attempt = null; a.cancel(); }
    const links = [];
    if (s.role === 'host') { links.push(...s.links.values(), ...s.pending); s.links.clear(); s.pending.clear(); }
    else if (s.link) { links.push(s.link); s.link = null; }
    for (const l of links) { l.dead = true; if (bye) rawSend(l, {t: 'bye', r: bye}); }
    const listeners = s.listeners.slice(), used = Object.values(s.drv);
    const finish = () => {
      for (const l of links) { try { l.conn.close(); } catch (e) { } }
      for (const L of listeners) { try { L.close(); } catch (e) { } }
      for (const d of used) { try { d.close(); } catch (e) { } }
    };
    if (bye && links.length) clock.setTimeout(finish, T.linger); else finish();
  }
  function endSession(s, reason) {
    if (!s.alive) return;
    teardown(s, null);
    if (S === s) setStatus('closed', {reason});
  }

  // ---------- линки (одно соединение = один линк), нарезка больших кадров
  function makeLink(s, conn, drv, extra) {
    const now = clock.now();
    const l = Object.assign({s, conn, drv, maxFrame: opts.maxFrame || drv.maxFrame || 0, pid: null, phase: 'hs',
      lastRx: now, lastTx: now, since: now, pingAt: 0, pingDue: 0, chunk: null, cseq: 0, dead: false, attempt: null}, extra || {});
    conn.attach(f => onWire(l, f), () => onWireClosed(l));
    return l;
  }
  function rawSend(l, f) {
    if (!l.conn.open) return false;
    l.lastTx = clock.now();
    try {
      if (!l.maxFrame) return l.conn.send(f) !== false;
      const str = JSON.stringify(f);
      if (utf8Len(str) <= l.maxFrame) return l.conn.send(f) !== false;
      const parts = splitJson(str, l.maxFrame - 200), id = ++l.cseq;
      for (let i = 0; i < parts.length; i++) l.conn.send({t: 'c', id, i, n: parts.length, s: parts[i]});
      return true;
    } catch (e) { console.warn('[net] не удалось отправить:', e && e.message); return false; }
  }
  function onWire(l, f) {
    if (l.dead || !l.s.alive || !f || typeof f !== 'object') return;
    l.lastRx = clock.now();
    if (f.t === 'c') {
      if (f.i === 0) l.chunk = {id: f.id, n: f.n, parts: []};
      const c = l.chunk;
      if (!c || c.id !== f.id || c.parts.length !== f.i) { l.chunk = null; return; }
      c.parts.push(String(f.s));
      if (c.parts.length < c.n) return;
      l.chunk = null;
      try { f = JSON.parse(c.parts.join('')); } catch (e) { return; }
      if (!f || typeof f !== 'object' || f.t === 'c') return;
