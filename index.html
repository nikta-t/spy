/* ===== game.css ===== */
/* game.css — игровые экраны (агент UISCREENS). Префикс g-. Цвета/шрифты/движение — токены ui.css. */

/* ---------- каркас экрана: шапка, прокручиваемое тело, док снизу ---------- */
.screen > .g-screen { flex: 1 1 0; min-height: 0; }
.g-screen {
  position: relative; display: flex; flex-direction: column; height: 100%; min-height: 0;
  padding: 10px calc(16px + var(--safe-r, 0px)) 0 calc(16px + var(--safe-l, 0px));
  color: var(--paper); font-family: var(--font-body); overflow: hidden; overflow: clip;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
.g-screen input { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
.g-body {
  position: relative; flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto;
  overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  margin: 0 calc(-16px - var(--safe-r, 0px)) 0 calc(-16px - var(--safe-l, 0px));
  padding: 6px calc(16px + var(--safe-r, 0px)) 18px calc(16px + var(--safe-l, 0px));
  scrollbar-width: thin; scrollbar-color: var(--line-2) transparent;
}
.g-dock {
  position: relative; z-index: 4; flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px;
  margin: 0 calc(-16px - var(--safe-r, 0px)) 0 calc(-16px - var(--safe-l, 0px));
  padding: 12px calc(16px + var(--safe-r, 0px)) calc(12px + var(--safe-b, 0px)) calc(16px + var(--safe-l, 0px));
  background: var(--bg-2); border-top: var(--bw) solid var(--ink);
  box-shadow: 0 -6px 0 var(--bg-deep);
}
.g-dock::before { /* полоска «перфорации» */
  content: ''; position: absolute; left: 0; right: 0; top: -9px; height: 6px; pointer-events: none;
  background: radial-gradient(circle at 4px 6px, var(--ink) 2px, transparent 2.5px) 0 0 / 12px 6px; opacity: .5;
}
.g-dock-row { display: flex; gap: 8px; align-items: stretch; min-width: 0; }
.g-dock-row > .g-slot { flex: 1 1 auto; min-width: 0; display: flex; }
.g-dock-row > .g-slot > * { flex: 1 1 auto; }
.g-slot { min-width: 0; }
.g-slot > .ui-btn--full, .g-slot > .g-fb-btn.is-full { width: 100%; }
.g-dock-note { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0; text-align: center; color: var(--paper-dim); font: 500 14px/1.35 var(--font-body); }
.g-dock-note .g-ic { width: 18px; height: 18px; flex: 0 0 auto; }
.g-status {
  display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 0 16px; width: 100%;
  border: var(--bw) dashed var(--line-2); border-radius: 14px 5px 14px 5px; color: var(--paper); font: 700 16px/1.2 var(--font-body);
}
.g-status.is-ok { border-style: solid; border-color: var(--ink); background: var(--mint); color: var(--ink); box-shadow: 0 4px 0 var(--ink); animation: g-pop .42s var(--ease-spring) both; }
.g-status .g-ic { width: 22px; height: 22px; stroke-width: 3; }
.g-link {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 4px; margin: 0;
  background: none; border: 0; color: var(--sky); font: 700 14px/1 var(--font-body); white-space: nowrap;
}
.g-link .g-ic { width: 17px; height: 17px; }
.g-link:active { transform: scale(.96); }

/* иконки */
.g-ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.g-ic .f { fill: currentColor; stroke: none; }
.g-ic--crown path { stroke: var(--ink); stroke-width: 1.6; fill: var(--yellow); }

/* точки «печатает…» */
.g-dots { display: inline-flex; gap: 3px; margin-left: 4px; vertical-align: middle; }
.g-dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: g-dot 1.1s ease-in-out infinite; }
.g-dots i:nth-child(2) { animation-delay: .15s; }
.g-dots i:nth-child(3) { animation-delay: .3s; }

/* ---------- шапка ---------- */
.g-head { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; }
.g-steps { display: flex; align-items: center; gap: 6px; margin: 0; padding: 0; list-style: none; font: 700 10px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--paper-mute); min-width: 0; }
.g-step { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.g-step + .g-step::before { content: ''; width: 12px; height: 2px; background: var(--line-2); margin-right: 1px; }
.g-step-dot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid currentColor; flex: 0 0 auto; }
.g-step.is-done { color: var(--paper-dim); }
.g-step.is-done .g-step-dot { background: var(--mint); border-color: var(--ink); }
.g-step.is-now { color: var(--yellow); }
.g-step.is-now .g-step-dot { position: relative; background: var(--yellow); border-color: var(--ink); box-shadow: 0 0 0 2px var(--yellow); }
.g-step.is-now .g-step-dot::after { /* мягкий «пульс» этапа — только transform/opacity */
  content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--yellow); pointer-events: none;
  animation: g-ring 1.8s var(--ease-out) infinite;
}
.g-head-row { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.g-head-txt { flex: 1 1 auto; min-width: 0; }
.g-title { margin: 0; font: 800 23px/1.1 var(--font-display); letter-spacing: -.01em; color: var(--paper); }
.g-sub { margin: 4px 0 0; font: 500 14px/1.35 var(--font-body); color: var(--paper-dim); }
.g-head-right { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
.g-timer { flex: 0 0 auto; display: grid; place-items: center; }

/* подсказки кита в своих контейнерах */
.g-hintbox { position: absolute; left: 50%; bottom: 18px; z-index: 3; transform: translateX(-50%); width: max-content; max-width: calc(100% - 8px); pointer-events: auto; }
.g-hintbox.is-inline { position: relative; left: auto; transform: none; margin: 2px 0 12px; }

/* ---------- DEAL ---------- */
.g-deal-stage { position: relative; flex: 1 1 auto; min-height: 180px; display: grid; place-items: center; padding: 6px 0 10px; }
.g-dcard-wrap {
  position: relative; display: block; width: 240px; height: 320px; outline: none; touch-action: none; cursor: pointer;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  transition: transform var(--t-med) var(--ease-spring);
  animation: g-deal-in .62s var(--ease-spring) both;
}
.g-dcard-wrap:focus-visible { outline: 3px solid var(--sky); outline-offset: 6px; border-radius: 18px; }
.g-dcard-wrap.is-open { transform: scale(1.035); }
.g-dcard-wrap > .g-c3 { --w: 100%; width: 100% !important; height: 100% !important; aspect-ratio: auto; }
.g-dcard-wrap::after { /* ореол удержания */
  content: ''; position: absolute; inset: -10px; border-radius: 22px 10px 22px 10px; border: 3px solid var(--yellow);
  opacity: 0; transform: scale(.96); transition: opacity var(--t-fast), transform var(--t-med) var(--ease-spring); pointer-events: none;
}
.g-dcard-wrap.is-open::after { opacity: .9; transform: none; }

/* лица карточки внутри kit.card3d */
.g-c3 .g-c3-face, .g-c3 .g-c3-cover { padding: 0 !important; gap: 0 !important; }
.g-c3 .g-c3-face::before, .g-c3 .g-c3-face::after { z-index: 0; }
.g-c3 .g-c3-face > .g-face, .g-c3 .g-c3-cover > .g-face { position: relative; z-index: 1; }
.g-face { flex: 1 1 auto; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; min-height: 0; }
.g-face-k { width: 100%; display: flex; justify-content: space-between; gap: 8px; font: 700 calc(var(--cw, 260px) * .04)/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; }

/* рубашка — папка-манила */
.g-cover { justify-content: space-between; padding: 8% 9% 9%; color: var(--ink); }
.g-cover-top { width: 100%; display: flex; justify-content: space-between; gap: 6px; font: 700 calc(var(--cw, 260px) * .038)/1 var(--font-mono); letter-spacing: .14em; color: var(--ink-soft); }
.g-cover-mid { position: relative; width: 62%; aspect-ratio: 1; display: grid; place-items: center; }
.g-art-key { width: 100%; height: 100%; overflow: visible; }
.g-k-disc { fill: var(--ink); }
.g-k-ring { fill: none; stroke: var(--manila); stroke-width: 3; stroke-dasharray: 5 4; }
.g-k-hole { fill: var(--manila); }
.g-cover-stamp { position: absolute; left: 50%; top: 72%; transform: translateX(-50%); font-size: calc(var(--cw, 260px) * .085); }
.g-cover-stamp .ui-stamp, .g-cover-stamp .g-fb-stamp { font-size: 1em; background: var(--manila); }
.g-cover-cta {
  position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; padding: .55em 1em; border-radius: 999px; white-space: nowrap;
  background: var(--ink); color: var(--yellow); font: 800 calc(var(--cw, 260px) * .052)/1 var(--font-display); letter-spacing: .02em;
  box-shadow: 0 3px 0 var(--ink-soft); animation: g-nudge 2.2s ease-in-out infinite;
}
.g-cover-cta .g-ic { width: 1.25em; height: 1.25em; }
.g-dcard-wrap.is-open .g-cover-cta { animation: none; }

/* лицо: слово */
.g-wface { justify-content: space-between; padding: 9% 8% 8%; color: var(--ink); }
.g-wface .g-face-k { color: var(--ink-soft); padding-left: 6%; }
.g-wface-word {
  flex: 1 1 auto; display: grid; place-items: center; width: 100%; padding: 4px 0 4px 6%;
  font: 900 40px/1.04 var(--font-display); letter-spacing: -.02em; color: var(--ink);
  overflow-wrap: normal; word-break: normal; hyphens: manual; text-wrap: balance; overflow: hidden;
}
.g-face-pack { display: flex; align-items: center; gap: 10px; max-width: 100%; text-align: left; padding: 8px 12px 8px 8px; border: var(--bw-thin) solid var(--ink); border-radius: 10px 4px 10px 4px; background: var(--paper-2); color: var(--ink); }
.g-face-pack > .ui-pack, .g-face-pack > .g-fb-pack { flex: 0 0 auto; }
.g-face-pack-t { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.g-face-pack-t small { font: 700 10px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.g-face-pack-t b { font: 800 calc(var(--cw, 260px) * .056)/1.15 var(--font-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-face-foot { margin: 10px 0 0; font: 600 calc(var(--cw, 260px) * .046)/1.3 var(--font-body); color: var(--ink-soft); max-width: 92%; }

/* лицо: шпион — красное поле, полутон, комикс-буквы */
.g-c3 .g-c3-spy { background: var(--red) !important; color: var(--paper); }
.g-c3 .g-c3-spy::before {
  content: '' !important; position: absolute !important; inset: 0 !important; width: auto !important; height: auto !important; border: 0 !important; border-radius: 0 !important; transform: none !important;
  background: var(--halftone-ink) 0 0 / 7px 7px !important; opacity: .55;
  -webkit-mask-image: radial-gradient(110% 80% at 50% 0%, transparent 35%, #000 95%); mask-image: radial-gradient(110% 80% at 50% 0%, transparent 35%, #000 95%);
}
.g-c3 .g-c3-spy::after { display: none !important; }
.g-sface { justify-content: space-between; padding: 8% 8% 8%; color: var(--paper); }
.g-sface .g-face-k { color: var(--paper); opacity: .85; }
.g-art-spy { width: 56%; height: auto; margin-top: 2%; }
.g-s-ink { fill: var(--ink); }
.g-s-band { fill: var(--red-deep); }
.g-s-bridge { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; fill: none; }
.g-s-glint { stroke: var(--paper); stroke-width: 2.5; stroke-linecap: round; opacity: .7; }
.g-sface-title {
  font: 900 calc(var(--cw, 260px) * .148)/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; color: var(--paper);
  text-shadow: 3px 3px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 4px 5px 0 var(--ink);
}
.g-c3-face.g-c3-spy .g-face-pack { background: var(--paper); }
.g-sface .g-face-foot { color: var(--paper); opacity: .92; margin-top: 6px; }
.g-sface-mates { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; max-width: 100%; font-size: calc(var(--cw, 260px) * .045); }
.g-sface-mates small { font: 700 10px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; }
.g-mate { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 9px 3px 3px; border-radius: 999px; background: var(--ink); color: var(--paper); }
.g-mate b { font: 700 13px/1 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }

/* анимированная подсказка «нажми и держи» */
.g-finger { position: absolute; left: 50%; top: 48%; width: 96px; height: 96px; margin: -48px 0 0 -48px; pointer-events: none; z-index: 4; transition: opacity var(--t-med); }
.g-finger.is-gone { opacity: 0; }
.g-finger-ring { position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--yellow); box-shadow: 0 0 0 3px var(--ink); opacity: 0; animation: g-ripple 2.2s var(--ease-out) infinite; }
.g-finger-ring.is-2 { animation-delay: .35s; }
.g-finger-hand { position: absolute; left: 34px; top: 30px; width: 54px; height: 54px; display: grid; place-items: center; color: var(--ink); animation: g-press 2.2s var(--ease-out) infinite; }
.g-finger-hand .g-ic { width: 54px; height: 54px; fill: var(--paper); stroke: var(--ink); stroke-width: 1.9; filter: drop-shadow(3px 3px 0 var(--ink)); }
.g-nudge {
  position: absolute; left: 50%; bottom: 0; transform: translate(-50%, 8px); max-width: 92%; z-index: 4;
  padding: 7px 12px; border-radius: 999px; background: var(--yellow); color: var(--ink); border: var(--bw-thin) solid var(--ink);
  font: 700 13px/1.2 var(--font-body); text-align: center; opacity: 0; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.g-nudge.is-on { animation: g-nudge-in 2.6s var(--ease-out) both; }

/* памятка «что дальше» */
.g-memo { flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 0 0 12px; padding: 0; list-style: none; }
.g-memo li { display: flex; align-items: flex-start; gap: 6px; min-width: 0; padding: 7px 7px 7px 6px; border: var(--bw-thin) dashed var(--line-2); border-radius: 8px; animation: ui-rise var(--t-slow) var(--ease-spring) both; animation-delay: calc(300ms + var(--i) * 80ms); }
.g-memo b { flex: 0 0 auto; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; background: var(--yellow); color: var(--ink); border: 2px solid var(--ink); font: 800 11px/1 var(--font-display); }
.g-memo span { min-width: 0; font: 700 12px/1.2 var(--font-body); color: var(--paper); }
.g-memo small { display: block; margin-top: 2px; font: 500 11px/1.2 var(--font-body); color: var(--paper-mute); }
.g-deal.is-ready .g-memo li:first-child { border-style: solid; border-color: var(--mint); }

/* кто готов */
.g-ready { display: flex; flex-direction: column; gap: 6px; }
.g-ready-lbl { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font: 500 13px/1.2 var(--font-body); color: var(--paper-mute); }
.g-ready-lbl b { font: 700 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--paper); }
.g-ready-row { display: flex; flex-wrap: wrap; gap: 4px; min-height: 30px; }
.g-ready-row.is-dense { gap: 0; }
.g-ready-row.is-dense .g-ready-av + .g-ready-av { margin-left: -3px; }
.g-ready-av { position: relative; display: inline-flex; border-radius: 50%; }
.g-ready-av.is-pop { animation: g-pop .5s var(--ease-spring) both; }
.g-ready-av.is-off::after { content: ''; position: absolute; left: 3px; right: 3px; top: 50%; height: 3px; background: var(--red); border-radius: 2px; transform: rotate(-30deg); }

/* наблюдатель */
.g-obs { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 320px; padding: 22px 18px; text-align: center; border: var(--bw) dashed var(--line-2); border-radius: 16px 6px 16px 6px; }
.g-obs-ic { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; background: var(--sky); color: var(--ink); border: var(--bw) solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.g-obs-ic .g-ic { width: 34px; height: 34px; }
.g-obs h2 { font: 800 19px/1.2 var(--font-display); }
.g-obs p { color: var(--paper-dim); font-size: 14px; line-height: 1.45; }

/* ---------- CLUES ---------- */
.g-round { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; padding: 6px 10px; border: var(--bw-thin) solid var(--ink); border-radius: 10px 4px 10px 4px; background: var(--ink-2); }
.g-round-t { font: 700 12px/1 var(--font-mono); letter-spacing: .06em; color: var(--paper-dim); white-space: nowrap; }
.g-round-t b { color: var(--yellow); font-size: 14px; }
.g-round-dots { display: flex; gap: 4px; }
.g-round-dots i { width: 14px; height: 5px; border-radius: 3px; background: var(--line-2); }
.g-round-dots i.is-done { background: var(--mint); }
.g-round-dots i.is-now { background: var(--yellow); }
.g-round.is-bump { animation: g-pop .5s var(--ease-spring); }

.g-turn {
  position: relative; flex: 0 0 auto; margin-bottom: 8px; padding: 10px 12px; color: var(--ink);
  background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 6px 14px 6px 14px; box-shadow: var(--shadow-comic);
  transition: background var(--t-med);
}
.g-turn::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--grain); opacity: .3; mix-blend-mode: multiply; pointer-events: none; }
.g-turn > * { position: relative; }
.g-turn-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
.g-turn-av { flex: 0 0 auto; width: 46px; height: 46px; display: grid; place-items: center; }
.g-turn-ic { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--yellow); }
.g-turn-ic .g-ic { width: 24px; height: 24px; }
.g-turn-txt { flex: 1 1 auto; min-width: 0; }
.g-turn-k { font: 700 10.5px/1.2 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-turn-name { margin-top: 2px; font: 800 20px/1.15 var(--font-display); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-turn-sub { margin-top: 2px; font: 600 13px/1.25 var(--font-body); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-turn .g-timer .ui-timer__bg { fill: var(--ink); }
.g-turn-last { margin-top: 9px; padding-top: 8px; border-top: 2px dashed var(--paper-3); display: flex; align-items: baseline; gap: 6px; min-width: 0; font: 500 13px/1.3 var(--font-body); color: var(--ink); white-space: nowrap; overflow: hidden; }
.g-turn-last small { flex: 0 0 auto; font: 700 10px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.g-turn-last-t { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.g-turn-last q { font-weight: 800; quotes: '«' '»'; }
.g-turn-last.is-new { animation: g-slide-in .42s var(--ease-spring) both; }
.g-turn.is-swap .g-turn-main { animation: g-swap .45s var(--ease-spring) both; }
.g-turn.is-me { background: var(--yellow); }
.g-turn.is-me .g-turn-k { color: var(--ink); }
.g-turn.is-me .g-turn-name { font-size: 24px; }
.g-turn.is-me .g-turn-sub { color: var(--ink); }
.g-turn.is-me .g-turn-last { border-top-color: var(--yellow-2); }
.g-turn.is-me::after { /* бегущая лента «ТВОЙ ХОД» */
  content: ''; position: absolute; left: 0; right: 0; bottom: -3px; height: 6px; border-radius: 0 0 6px 14px;
  background: repeating-linear-gradient(-45deg, var(--ink) 0 8px, transparent 8px 16px); opacity: .35; animation: g-glow 1.6s ease-in-out infinite;
}
.g-turn.is-urgent { border-color: var(--red); }
.g-turn.is-urgent .g-turn-name { color: var(--red-deep); }
.g-turn.is-idle { background: var(--paper-2); }

.g-ticker {
  flex: 0 0 auto; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; margin: 0 0 6px; padding: 6px 8px 6px 10px;
  background: var(--ink-2); color: var(--paper); border: var(--bw-thin) solid var(--ink); border-radius: 10px; text-align: left; font: 500 13px/1.25 var(--font-body);
}
.g-ticker-ic { flex: 0 0 auto; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--sky); color: var(--ink); }
.g-ticker.is-acc .g-ticker-ic { background: var(--red-hi); }
.g-ticker-ic .g-ic { width: 14px; height: 14px; stroke-width: 3; }
.g-ticker-t { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-ticker-t b { color: var(--yellow); }
.g-ticker-n { flex: 0 0 auto; display: flex; align-items: center; gap: 5px; font: 700 10px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--paper-mute); }
.g-ticker-n b { min-width: 20px; height: 20px; padding: 0 5px; display: grid; place-items: center; border-radius: 10px; background: var(--paper); color: var(--ink); font-size: 11px; }
.g-ticker.is-new { animation: g-ticker-in .5s var(--ease-spring) both; }
.g-ticker:active { transform: scale(.98); }

.g-table { display: flex; flex-direction: column; }
.g-row {
  position: relative; display: grid; grid-template-columns: 16px 40px minmax(0, 1fr) 30px; align-items: center; gap: 8px;
  min-height: 60px; padding: 8px 6px 8px 4px; border-bottom: 2px dashed var(--line); border-radius: 10px; cursor: pointer;
  transition: background var(--t-med), box-shadow var(--t-med);
  animation: ui-rise var(--t-slow) var(--ease-spring) both; animation-delay: calc(var(--i) * 40ms);
}
.g-row.is-me { cursor: default; }
.g-table.is-dense .g-row { grid-template-columns: 14px 34px minmax(0, 1fr) 28px; min-height: 54px; padding: 6px 6px 6px 4px; }
.g-row-n { font: 700 11px/1 var(--font-mono); color: var(--paper-mute); text-align: right; }
.g-row-av { position: relative; display: grid; place-items: center; }
.g-row-main { min-width: 0; }
.g-row-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.g-row-name { min-width: 0; flex: 0 1 auto; font: 700 15px/1.2 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-row-tag { flex: 0 0 auto; padding: 2px 6px; border-radius: 5px; border: 1.5px solid var(--line-2); font: 700 9.5px/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--paper-mute); max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-row-tag.is-off { border-color: var(--red); color: var(--red-hi); }
.g-row.is-me .g-row-tag { border-color: var(--yellow); color: var(--yellow); }
.g-row-acc { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 2px; padding: 2px 6px 2px 4px; border-radius: 999px; background: var(--red-hi); color: var(--ink); border: 1.5px solid var(--ink); font: 800 11px/1 var(--font-mono); }
.g-row-acc .g-ic { width: 11px; height: 11px; stroke-width: 3.2; }
.g-row-acc.is-pop { animation: g-pop .5s var(--ease-spring); }
.g-cslots { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; margin-top: 5px; }
.g-clue {
  position: relative; display: flex; align-items: center; gap: 2px; min-width: 0; min-height: 28px; padding: 4px 8px;
  border-radius: 8px 8px 8px 3px; font: 700 14px/1.15 var(--font-body);
  border: 2px dashed var(--line-2); color: var(--paper-mute);
}
.g-clue-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.g-clue[data-s="empty"] { opacity: .45; }
.g-clue[data-s="miss"] { opacity: .3; }
.g-clue[data-s="said"] { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
.g-clue[data-s="skip"] { border-color: var(--red); color: var(--red-hi); font: 700 11px/1.1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; }
.g-clue[data-s="now"] { border: 2px solid var(--yellow); color: var(--yellow); font: 700 11px/1.1 var(--font-mono); letter-spacing: .04em; text-transform: uppercase; animation: g-breathe 1.4s ease-in-out infinite; }
.g-clue[data-s="now"] .g-dots i { width: 4px; height: 4px; }
.g-clue.is-new { animation: g-clue-pop .6s var(--ease-spring) both; }
.g-row-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: var(--paper-mute); border: 2px dashed var(--line-2); transition: background var(--t-fast), color var(--t-fast), transform var(--t-med) var(--ease-spring); }
.g-row-mark.is-me { border: 0; }
.g-row-mark .g-ic { width: 15px; height: 15px; }
.g-row.is-turn { background: var(--bg-2); box-shadow: inset 0 0 0 3px var(--yellow); border-bottom-color: transparent; }
.g-row.is-turn .g-row-n { color: var(--yellow); }
.g-row.is-off .g-row-name { color: var(--paper-mute); }
.g-row.is-marked { background: linear-gradient(90deg, rgba(229, 57, 43, .18), transparent 70%); }
.g-row.is-marked .g-row-mark { background: var(--red-hi); color: var(--ink); border: 2px solid var(--ink); transform: rotate(-12deg) scale(1.08); }
.g-row.is-marked .g-row-av::after {
  content: '?'; position: absolute; right: -4px; top: -4px; width: 18px; height: 18px; display: grid; place-items: center;
  border-radius: 50%; background: var(--red-hi); color: var(--ink); border: 2px solid var(--ink); font: 900 11px/1 var(--font-display);
}
.g-row.is-stamp .g-row-mark { animation: g-pop .45s var(--ease-spring); }
.g-row:active:not(.is-me) { transform: scale(.985); }
.g-table-note { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 12px 0 0; font: 500 12px/1.35 var(--font-body); color: var(--paper-mute); text-align: center; }
.g-table-note .g-ic { width: 14px; height: 14px; }

/* док подсказок */
.g-cdock.is-me { background: var(--ink-2); }
.g-rule { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.g-rule p { margin: 0; min-width: 0; font: 500 13px/1.3 var(--font-body); color: var(--paper-dim); }
.g-rule p b { color: var(--yellow); }
.g-rule .g-slot { flex: 0 0 auto; }
.g-inrow { align-items: center; }
.g-input {
  flex: 1 1 auto; min-width: 0; height: 54px; padding: 0 14px; margin: 0;
  font: 700 18px/1 var(--font-body); color: var(--ink); background: var(--paper);
  border: var(--bw) solid var(--ink); border-radius: 12px 4px 12px 4px; box-shadow: inset 0 3px 0 var(--paper-3);
  -webkit-appearance: none; appearance: none;
}
.g-input::placeholder { color: var(--ink-soft); opacity: .7; font-weight: 500; }
.g-input:focus { outline: 3px solid var(--yellow); outline-offset: 2px; }
.g-dock-row > .g-slot.g-send { flex: 0 0 auto; }
.g-send .ui-btn, .g-send .g-fb-btn { min-height: 54px; padding: 0 16px; gap: 7px; }
.g-send .ui-ico, .g-send .g-ic { width: 20px; height: 20px; }
.g-err { margin: 0; min-height: 0; font: 700 13px/1.3 var(--font-body); color: var(--red-hi); }
.g-err:empty { display: none; }
.g-screen.has-err .g-input { border-color: var(--red); }

/* «Моя карта» (удержание) */
.g-peekbtn {
  position: relative; flex: 0 0 auto; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 12px 0 8px;
  background: var(--manila); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 12px 4px 12px 4px; box-shadow: 0 4px 0 var(--ink);
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  transition: transform var(--t-fast) var(--ease-spring), box-shadow var(--t-fast);
}
.g-peekbtn-card { width: 30px; height: 36px; display: grid; place-items: center; border-radius: 5px 2px 5px 2px; background: var(--ink); color: var(--manila); }
.g-peekbtn-card .g-ic { width: 20px; height: 20px; }
.g-peekbtn-t { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
.g-peekbtn-t b { font: 800 13px/1 var(--font-body); white-space: nowrap; }
.g-peekbtn-t small { font: 700 10px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.g-peekbtn.is-compact { padding: 0; width: 52px; justify-content: center; }
.g-peekbtn.is-compact .g-peekbtn-t { display: none; }
.g-peekbtn.is-on { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.g-peek {
  position: absolute; left: 50%; bottom: 110px; z-index: 30; width: min(280px, calc(100% - 32px));
  transform: translateX(-50%) perspective(700px) rotateX(-80deg) scale(.86); transform-origin: 50% 100%;
  opacity: 0; pointer-events: none; transition: transform .32s var(--ease-spring), opacity .16s linear;
}
.g-peek.is-on { opacity: 1; transform: translateX(-50%) perspective(700px) rotateX(0) scale(1); }
.g-mini {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 16px 14px; text-align: center;
  background: var(--paper); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 14px 5px 14px 5px; box-shadow: 0 6px 0 var(--ink);
}
.g-mini small { font: 700 10px/1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.g-mini-w { font: 900 30px/1.05 var(--font-display); letter-spacing: -.02em; overflow-wrap: anywhere; hyphens: auto; }
.g-mini span { font: 600 13px/1.3 var(--font-body); color: var(--ink-soft); }
.g-mini em { font: 600 12px/1.3 var(--font-body); font-style: normal; opacity: .9; }
.g-mini.is-spy { background: var(--red); color: var(--paper); }
.g-mini.is-spy small, .g-mini.is-spy span { color: var(--paper); opacity: .9; }
.g-mini.is-spy .g-mini-w { text-transform: uppercase; text-shadow: 2px 2px 0 var(--ink); }

/* полоса «Круг N» */
.g-flash { position: absolute; left: 0; right: 0; top: 42%; z-index: 20; display: grid; place-items: center; padding: 10px 0; pointer-events: none; opacity: 0; overflow: hidden; overflow: clip; }
.g-flash.is-on { animation: g-flash 1.8s var(--ease-out) both; }
.g-flash-in {
  display: flex; flex-direction: column; align-items: center; gap: 4px; width: 112%; padding: 12px 20px; transform: rotate(-4deg);
  background: var(--yellow); color: var(--ink); border-top: var(--bw) solid var(--ink); border-bottom: var(--bw) solid var(--ink); box-shadow: 0 6px 0 var(--ink);
}
.g-flash-in b { font: 900 30px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
.g-flash-in span { font: 700 13px/1.2 var(--font-body); }

/* шторки: списки */
.g-sheet-note { margin: 0 0 12px; font: 500 14px/1.4 var(--font-body); color: var(--paper-dim); }
.g-pick { display: flex; flex-direction: column; gap: 8px; }
.g-pick-row {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 12px 8px 8px; text-align: left;
  background: var(--paper); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 12px 4px 12px 4px; box-shadow: 0 3px 0 var(--ink);
}
.g-pick-row:active { transform: translateY(3px); box-shadow: none; }
.g-pick-row.is-marked { background: var(--paper-2); }
.g-pick-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.g-pick-main b { font: 800 15px/1.2 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-pick-main small { font: 600 12px/1.25 var(--font-mono); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-pick-mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--red-hi); border: 2px solid var(--ink); }
.g-pick-mark .g-ic { width: 15px; height: 15px; }
.g-feed { display: flex; flex-direction: column; gap: 8px; }
.g-feed-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px; border-radius: 10px; background: var(--ink-2); border: var(--bw-thin) solid var(--ink); }
.g-feed-row.is-acc { border-left: 5px solid var(--red-hi); }
.g-feed-row p { margin: 0; min-width: 0; font: 500 14px/1.35 var(--font-body); overflow-wrap: anywhere; }
.g-feed-row b { color: var(--yellow); }
.g-feed-to { color: var(--paper-mute); font-weight: 700; }
.g-feed-ic { width: 32px; height: 32px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; background: var(--sky); color: var(--ink); }
.g-feed-ic .g-ic { width: 18px; height: 18px; }
.g-hist { display: flex; flex-direction: column; gap: 6px; }
.g-hist-row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 2px dashed var(--line); }
.g-hist-row.is-me b { color: var(--yellow); }
.g-hist-main { min-width: 0; flex: 1 1 auto; }
.g-hist-main > b { display: block; font: 700 14px/1.2 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-hist-clues { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.g-chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 4px 9px; border-radius: 8px 8px 8px 3px;
  background: var(--paper); color: var(--ink); border: 2px solid var(--ink); font: 700 13px/1.15 var(--font-body); overflow-wrap: anywhere;
}
.g-chip.is-skip { background: transparent; color: var(--paper-mute); border: 2px dashed var(--line-2); font: 700 11px/1.1 var(--font-mono); text-transform: uppercase; }
.g-chip.is-hot { background: var(--yellow); }
.g-chip b { font: 800 12px/1 var(--font-mono); padding: 2px 5px; border-radius: 5px; background: var(--ink); color: var(--paper); }

/* ---------- VOTE ---------- */
.g-vprog { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
.g-vprog-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; }
.g-vprog-t { font: 500 13px/1.2 var(--font-body); color: var(--paper-dim); white-space: nowrap; }
.g-vprog-t b { color: var(--paper); font-weight: 800; }
.g-vprog-av { display: flex; flex-wrap: wrap; gap: 3px; }
.g-vprog-p { display: inline-flex; }
.g-vprog-p.is-pop { animation: g-pop .5s var(--ease-spring) both; }
.g-vgrid { --cols: 2; display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 12px 10px; padding-top: 10px; }
.g-vcard {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; min-height: 44px; margin: 0;
  padding: 12px 8px 10px; text-align: center; color: var(--ink); background: var(--paper);
  border: var(--bw) solid var(--ink); border-radius: 6px 6px 12px 12px; box-shadow: 0 4px 0 var(--ink);
  transition: transform var(--t-med) var(--ease-spring), background var(--t-fast), box-shadow var(--t-med);
  animation: ui-rise var(--t-slow) var(--ease-spring) both; animation-delay: calc(var(--i) * 45ms);
}
.g-vcard-ruler { /* фон «опознания»: линейка роста */
  position: absolute; left: 0; right: 0; top: 0; height: 66px; border-radius: 3px 3px 0 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, transparent 0 8px, var(--paper-3) 8px 10px);
  border-bottom: 2px solid var(--paper-3);
}
.g-vgrid.is-3 .g-vcard-ruler { height: 58px; }
.g-vcard-av { position: relative; display: grid; place-items: center; }
.g-vcard-name {
  position: relative; max-width: 100%; padding: 3px 8px; border-radius: 4px; background: var(--ink); color: var(--paper);
  font: 700 13px/1.25 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.g-vcard-clues { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 100%; max-height: 46px; overflow: hidden; }
.g-vcard-clues span { max-width: 100%; padding: 2px 6px; border: 1.5px solid var(--ink); border-radius: 6px 6px 6px 2px; font: 700 12px/1.2 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-vcard-clues span.is-skip { border-style: dashed; color: var(--ink-soft); font: 700 10px/1.25 var(--font-mono); text-transform: uppercase; }
.g-vcard-flags { position: absolute; left: 6px; top: 6px; display: flex; flex-direction: column; gap: 3px; }
.g-flag { min-width: 22px; height: 22px; padding: 0 4px; display: grid; place-items: center; border-radius: 11px; border: 2px solid var(--ink); font: 800 10px/1 var(--font-mono); }
.g-flag .g-ic { width: 12px; height: 12px; stroke-width: 3.2; }
.g-flag.is-mark { background: var(--red-hi); }
.g-flag.is-acc { background: var(--paper); color: var(--red-deep); }
.g-flag.is-left { background: var(--ink); color: var(--paper); padding: 0 6px; }
.g-vcard-pick {
  position: absolute; right: -9px; top: -10px; z-index: 2; width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 50%; background: var(--red); color: var(--paper); border: var(--bw) solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
  transform: scale(0) rotate(-40deg); transition: transform var(--t-med) var(--ease-spring);
}
.g-vcard-pick .g-ic { width: 18px; height: 18px; stroke-width: 3.4; }
.g-vcard.is-on { background: var(--yellow); transform: translateY(-3px) rotate(-1.2deg); box-shadow: 0 7px 0 var(--ink); }
.g-vcard.is-on .g-vcard-ruler { background: repeating-linear-gradient(to bottom, transparent 0 8px, var(--yellow-2) 8px 10px); border-bottom-color: var(--yellow-2); }
.g-vcard.is-on .g-vcard-pick, .g-vnospy.is-on .g-vcard-pick { transform: none; }
.g-vcard.is-hit { animation: g-hit .4s var(--ease-spring); }
.g-vgrid.is-full .g-vcard:not(.is-on) { opacity: .8; }
.g-vcard.is-off .g-vcard-name { background: var(--ink-soft); }
.g-vcard.is-ro { cursor: default; }
.g-vcard:active:not(.is-ro) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.g-vnospy {
  position: relative; grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; min-height: 58px; margin: 0; padding: 8px 14px; text-align: left;
  background: transparent; color: var(--paper); border: var(--bw) dashed var(--line-2); border-radius: 12px 4px 12px 4px;
  transition: background var(--t-fast), transform var(--t-med) var(--ease-spring);
}
.g-vnospy-ic { flex: 0 0 auto; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; background: var(--ink-2); border: 2px solid var(--line-2); }
.g-vnospy-ic .g-ic { width: 24px; height: 24px; }
.g-vnospy-t { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.g-vnospy-t b { font: 800 16px/1.15 var(--font-display); }
.g-vnospy-t small { font: 500 12.5px/1.3 var(--font-body); color: var(--paper-dim); }
.g-vnospy.is-on { background: var(--yellow); color: var(--ink); border: var(--bw) solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.g-vnospy.is-on small { color: var(--ink-soft); }
.g-vnospy.is-on .g-vnospy-ic { background: var(--ink); color: var(--yellow); border-color: var(--ink); }
.g-vote .g-dock-note { min-height: 18px; font-size: 13px; }
.g-vote .g-dock-row .g-peekbtn { min-height: 62px; }

/* ---------- REVEAL ---------- */
.g-rv-body { display: flex; flex-direction: column; gap: 12px; }
.g-rv-stage { --rv-h: 246px; position: relative; flex: 0 0 auto; height: var(--rv-h); }
.g-rv-scene { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity .35s var(--ease-out), transform .45s var(--ease-spring); }
.g-rv-scene.is-on { opacity: 1; pointer-events: auto; transform: none; }
.g-rv-votes { bottom: auto; max-height: 100%; transform: translateY(14px); display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: var(--ink-2); border: var(--bw) solid var(--ink); border-radius: 6px 16px 6px 16px; overflow: hidden; }
.g-rv-votes.is-off { transform: translateY(-14px) scale(.96); }
.g-rv-k { display: flex; justify-content: space-between; margin-bottom: 2px; font: 700 10.5px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--paper-mute); }
.g-tl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) 30px; align-items: center; gap: 8px; min-height: 34px; padding: 2px 6px; border-radius: 8px; transition: background var(--t-med), color var(--t-med); }
.g-tl-who { display: flex; align-items: center; gap: 7px; min-width: 0; }
.g-tl-name { min-width: 0; font: 700 14px/1.2 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-tl-noic { width: 28px; height: 28px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); }
.g-tl-noic .g-ic { width: 17px; height: 17px; }
.g-tl-track { display: flex; align-items: center; min-width: 0; height: 26px; padding-left: 6px; overflow: hidden; border-left: 2px dashed var(--line-2); }
.g-tok { display: inline-flex; margin-left: -7px; flex: 0 0 auto; }
.g-tok:first-child { margin-left: 0; }
.g-tok.is-fly { animation: g-fly .5s var(--ease-spring) both; }
.g-tl-n { font: 900 20px/1 var(--font-display); text-align: right; }
.g-tl-n.is-bump { animation: g-pop .35s var(--ease-spring); }
.g-tl.is-hot { background: var(--yellow); color: var(--ink); }
.g-tl.is-hot .g-tl-track { border-left-color: var(--ink); }
.g-tl-more, .g-tl-empty { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px; font: 600 13px/1.2 var(--font-body); color: var(--paper-mute); }
.g-tl-empty .g-ic { width: 22px; height: 22px; }
/* сцена карточек фиксированной высоты: финальное «ужатие» — только transform, без анимации размеров */
.g-rv-cards { bottom: auto; height: var(--rv-h); transform: scale(.9); transform-origin: 50% 0; }
.g-rv-cardrow { display: flex; align-items: center; justify-content: center; gap: 16px; height: 100%; }
.g-rcard { --w: 168px; width: var(--w) !important; animation: g-card-in .55s var(--ease-spring) both; }
.g-rv-cardrow.is-two .g-rcard { --w: 146px; }
.g-rv-cardrow.is-two .g-rcard:nth-child(2) { animation-delay: .12s; }
.g-rf, .g-rb { justify-content: flex-start; gap: 7px; padding: 18px 10px 12px; color: var(--ink); }
.g-rf small, .g-rb small { font: 700 10px/1.1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.g-rf-q { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--manila); font: 900 34px/1 var(--font-display); }
.g-rf-name { max-width: 100%; font: 800 15px/1.15 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-rb-role { padding: 4px 10px; border-radius: 6px; border: 2px solid var(--ink); font: 900 14px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; background: var(--paper); }
.g-rb.is-spy { color: var(--paper); }

.g-c3 .g-c3-none { background: repeating-linear-gradient(-45deg, transparent 0 10px, var(--paper-2) 10px 13px), var(--paper) !important; }
.g-rv-stampbox { position: absolute; left: 0; right: 0; top: 80%; transform: translateY(-50%); z-index: 5; display: grid; place-items: center; pointer-events: none; }

.g-rv-verdict, .g-rv-facts > *, .g-rv-mini { opacity: 0; transform: translateY(14px); }
.g-reveal.is-final .g-rv-verdict, .g-reveal.is-final .g-rv-facts > *, .g-reveal.is-final .g-rv-mini { opacity: 1; transform: none; transition: opacity .38s var(--ease-out), transform .5s var(--ease-spring); }
.g-reveal.is-final .g-rv-facts > :nth-child(1) { transition-delay: .08s; }
.g-reveal.is-final .g-rv-facts > :nth-child(2) { transition-delay: .16s; }
.g-reveal.is-final .g-rv-facts > :nth-child(3) { transition-delay: .24s; }
.g-reveal.is-final .g-rv-mini { transition-delay: .32s; }
.g-reveal.is-fast .g-rv-scene { transition: none; }
.g-rv-vrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.g-rv-verdict h2 { font: 800 22px/1.15 var(--font-display); letter-spacing: -.01em; }
.g-rv-verdict p { margin-top: 4px; font: 500 14px/1.4 var(--font-body); color: var(--paper-dim); }
.g-res { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; padding: 5px 6px 5px 10px; border-radius: 8px; border: 2px solid var(--ink); color: var(--ink); transform: rotate(3deg); box-shadow: 3px 3px 0 var(--ink); }

.g-fact { min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 9px 11px 10px; background: var(--paper); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 6px 12px 6px 12px; box-shadow: 3px 3px 0 var(--ink); }
.g-fact small { font: 700 10px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.g-fact-big { font: 900 22px/1.08 var(--font-display); letter-spacing: -.01em; overflow-wrap: break-word; hyphens: auto; }
.g-fact-hid, .g-fact-none { font: 700 14px/1.3 var(--font-body); color: var(--ink-soft); }

.g-spychip-t { min-width: 0; display: flex; flex-direction: column; gap: 2px; }

.g-auto { display: flex; flex-direction: column; gap: 6px; }
.g-auto-t { font: 600 12px/1.2 var(--font-mono); letter-spacing: .04em; color: var(--paper-mute); text-align: center; }
.g-auto-bar { display: block; height: 5px; border-radius: 3px; background: var(--ink); overflow: hidden; }

.g-votes { display: flex; flex-direction: column; gap: 6px; }
.g-vote-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) 16px minmax(0, 1fr); align-items: center; gap: 8px; padding: 6px 0; border-bottom: 2px dashed var(--line); font: 600 14px/1.2 var(--font-body); }
.g-vote-row b, .g-vote-row span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-vote-row .g-ic { width: 16px; height: 16px; color: var(--paper-mute); }

/* ---------- GUESS ---------- */
.g-gs-top { margin-bottom: 12px; }
.g-gs-lead { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: var(--red); color: var(--paper); border: var(--bw) solid var(--ink); border-radius: 6px 14px 6px 14px; box-shadow: var(--shadow-comic); }
.g-gs-lead > p { font: 800 16px/1.3 var(--font-display); }
.g-gs-meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.g-gs-pack { display: inline-flex; align-items: center; gap: 8px; font: 600 13px/1.2 var(--font-body); }
.g-gs-lead .g-link { color: var(--paper); text-decoration: underline; text-underline-offset: 3px; }
.g-gs-spy { display: flex; align-items: center; gap: 16px; padding: 12px 14px; background: var(--ink-2); border: var(--bw) solid var(--ink); border-radius: 6px 14px 6px 14px; }
.g-gs-avs { display: flex; gap: 10px; flex: 0 0 auto; }
.g-orbit { position: relative; display: grid; place-items: center; padding: 8px; }
.g-orbit-lens { position: absolute; inset: -4px; animation: g-orbit 2.6s linear infinite; pointer-events: none; }
.g-orbit-lens .g-ic { position: absolute; left: 50%; top: -6px; width: 26px; height: 26px; margin-left: -13px; color: var(--yellow); stroke-width: 3; filter: drop-shadow(2px 2px 0 var(--ink)); animation: g-orbit 2.6s linear infinite reverse; }
.g-gs-spyt { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.g-gs-spyt b { font: 800 18px/1.15 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-gs-spyt span { font: 600 14px/1.2 var(--font-body); color: var(--yellow); }
.g-gs-spyt small { font: 500 12.5px/1.3 var(--font-body); color: var(--paper-dim); }
.g-gs-board { position: relative; }
.g-gs-res { display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: var(--paper); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 6px 14px 6px 14px; box-shadow: var(--shadow-comic); animation: g-pop .45s var(--ease-spring) both; }
.g-gs-res-av { position: relative; flex: 0 0 auto; width: 104px; padding-bottom: 14px; display: grid; place-items: center; }
.g-gs-res-stamp { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); font-size: 21px; }
.g-gs-res-stamp .ui-stamp, .g-gs-res-stamp .g-fb-stamp { font-size: 1em; background: var(--paper); }
.g-gs-res-t { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.g-gs-res-t p { font: 600 14px/1.35 var(--font-body); color: var(--ink-soft); }
.g-gs-res-t q { quotes: '«' '»'; font: 800 16px/1.2 var(--font-display); color: var(--ink); }
.g-gs-res-v { color: var(--ink) !important; font-weight: 700 !important; }
.g-gs-res.is-right { background: var(--paper-2); }
.g-ggrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.g-gopt {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; margin: 0; padding: 8px 8px;
  background: var(--paper); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 10px 4px 10px 4px; box-shadow: 0 3px 0 var(--ink); text-align: center;
  transition: transform var(--t-med) var(--ease-spring), background var(--t-fast), box-shadow var(--t-med), outline-color var(--t-fast);
  outline: 3px solid transparent; outline-offset: 2px;
  animation: ui-rise var(--t-slow) var(--ease-spring) both; animation-delay: calc(var(--i) * 35ms);
}
.g-gopt-w { font: 800 15px/1.15 var(--font-display); letter-spacing: -.01em; overflow-wrap: anywhere; hyphens: auto; }
.g-gopt-tag { font: 700 9.5px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.g-gopt.is-real { border-style: dashed; }
.g-gopt.is-on { background: var(--yellow); transform: translateY(-3px) rotate(-1.5deg); box-shadow: 0 6px 0 var(--ink); }
.g-gopt.is-scan { outline-color: var(--yellow); transform: translateY(-2px); }
.g-gopt.is-ro { cursor: default; }
.g-gopt.is-locked:not(.is-on):not(.is-truth):not(.is-guess) { opacity: .5; }
.g-gopt:active:not(.is-ro):not(.is-locked) { transform: translateY(3px); box-shadow: none; }
.g-gopt.is-truth { background: var(--mint); border-style: solid; }
.g-gopt.is-guess.is-wrong { background: var(--red-hi); }
.g-gopt.is-guess.is-right { background: var(--mint); transform: scale(1.04); }
.g-gs-stamp { position: absolute; left: 0; right: 0; top: 50%; z-index: 4; display: grid; place-items: center; transform: translateY(-50%); pointer-events: none; }
.g-gs-stamp .ui-stamp, .g-gs-stamp .g-fb-stamp { font-size: clamp(34px, 12vw, 52px); background: var(--bg-deep); }
.g-gs-out { margin-top: 14px; padding: 12px 14px; background: var(--paper); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 6px 14px 6px 14px; box-shadow: var(--shadow-comic); animation: g-pop .45s var(--ease-spring) both; }
.g-gs-out p { font: 600 14px/1.4 var(--font-body); }
.g-gs-out p + p { margin-top: 4px; }
.g-gs-out q { font-weight: 800; quotes: '«' '»'; }

/* ---------- SCORES ---------- */
.g-sc-out { margin-bottom: 12px; padding: 12px 14px; background: var(--paper); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 6px 14px 6px 14px; box-shadow: var(--shadow-comic); animation: ui-rise var(--t-slow) var(--ease-spring) both; }
.g-sc-out-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; }
.g-sc-badge { padding: 5px 10px; border-radius: 6px; border: 2px solid var(--ink); font: 800 13px/1 var(--font-display); text-transform: uppercase; letter-spacing: .03em; transform: rotate(-2deg); background: var(--yellow); }
.g-sc-out.is-green .g-sc-badge { background: var(--mint); }
.g-sc-out.is-red .g-sc-badge { background: var(--red-hi); }
.g-sc-word { font: 600 13px/1.2 var(--font-body); color: var(--ink-soft); }
.g-sc-word b { color: var(--ink); font: 800 15px/1.1 var(--font-display); }
.g-sc-out q { quotes: '«' '»'; font-weight: 800; color: var(--ink); }
.g-sc-out p { margin-top: 8px; font: 500 13.5px/1.35 var(--font-body); color: var(--ink-soft); }
.g-sc-list { position: relative; display: flex; flex-direction: column; gap: 7px; margin: 0; padding: 0; list-style: none; }
.g-sc-row {
  position: relative; display: grid; grid-template-columns: 22px 44px minmax(0, 1fr) auto 46px; align-items: center; gap: 8px;
  min-height: 60px; padding: 8px 12px 8px 8px; background: var(--bg-2); border: var(--bw) solid var(--ink); border-radius: 6px 12px 6px 12px;
  transition: background var(--t-med); /* перестановка — FLIP через Web Animations */
  animation: ui-rise var(--t-slow) var(--ease-spring) both; animation-delay: calc(var(--i) * 45ms);
}
.g-sc-row.is-me { background: var(--paper); color: var(--ink); }
.g-sc-row.is-off { opacity: .6; }
.g-sc-rank { font: 700 15px/1 var(--font-mono); color: var(--paper-mute); text-align: center; }
.g-sc-row.is-me .g-sc-rank { color: var(--ink-soft); }
.g-sc-av { position: relative; display: grid; place-items: center; }
.g-crown { position: absolute; left: -9px; top: -15px; width: 28px; height: 28px; opacity: 0; transform: translateY(-14px) rotate(-22deg) scale(.6); transition: opacity .3s, transform .55s var(--ease-spring); }
.g-crown .g-ic { width: 28px; height: 28px; }
.g-sc-row.is-lead { border-color: var(--yellow); box-shadow: 0 0 0 2px var(--ink), 4px 4px 0 var(--ink); }
.g-sc-row.is-lead .g-crown { opacity: 1; transform: rotate(-22deg); }
.g-sc-row.is-lead .g-sc-rank { color: var(--yellow); }
.g-sc-row.is-me.is-lead .g-sc-rank { color: var(--yellow-2); }
.g-sc-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.g-sc-name { font: 700 15px/1.2 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-sc-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.g-tag { padding: 2px 6px; border-radius: 5px; border: 1.5px solid var(--line-2); font: 700 9.5px/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--paper-mute); }
.g-sc-row.is-me .g-tag { border-color: var(--paper-3); color: var(--ink-soft); }
.g-tag.is-spy { background: var(--red-hi); border-color: var(--ink); color: var(--ink) !important; }
.g-sc-delta { padding: 4px 8px; border-radius: 999px; border: 2px solid var(--ink); font: 800 13px/1 var(--font-mono); color: var(--ink); background: var(--mint); opacity: 0; transform: scale(.3) translateY(8px); transition: opacity .2s, transform .45s var(--ease-spring); }
.g-sc-delta.is-zero { background: var(--paper-3); color: var(--ink-soft); }
.g-sc-delta.is-on { opacity: 1; transform: none; }
.g-sc-score { font: 900 24px/1 var(--font-display); text-align: right; font-variant-numeric: tabular-nums; }
.g-sc-btns > .ui-btn:first-child, .g-sc-btns > .g-fb-btn:first-child { flex: 0 0 auto; }
.g-sc-btns > .ui-btn:last-child, .g-sc-btns > .g-fb-btn:last-child { flex: 1 1 auto; }
.g-sc-dock .g-auto-t { margin: 0; }
.g-wait { display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 56px; justify-content: center; text-align: center; }
.g-wait b { font: 800 17px/1.2 var(--font-display); color: var(--paper); }
.g-wait span { font: 500 13px/1.3 var(--font-body); color: var(--paper-dim); max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

/* ---------- запасные элементы (если в ките чего-то нет) ---------- */
.g-fb-av { display: inline-grid; place-items: center; border-radius: 50%; background: var(--sky); color: var(--ink); border: 3px solid var(--ink); font-family: var(--font-display); font-weight: 800; }
.g-fb-av.is-dim { opacity: .45; }
.g-fb-av.is-ring { box-shadow: 0 0 0 3px var(--yellow); }
.g-fb-btn { min-height: 52px; padding: 0 18px; border: 3px solid var(--ink); border-radius: 14px 5px 14px 5px; background: var(--yellow); color: var(--ink); font: 800 16px/1 var(--font-body); }
.g-fb-btn.is-secondary { background: var(--paper); }
.g-fb-btn.is-ghost { background: transparent; color: var(--paper); border-style: dashed; border-color: var(--line-2); }
.g-fb-btn.is-full { width: 100%; }
.g-fb-btn.is-sm { min-height: 44px; font-size: 13px; }
.g-fb-btn:disabled { opacity: .5; }
.g-fb-stamp { display: inline-block; padding: .3em .6em; border: .14em solid var(--red); color: var(--red); font: 900 26px/1 var(--font-display); text-transform: uppercase; }
.g-fb-stamp.is-green { border-color: var(--mint); color: var(--mint); }
.g-fb-stamp.is-yellow { border-color: var(--yellow); color: var(--yellow); }
.g-fb-ring { position: relative; display: inline-grid; place-items: center; }
.g-fb-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.g-fb-ring-bg { fill: var(--ink-2); stroke: var(--ink); stroke-width: 3; }
.g-fb-ring-arc { fill: none; stroke: var(--yellow); stroke-width: 5; stroke-linecap: round; }
.g-fb-ring-t { position: relative; font: 700 14px/1 var(--font-mono); color: var(--paper); }
.g-fb-c3 { position: relative; width: 240px; aspect-ratio: 3 / 4; perspective: 1000px; }
.g-fb-c3-in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .5s var(--ease-spring); }
.g-fb-c3.is-flipped .g-fb-c3-in { transform: rotateY(180deg); }
.g-fb-c3-face { position: absolute; inset: 0; display: flex; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--manila); border: 3px solid var(--ink); border-radius: 16px 6px 16px 6px; }
.g-fb-c3-face.is-back { transform: rotateY(180deg); background: var(--paper); }
.g-fb-pack { display: inline-grid; place-items: center; border-radius: 8px; background: var(--manila); color: var(--ink); border: 2px solid var(--ink); font: 900 11px/1 var(--font-display); }
.g-fb-sheet { position: fixed; inset: 0; z-index: 90; display: flex; align-items: flex-end; background: var(--bg-deep); }
.g-fb-sheet-in { width: 100%; max-height: 80vh; overflow: auto; padding: 18px; background: var(--bg-2); border-top: 3px solid var(--ink); border-radius: 20px 20px 0 0; }

/* ---------- v2: плавные появления (единые кривые кита, только transform/opacity) ---------- */
.g-slot > * { animation: g-in var(--t-med) var(--ease-out) backwards; }
.g-cdock > * { animation: g-in var(--t-slow) var(--ease-out) backwards; }

/* ---------- v2: «Один телефон на всех» — шторка «Передай телефон» ---------- */
.screen > .g-host { flex: 1 1 0; min-height: 0; }
.g-host { position: relative; display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden; overflow: clip; }
.g-host > .g-screen { flex: 1 1 0; min-height: 0; height: auto; }
.g-pass {
  position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column; overflow: hidden;
  padding: 12px calc(16px + var(--safe-r, 0px)) calc(18px + var(--safe-b, 0px)) calc(16px + var(--safe-l, 0px));
  background: var(--bg-deep); color: var(--paper); font-family: var(--font-body);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  transform: translateY(-102%); visibility: hidden;
  transition: transform .52s var(--ease-out), visibility 0s linear .52s;
}
.g-pass.is-on { transform: none; visibility: visible; transition: transform .48s var(--ease-out), visibility 0s; }
.g-pass.is-instant { transition: none !important; }
.g-pass::after { /* кромка шторки */
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; pointer-events: none;
  background: repeating-linear-gradient(-45deg, var(--yellow) 0 10px, var(--ink) 10px 20px);
}
.g-pass-bg { position: absolute; inset: 0; pointer-events: none; background: var(--halftone-paper) 0 0 / 9px 9px;
  -webkit-mask-image: radial-gradient(90% 60% at 50% 42%, #000 20%, transparent 85%); mask-image: radial-gradient(90% 60% at 50% 42%, #000 20%, transparent 85%); }
.g-pass-in { position: relative; z-index: 1; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.g-pass-in.is-swap { animation: g-in var(--t-slow) var(--ease-out) backwards; }
.g-pass-top { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
.g-pass-eyebrow {
  display: inline-flex; align-items: center; gap: 7px; min-width: 0; padding: 6px 11px; border-radius: 999px; border: var(--bw-thin) solid var(--line-2);
  font: 700 11px/1.1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--paper-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.g-pass-eyebrow .g-ic { width: 15px; height: 15px; stroke-width: 2.8; }
.g-pass-eyebrow.is-done { background: var(--mint); color: var(--ink); border-color: var(--ink); animation: g-pop .5s var(--ease-spring) backwards; }
.g-pass-mid { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.g-pass-art { width: 112px; height: auto; flex: 0 0 auto; overflow: visible; }
.g-pa-arc { fill: none; stroke: var(--yellow); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.g-pa-body { fill: var(--ink); stroke: var(--paper); stroke-width: 3; }
.g-pa-screen { fill: var(--bg-3); }
.g-pa-lock { fill: var(--yellow); }
.g-pa-key { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.g-pa-btn { stroke: var(--paper-mute); stroke-width: 3; stroke-linecap: round; }
.g-pa-phone { transform-box: fill-box; transform-origin: 50% 80%; animation: g-sway 3s ease-in-out infinite; }
.g-pass-k { font: 700 12px/1.1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--paper-mute); }
.g-pass-who { display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 100%; }
.g-pass-name {
  max-width: 100%; font: 900 30px/1.08 var(--font-display); letter-spacing: -.01em; color: var(--yellow); text-shadow: 3px 3px 0 var(--ink);
  overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.g-pass-what { max-width: 320px; font: 600 15px/1.35 var(--font-body); color: var(--paper); }
.g-pass-alt { display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 100%; margin-top: 4px; }
.g-pass-alt small { font: 600 12px/1.2 var(--font-body); color: var(--paper-mute); }
.g-pass-alt-l { display: flex; gap: 6px; max-width: 100%; padding: 2px; overflow-x: auto; scrollbar-width: none; }
.g-pass-alt-l::-webkit-scrollbar { display: none; }
.g-pass-altbtn {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; max-width: 170px; margin: 0; padding: 3px 13px 3px 5px;
  border-radius: 999px; background: var(--ink-2); color: var(--paper); border: var(--bw-thin) solid var(--line-2); font: 700 13px/1 var(--font-body);
  transition: transform var(--t-fast) var(--ease-out);
}
.g-pass-altbtn span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-pass-altbtn:active { transform: scale(.96); }
.g-pass-bot { flex: 0 0 auto; display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding-bottom: 6px; }
.g-pass-hold {
  position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 66px; margin: 0; padding: 0 18px;
  background: var(--yellow); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 16px 6px 16px 6px; box-shadow: 0 5px 0 var(--ink);
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: pointer;
  transition: transform var(--t-fast) var(--ease-out), box-shadow var(--t-fast) var(--ease-out);
}
.g-pass-hold:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
.g-pass-hold.is-holding { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.g-pass-fill { position: absolute; inset: 0; background: var(--mint); transform: scaleX(0); transform-origin: 0 50%; transition: transform var(--t-med) var(--ease-out); }
.g-pass-hold.is-holding .g-pass-fill { transform: scaleX(1); transition: transform .7s linear; }
.g-pass-hold-t { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; max-width: 100%; }
.g-pass-hold-t b { max-width: 100%; font: 800 19px/1.1 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-pass-hold-t small { font: 700 10.5px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.g-pass-note { text-align: center; font: 500 13px/1.3 var(--font-body); color: var(--paper-dim); }
.g-pass-seats { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; }
.g-pass-seat { display: inline-flex; border-radius: 50%; transition: transform var(--t-med) var(--ease-spring); }
.g-pass-seat.is-ok { transform: translateY(-2px); }
.g-pass-stamp { font-size: 40px; margin-bottom: 8px; }
.g-pass-stamp .ui-stamp, .g-pass-stamp .g-fb-stamp { font-size: 1em; }
.g-pass-mid.is-rest .g-pass-k { font: 800 22px/1.2 var(--font-display); letter-spacing: -.01em; text-transform: none; color: var(--paper); }
.g-pass-mid.is-rest .g-pass-what { color: var(--paper-dim); }
.g-pass-chip {
  position: absolute; left: 50%; top: 12px; z-index: 61; display: inline-flex; align-items: center; gap: 8px; max-width: calc(100% - 32px); padding: 9px 14px;
  border-radius: 999px; background: var(--mint); color: var(--ink); border: var(--bw-thin) solid var(--ink); box-shadow: 0 4px 0 var(--ink);
  font: 700 13px/1.2 var(--font-body); opacity: 0; transform: translate(-50%, -18px); pointer-events: none;
  transition: opacity .3s var(--ease-out), transform .45s var(--ease-spring);
}
.g-pass-chip.is-on { opacity: 1; transform: translate(-50%, 0); }
.g-pass-chip span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-pass-chip .g-ic { width: 16px; height: 16px; stroke-width: 3; }

/* ---------- v2: реплики ботов — бабблы у аватара ---------- */
.g-bubble { position: absolute; z-index: 6; display: flex; align-items: center; pointer-events: none; }
.g-bubble-in {
  position: relative; display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; padding: 7px 11px;
  background: var(--paper); color: var(--ink); border: var(--bw-thin) solid var(--ink); border-radius: 12px 12px 12px 4px; box-shadow: 3px 3px 0 var(--ink);
  font: 600 13px/1.25 var(--font-body); text-align: left; text-transform: none; letter-spacing: 0;
  transform-origin: 0 50%; animation: g-bub-in .45s var(--ease-spring) backwards;
}
.g-bubble-in::before { /* хвостик к аватару */
  content: ''; position: absolute; left: -7px; top: 50%; width: 11px; height: 11px; margin-top: -6px;
  background: var(--paper); border-left: var(--bw-thin) solid var(--ink); border-bottom: var(--bw-thin) solid var(--ink); transform: rotate(45deg);
}
.g-bubble.is-out .g-bubble-in { opacity: 0; transform: scale(.9); transition: opacity .3s var(--ease-out), transform .34s var(--ease-out); }
.g-bubble-t { min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.g-bubble-who { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; max-width: 42%; }
.g-bubble-who b { min-width: 0; font: 800 13px/1 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-bubble.is-row { left: 70px; right: 6px; top: 0; bottom: 0; }
.g-table.is-dense .g-bubble.is-row { left: 62px; }
.g-bubble.is-sc { left: 86px; right: 106px; }
.g-bubble.is-sc .g-bubble-t { -webkit-line-clamp: 3; font-size: 12px; }
.g-bubble.is-card { left: 4px; right: 4px; top: -14px; justify-content: center; align-items: flex-start; }
.g-bubble.is-card .g-bubble-in { padding: 6px 9px; font-size: 12px; transform-origin: 50% 100%; border-radius: 12px 12px 12px 12px; }
.g-bubble.is-card .g-bubble-in::before { left: 50%; top: auto; bottom: -7px; margin: 0 0 0 -6px; transform: rotate(-45deg); }
.g-bubble.is-card .g-bubble-t { -webkit-line-clamp: 3; }
.g-say { position: absolute; left: calc(16px + var(--safe-l, 0px)); right: calc(16px + var(--safe-r, 0px)); bottom: calc(100% + 16px); height: 0; pointer-events: none; }
.g-bubble.is-say { left: 0; right: 0; bottom: 0; justify-content: flex-start; align-items: flex-end; }
.g-bubble.is-say .g-bubble-in { transform-origin: 20px 100%; border-radius: 12px 12px 12px 4px; }
.g-bubble.is-say .g-bubble-in::before { left: 18px; top: auto; bottom: -7px; margin: 0; transform: rotate(-45deg); }
.g-ticker.is-chat .g-ticker-ic { background: var(--paper); }
.g-feed-row.is-chat { border-left: 5px solid var(--sky); }

/* ---------- v2: пауза «прочитать» между ходами ---------- */
.g-turn-read { display: none; align-items: center; gap: 5px; color: var(--ink); }
.g-turn-read .g-ic { width: 15px; height: 15px; flex: 0 0 auto; }
.g-turn.is-pause .g-turn-txt > .g-turn-sub:not(.g-turn-read) { display: none; }
.g-turn.is-pause .g-turn-read { display: flex; animation: g-in var(--t-slow) var(--ease-out) backwards; }
.g-turn > .g-turn-pause { position: absolute; left: 12px; right: 12px; bottom: 5px; height: 3px; border-radius: 2px; overflow: hidden; background: var(--paper-3); opacity: 0; transition: opacity var(--t-med) var(--ease-out); }
.g-turn-pause i { display: block; height: 100%; background: var(--ink); transform-origin: 0 50%; }
.g-turn.is-pause > .g-turn-pause { opacity: 1; }
.g-turn-last.is-reading q { background: var(--yellow); box-shadow: 0 0 0 2px var(--yellow); border-radius: 3px; }

/* ---------- v2: «Подставной» — оба слова на итоге ---------- */
.g-rv-facts.is-uc { grid-template-columns: minmax(0, 1fr); }
.g-pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: 8px; }
.g-pair-cell { min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 7px 9px; border-radius: 8px 3px 8px 3px; border: var(--bw-thin) dashed var(--paper-3); }
.g-pair-cell.is-spy { background: var(--red); color: var(--paper); border: var(--bw-thin) solid var(--ink); }
.g-pair-cell.is-spy small { color: var(--paper); opacity: .9; }
.g-pair .g-fact-big { font-size: 20px; }
.g-pair-ne { align-self: center; font: 900 22px/1 var(--font-display); color: var(--ink-soft); }
.g-rv-facts.is-uc .g-fact-spy { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.g-rv-facts.is-uc .g-spies { flex-direction: row; flex-wrap: wrap; }
.g-rb-decoy { max-width: 100%; padding: 2px 7px; border-radius: 4px; background: var(--ink); color: var(--paper); font: 700 11px/1.2 var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-sc-pair { margin-top: 8px; font: 600 14px/1.35 var(--font-body); color: var(--ink) !important; }
.g-sc-pair b { font: 800 15px/1.1 var(--font-display); }

/* ---------- v2: награды партии — карточки-медали ---------- */
.g-aw { margin: 0 0 14px; }
.g-aw-k { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font: 700 10.5px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--paper-mute); }
.g-aw-k::after { content: ''; flex: 1 1 auto; height: 2px; background: var(--line-2); }
.g-aw-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.g-aw-list.is-n1 { grid-template-columns: minmax(0, 1fr); }
.g-aw-list.is-n2, .g-aw-list.is-n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-medal {
  position: relative; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 7px 10px; text-align: center;
  background: var(--paper); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 12px 4px 12px 4px; box-shadow: 3px 3px 0 var(--ink);
  animation: g-medal-in .75s var(--ease-spring) backwards; animation-delay: calc(240ms + var(--i) * 150ms);
}
.g-medal-disc { position: relative; flex: 0 0 auto; width: 50px; height: 50px; }
.g-medal-rib { position: absolute; left: 50%; top: -17px; width: 26px; height: 24px; margin-left: -13px; background: linear-gradient(90deg, var(--red) 0 50%, var(--sky) 50%); clip-path: polygon(0 0, 100% 0, 78% 100%, 22% 100%); }
.g-medal-face { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; border-radius: 50%; background: var(--yellow); border: var(--bw) solid var(--ink); box-shadow: inset 0 0 0 4px var(--yellow-2), 0 3px 0 var(--ink); }
.g-medal.is-silver .g-medal-face { background: var(--paper-2); box-shadow: inset 0 0 0 4px var(--paper-3), 0 3px 0 var(--ink); }
.g-medal.is-bronze .g-medal-face { background: var(--manila); box-shadow: inset 0 0 0 4px var(--yellow-2), 0 3px 0 var(--ink); }
.g-medal.is-silver .g-medal-rib { background: linear-gradient(90deg, var(--sky) 0 50%, var(--mint) 50%); }
.g-medal.is-bronze .g-medal-rib { background: linear-gradient(90deg, var(--red-deep) 0 50%, var(--manila) 50%); }
.g-medal-face .g-ic { position: relative; width: 26px; height: 26px; stroke-width: 2.6; color: var(--ink); }
.g-medal-shine { position: absolute; inset: 0; pointer-events: none; }
.g-medal-shine::after {
  content: ''; position: absolute; top: -20%; bottom: -20%; left: 0; width: 42%; opacity: .8;
  background: linear-gradient(90deg, transparent, var(--paper), transparent); transform: translateX(-170%) skewX(-18deg);
  animation: g-shine 1.1s var(--ease-out) backwards; animation-delay: calc(820ms + var(--i) * 150ms);
}
.g-medal-title { max-width: 100%; font: 800 clamp(10.5px, 3.1vw, 12.5px)/1.15 var(--font-display); letter-spacing: -.02em; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; }
.g-medal-who { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 2px 8px 2px 2px; border-radius: 999px; background: var(--ink); color: var(--paper); }
.g-medal-who span { min-width: 0; font: 700 12px/1 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-medal-text { font: 500 11.5px/1.25 var(--font-body); color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- анимации ---------- */
@keyframes g-pop { 0% { transform: scale(.5); opacity: 0; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: none; } }
@keyframes g-hit { 0% { transform: translateY(-3px) rotate(-1.2deg) scale(.94); } 60% { transform: translateY(-5px) rotate(-1.2deg) scale(1.04); } 100% { transform: translateY(-3px) rotate(-1.2deg); } }
@keyframes g-clue-pop { 0% { transform: translateY(10px) scale(.4) rotate(-8deg); opacity: 0; } 55% { transform: translateY(-2px) scale(1.12) rotate(2deg); opacity: 1; } 100% { transform: none; } }
@keyframes g-dot { 0%, 80%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-4px); opacity: 1; } }
@keyframes g-ring { 0% { transform: scale(.55); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }
@keyframes g-glow { 0%, 100% { opacity: .22; } 50% { opacity: .45; } }
@keyframes g-in { from { opacity: 0; transform: translateY(6px); } }
@keyframes g-bub-in { 0% { opacity: 0; transform: translateY(6px) scale(.6); } 60% { opacity: 1; transform: translateY(-1px) scale(1.04); } 100% { transform: none; } }
@keyframes g-sway { 0%, 100% { transform: translateX(-5px) rotate(-9deg); } 50% { transform: translateX(5px) rotate(9deg); } }
@keyframes g-medal-in { 0% { opacity: 0; transform: translateY(-34px) rotate(-10deg) scale(.7); } 55% { opacity: 1; transform: translateY(4px) rotate(3deg) scale(1.04); } 100% { transform: none; } }
@keyframes g-shine { from { transform: translateX(-170%) skewX(-18deg); } to { transform: translateX(330%) skewX(-18deg); } }
@keyframes g-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
@keyframes g-deal-in { 0% { transform: translateY(40px) rotate(-6deg) scale(.86); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes g-card-in { 0% { transform: translateY(26px) rotate(5deg) scale(.8); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes g-press {
  0% { transform: translate(26px, 34px) rotate(-14deg); opacity: 0; }
  14% { opacity: 1; }
  32% { transform: translate(0, 0) rotate(-14deg) scale(1); }
  40%, 80% { transform: translate(0, 0) rotate(-14deg) scale(.86); }
  92% { transform: translate(0, 0) rotate(-14deg) scale(1); opacity: 1; }
  100% { transform: translate(8px, 10px) rotate(-14deg); opacity: 0; }
}
@keyframes g-ripple { 0%, 34% { transform: scale(.25); opacity: 0; } 42% { opacity: .95; } 86% { transform: scale(1.18); opacity: 0; } 100% { opacity: 0; } }
@keyframes g-nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes g-nudge-in { 0% { opacity: 0; transform: translate(-50%, 16px); } 12% { opacity: 1; transform: translate(-50%, 8px); } 82% { opacity: 1; transform: translate(-50%, 8px); } 100% { opacity: 0; transform: translate(-50%, 8px); } }
@keyframes g-slide-in { 0% { transform: translateX(-16px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes g-swap { 0% { transform: translateX(22px); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes g-ticker-in { 0% { transform: translateY(-10px) scale(.96); opacity: 0; } 100% { transform: none; opacity: 1; } }
@keyframes g-flash {
  0% { opacity: 0; transform: translateX(-60%) scale(.9); }
  16% { opacity: 1; transform: translateX(0) scale(1); }
  78% { opacity: 1; transform: translateX(0) scale(1); }
  100% { opacity: 0; transform: translateX(60%) scale(.96); }
}
@keyframes g-fly { 0% { transform: translate(-70px, -36px) scale(.3) rotate(-40deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes g-orbit { to { transform: rotate(360deg); } }

/* ---------- маленькие и низкие экраны ---------- */
@media (max-width: 370px) {
  .g-screen { padding-left: calc(12px + var(--safe-l, 0px)); padding-right: calc(12px + var(--safe-r, 0px)); }
  .g-body, .g-dock { margin-left: calc(-12px - var(--safe-l, 0px)); margin-right: calc(-12px - var(--safe-r, 0px)); padding-left: calc(12px + var(--safe-l, 0px)); padding-right: calc(12px + var(--safe-r, 0px)); }
  .g-title { font-size: 21px; }
  .g-steps { gap: 4px; font-size: 9.5px; letter-spacing: .06em; }
  .g-step + .g-step::before { width: 7px; }
  .g-turn-name { font-size: 18px; }
  .g-turn.is-me .g-turn-name { font-size: 21px; }
  .g-row-tag { max-width: 80px; }
  .g-send .ui-btn { padding: 0 12px; }
  .g-vgrid.is-3 { gap: 10px 7px; }
  .g-vgrid.is-3 .g-vcard { padding: 10px 5px 8px; }
  .g-vgrid.is-3 .g-vcard-name { font-size: 12px; padding: 2px 6px; }
  .g-rcard { --w: 150px; }
  .g-rv-cardrow.is-two .g-rcard { --w: 132px; }
  .g-sc-row { grid-template-columns: 18px 40px minmax(0, 1fr) auto 40px; gap: 6px; }
  .g-sc-score { font-size: 21px; }
  .g-peekbtn-t b { font-size: 12px; }
}
@media (max-height: 700px) {
  .g-head { gap: 6px; padding-bottom: 6px; }
  .g-head-row { min-height: 46px; }
  .g-clues .g-sub, .g-vote .g-sub, .g-reveal .g-sub, .g-scores .g-sub { display: none; }
  .g-title { font-size: 20px; }
  .g-turn { padding: 8px 10px; }
  .g-turn-last { margin-top: 6px; padding-top: 6px; }
  .g-memo { margin-bottom: 8px; }
  .g-memo small { display: none; }
  .g-rv-stage { --rv-h: 214px; }
  .g-reveal { --rv-k: .8; }
  .g-rcard { --w: 146px; }
  .g-rv-cardrow.is-two .g-rcard { --w: 128px; }
  .g-dock { padding-top: 10px; padding-bottom: calc(10px + var(--safe-b, 0px)); }
  .g-ready-lbl span { display: none; }
  .g-medal { padding: 12px 6px 8px; gap: 5px; }
  .g-medal-disc { width: 42px; height: 42px; }
  .g-medal-face .g-ic { width: 22px; height: 22px; }
  .g-medal-text { -webkit-line-clamp: 3; }
  .g-pass-art { width: 92px; }
  .g-pass-name { font-size: 26px; }
}
@media (max-height: 760px) {
  /* финальный кадр на низком экране: сцена карточек уменьшается масштабом (transform), место под ней — сразу */
  .g-reveal.is-final .g-rv-stage { height: 172px; }
  .g-reveal.is-final .g-rv-cards { transform: scale(var(--rv-k, .7)); }
  .g-reveal.is-final .g-rb small, .g-reveal.is-final .g-rf small { opacity: 0; transition: opacity var(--t-med) var(--ease-out); }
  .g-reveal.is-final .g-rv-stampbox { transform: translateY(-50%) translateY(16px) scale(.9); transition: transform .5s var(--ease-spring); }
  .g-reveal.is-final .g-rv-verdict { transition-delay: .12s; }
  .g-rv-verdict h2 { font-size: 20px; }
  .g-rv-body { gap: 10px; }
}
/* клавиатура открыта на низком экране — убираем второстепенное */
/* (оболочка уменьшает высоту под клавиатуру — экран узнаёт об этом по своему размеру, класс is-short) */

    let p = MK.A * a + (MK.G + FLOW_G * MK.A * b) * ev.g[w.p] + (MK.V + FLOW_V * MK.A * b) * ev.v + (MK.O + (1 - FLOW_G - FLOW_V) * MK.A * b) * EPS;
