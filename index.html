        role: spy ? 'spy' : 'word', word: spy ? null : word, packId: (!spy || st.spyKnowsTheme) ? pack.id : null,
        packKnown: !spy || !!st.spyKnowsTheme, spiesCount: need,
        fellowSpies: spy && st.spiesKnowEachOther ? spies.filter(x => x !== id) : [], noSpyPossible: st.noSpyChance > 0, mode,
      };
    }
    for (const p of S.players) p.waiting = !ids.includes(p.id);
    S.recent.push(pack.id + ':' + U.norm(word));
    while (S.recent.length > RECENT_MAX) S.recent.shift();
    S.game = {
      n: S.round, packId: pack.id, packTitle: pack.title, word, decoy, mode, tempo: TEMPOS.includes(st.tempo) ? st.tempo : 'calm',
      packIds: cands.map(p => p.id), defended: {},
      custom: pack.id === 'custom' ? pack : (cands.find(p => p.id === 'custom') || null),
      participants: ids, order, spies, noSpy, need, allowNoSpy: st.noSpyChance > 0,
      cards, startInfo, deal: { deadline: null, ready: [] }, clue: null, accusedBy: {},
      votes: {}, voteOrder: [], voteDeadline: null, voteClosing: false,
      result: null, guess: null, pub: [], phaseUntil: null, applied: false,
    };
    for (const id of ids) { const p = player(id); if (p.isBot) initBrain(p, false); }
    setPhase('deal');
    const dl = now() + ms(T.deal);
    S.game.deal.deadline = dl;
    schedule('dealEnd', dl - now());
    for (const id of ids) {
      if (player(id).isBot) schedule('botSeen', ms(TP().seen * (T.botSeenMin + rnd() * (T.botSeenMax - T.botSeenMin))), { pid: id });
    }
    sys(`Партия ${S.round}: карточки розданы`);
    return { ok: true };
  }
  function checkDealDone() {
    const g = S.game;
    if (S.phase !== 'deal' || !g) return;
    const humans = g.participants.map(player).filter(p => p && !p.isBot && present(p));
    const ready = id => g.deal.ready.includes(id);
    if (humans.length ? humans.every(p => ready(p.id)) : g.participants.every(ready)) toClues();
  }
  function toClues() {
    const g = S.game;
    setPhase('clues');
    g.clue = { round: 1, rounds: S.settings.clueRounds, idx: -1, turn: null, thinking: null, deadline: null, entries: [], seq: 0, turnMs: S.settings.turnSeconds * 1000, pauseUntil: null };
    nextTurn();
  }
  // Раздумье бота над подсказкой с учётом темпа: в calm/normal не короче/не длиннее рамки, внутри — как сказал мозг.
  function botClueThink(v) {
    const b = TP().clue;
    const t = thinkTime(v);
    if (!b) return t;
    const lo = ms(b[0]), hi = ms(b[1]);
    if (t >= lo && t <= hi) return t;
    if (t > hi) return hi;
    return Math.round(lo + (t / Math.max(1, lo)) * (hi - lo) * 0.6 + rnd() * (hi - lo) * 0.4);
  }
  function nextTurn() {
    const g = S.game, c = g.clue, n = g.order.length;
    c.idx++; c.seq++;
    c.thinking = null;
    if (c.idx >= n * c.rounds) {
      c.turn = null; c.deadline = null;
      const rest = c.pauseUntil && c.pauseUntil > now() ? c.pauseUntil - now() : 0;
      schedule('toVote', Math.max(rest, ms(TP().toVote)));
      return;
    }
    const r = Math.floor(c.idx / n) + 1;
    if (r !== c.round) { roundBoundary(c.round); c.round = r; sys(`Круг ${r} из ${c.rounds}`); }
    const pid = g.order[c.idx % n];
    const p = player(pid);
    c.turn = pid;
    const turnMs = c.turnMs > 0 ? ms(c.turnMs) : 0;
    c.deadline = turnMs > 0 ? now() + turnMs : null;
    if (!p || p.left) {
      c.deadline = now();
    } else if (p.isBot) {
      const res = brainCall(pid, 'clue', { round: c.round, rounds: c.rounds, history: entriesCopy(), feed: botFeed() },
        x => x && typeof x.text === 'string' && x.text.trim());
      // пауза «прочитать» после предыдущей подсказки: бот начинает «печатать» только после неё
      const pause = c.pauseUntil && c.pauseUntil > now() ? c.pauseUntil - now() : 0;
      let think = botClueThink(res && res.thinkMs);
      if (turnMs > 0) think = Math.min(think, Math.max(40, turnMs - pause - ms(400)));
      if (pause > 0) schedule('botThink', pause, { seq: c.seq, pid }); else c.thinking = pid;
      schedule('botClue', pause + think, { seq: c.seq, pid, text: res && typeof res.text === 'string' ? res.text : '' });
    } else if (!p.connected) {
      const lim = now() + ms(T.discTurn);
      if (c.deadline == null || c.deadline > lim) c.deadline = lim;
    }
    if (c.deadline != null) schedule('turnEnd', c.deadline - now(), { seq: c.seq });
  }
  function roundBoundary(done) {
    const g = S.game;
    const bots = U.shuffle(g.participants.filter(id => { const p = player(id); return p && p.isBot && !p.left; }), rnd);
    let k = 0;
    for (const id of bots) {
      const res = brainCall(id, 'accuse', { history: entriesCopy(), feed: botFeed(), round: done });
      if (!res || !res.to || res.to === id || !g.participants.includes(res.to)) continue;
      const delay = ms(TP().accuse * (T.accuseMin + k * T.accuseStep + rnd() * T.accuseStep));
      k++;
      schedule('botAccuse', delay, { pid: id, to: res.to, text: typeof res.text === 'string' ? res.text : '', cr: done });
    }
  }
  function validateClue(pid, raw) {
    const g = S.game;
    const text = String(raw == null ? '' : raw).replace(/[\u0000-\u001f]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!text) return { ok: false, error: 'empty', msg: 'Напиши подсказку' };
    if (text.length > 28) return { ok: false, error: 'long', msg: 'Не длиннее 28 символов' };
    const n = U.norm(text);
    const words = n.split(' ').filter(w => /[a-zа-я0-9]/.test(w));
    if (!words.length) return { ok: false, error: 'empty', msg: 'Нужно слово из букв' };
    if (words.length > 2) return { ok: false, error: 'words', msg: 'Подсказка — одно или два слова' };
    if (g.clue.entries.some(e => !e.skipped && U.norm(e.text) === n)) return { ok: false, error: 'dup', msg: 'Такую подсказку уже называли' };
    const own = ownWord(pid);
    if (own && obvious(text, own)) return { ok: false, error: 'obvious', msg: 'Это слишком очевидно!' };
    return { ok: true, text };
  }
  // Слово, которое игрок видит на карточке (classic-шпион — null; undercover-шпион — подстава)
  function ownWord(pid) {
    const g = S.game;
    if (!isSpy(pid)) return g.word;
    return g.mode === 'undercover' ? g.decoy : null;
  }
  function submitClue(pid, text) {
    const g = S.game, c = g.clue;
    cancelKind('turnEnd', 'botClue', 'botThink');
    const entry = { id: pid, round: c.round, text };
    c.entries.push(entry);
    publish({ type: 'clue', entry: Object.assign({}, entry) });
    const p = player(pid);
    if (p && p.isBot) {
      if (!S.memory) S.memory = {};
      const m = S.memory[pid] || (S.memory[pid] = []);
      m.push(text);
      if (m.length > 40) m.splice(0, m.length - 40);
    }
    const read = TP().read;
    c.pauseUntil = read > 0 ? now() + ms(read) : null;
    chatAfterClue(entry);
    nextTurn();
  }
  function skipTurn(pid) {
    const c = S.game.clue;
    cancelKind('turnEnd', 'botClue', 'botThink');
    const entry = { id: pid, round: c.round, text: '', skipped: true };
    c.entries.push(entry);
    publish({ type: 'skip', id: pid, entry: Object.assign({}, entry) });
    nextTurn();
  }
  function postAccuse(fromId, toId, text) {
    const g = S.game;
    const to = player(toId);
    feedPush({ kind: 'accuse', from: fromId, to: toId, text: (text && String(text).trim()) || `Подозреваю: ${to ? to.name : '?'}` });
    publish({ type: 'accuse', from: fromId, to: toId });
    if (g && g.clue) g.accusedBy[fromId] = g.clue.round;
    // обвинённый бот защищается (не чаще раза за круг)
    if (g && g.clue && to && to.isBot && !to.left && g.defended[toId] !== g.clue.round) {
      const r = chatCall(toId, { trigger: 'accused', about: fromId, history: entriesCopy(), feed: botFeed(), round: g.clue.round });
      if (r) { g.defended[toId] = g.clue.round; scheduleChat(toId, r, 'accused', 0); }
    }
  }

  // ---------- реплики ботов (feed kind 'chat') ----------
  // Только настоящий мозг с chat(); запасного нет — бот просто молчит. Реплики с секретным словом/подставой отбрасываются.
  function chatCall(pid, ctx) {
    const rec = brains[pid];
    if (!rec || rec.broken || rec.noChat || !rec.brain || typeof rec.brain.chat !== 'function') return null;
    let res;
    try { res = rec.brain.chat(clone(ctx)); } catch (e) { report(e, 'brain'); rec.noChat = true; return null; }
    if (!res || typeof res.text !== 'string') return null;
    let text = res.text.replace(/[\u0000-\u001f]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!text) return null;
    if (text.length > CHAT_MAX) text = text.slice(0, CHAT_MAX - 1).replace(/\s+\S*$/, '') + '…';
    const g = S.game;
    if (g && [g.word, g.decoy].some(w => w && mentions(text, w))) return null;
    return { text, thinkMs: res.thinkMs };
  }
  function scheduleChat(pid, r, trigger, extra) {
    const d = U.clamp(Number(r.thinkMs) > 0 ? Number(r.thinkMs) : ms(1500), ms(300), ms(9000)) + (extra || 0);
    schedule('botChat', d, { pid, text: r.text, n: S.game.n, trigger });
  }
  const liveBot = id => { const p = player(id); return !!(p && p.isBot && !p.left); };
  function chatAfterClue(entry) {
    const g = S.game;
    if (rnd() >= TP().chat) return;
    const bots = U.shuffle(g.participants.filter(id => id !== entry.id && liveBot(id)), rnd).slice(0, 3);
    for (const id of bots) {
      const r = chatCall(id, { trigger: 'clue', about: entry.id, entry: Object.assign({}, entry), history: entriesCopy(), feed: botFeed(), round: g.clue.round });
      if (r) { scheduleChat(id, r, 'clue', 0); return; }
    }
  }
  function chatAfterReveal() {
    const g = S.game, r = g.result;
    const first = [...r.accused, ...g.spies].filter(liveBot);
    const rest = U.shuffle(g.participants.filter(id => liveBot(id) && !first.includes(id)), rnd);
    const order = [...new Set([...first, ...rest])];
    let k = 0;
    for (const id of order) {
      if (k >= TP().revealChat) break;
      const res = chatCall(id, { trigger: 'reveal', about: null, history: entriesCopy(), feed: botFeed(), round: g.clue ? g.clue.round : 0, result: resultView(id) });
      if (!res) continue;
      scheduleChat(id, res, 'reveal', ms(1500 + k * 2500));
      k++;
    }
  }

  // ---------- голосование ----------
  function cleanPicks(pid, picks) {
    const g = S.game;
    if (!Array.isArray(picks)) return { error: 'Выбери, за кого голосуешь' };
    if (picks.length === 1 && picks[0] === 'nospy') return g.allowNoSpy ? { picks: ['nospy'] } : { error: 'Вариант «шпиона нет» выключен' };
    const u = [...new Set(picks.map(String))];
    if (u.includes('nospy')) return { error: '«Шпиона нет» — отдельный вариант' };
    if (u.includes(pid)) return { error: 'За себя голосовать нельзя' };
    if (u.some(x => !g.participants.includes(x))) return { error: 'Такого игрока нет в партии' };
    if (u.length !== g.need) return { error: g.need === 1 ? 'Выбери одного игрока' : 'Выбери двух игроков' };
    return { picks: u };
  }
  function randomPicks(pid) {
    const g = S.game;
    const others = U.shuffle(g.participants.filter(x => x !== pid), rnd);
    return others.slice(0, g.need);
  }
  function toVote() {
    const g = S.game;
    setPhase('vote');
    g.votes = {}; g.voteOrder = []; g.voteClosing = false;
    const vs = S.settings.voteSeconds;
    g.voteDeadline = vs > 0 ? now() + ms(vs * 1000) : null;
    if (g.voteDeadline != null) schedule('voteEnd', g.voteDeadline - now());
    sys('Голосование: кто шпион?');
    for (const id of g.participants) {
      const p = player(id);
      if (!p || !p.isBot || p.left) continue;
      const arg = { history: entriesCopy(), feed: botFeed(), need: g.need, allowNoSpy: g.allowNoSpy };
      const res = brainCall(id, 'vote', arg, x => x && !cleanPicks(id, x.picks).error);
      const cp = res ? cleanPicks(id, res.picks) : { error: 1 };
      schedule('botVote', botVoteDelay(res && res.thinkMs), { pid: id, picks: cp.picks || randomPicks(id) });
    }
    checkVoteDone();
  }
  // calm/normal: боты голосуют не раньше рамки и вразнобой; fast — как скажет мозг. Не позже чем за 1.5 с до дедлайна.
  function botVoteDelay(v) {
    const g = S.game, b = TP().vote;
    let d = thinkTime(v);
    if (b) d = Math.max(d, ms(b[0] + rnd() * (b[1] - b[0])));
    if (g.voteDeadline != null) d = Math.min(d, Math.max(ms(300), g.voteDeadline - now() - ms(1500)));
    return d;
  }
  function castVote(pid, picks) {
    const g = S.game;
    if (!g.votes[pid]) g.voteOrder.push(pid);
    g.votes[pid] = picks.slice();
    checkVoteDone();
  }
  function checkVoteDone() {
    const g = S.game;
    if (S.phase !== 'vote' || !g || g.voteClosing) return;
    const must = g.participants.map(player).filter(present);
    if (must.every(p => g.votes[p.id])) {
      g.voteClosing = true;
      schedule('voteClose', ms(T.voteGrace));
    }
  }
  function closeVote() {
    const g = S.game;
    const tally = {};
    g.participants.forEach(id => { tally[id] = 0; });
    if (g.allowNoSpy) tally.nospy = 0;
    const votes = [];
    for (const id of g.participants) {
      const v = g.votes[id];
      if (!v) continue;
      votes.push({ from: id, to: v.slice() });
      for (const x of v) if (Object.prototype.hasOwnProperty.call(tally, x)) tally[x]++;
    }
    const cands = g.participants.filter(id => tally[id] > 0).sort((a, b) => tally[b] - tally[a]);
    const maxP = cands.length ? tally[cands[0]] : 0;
    let accused = [], verdict;
    if (g.allowNoSpy && tally.nospy > 0 && tally.nospy > maxP) verdict = 'nospy';
    else {
      const K = g.need;
      if (cands.length <= K) accused = cands.slice();
      else {
        const edge = tally[cands[K - 1]];
        accused = tally[cands[K]] === edge ? cands.filter(id => tally[id] > edge) : cands.slice(0, K);
      }
      verdict = accused.length ? 'accused' : 'none';
    }
    const caught = accused.filter(id => g.spies.includes(id));
    g.result = {
      noSpy: g.spies.length === 0, spies: g.spies.slice(), word: g.word, pack: g.packId, packTitle: g.packTitle,
      mode: g.mode || 'classic', decoy: g.decoy || null,
      accused, caught, tally, votes, verdict,
      guessNeeded: !!(g.mode !== 'undercover' && g.spies.length && caught.length && S.settings.spyGuess),
      guess: null, guesses: [], winner: null, reason: null, deltas: {}, scores: {}, final: false, awards: [],
    };
    outcome(g);
    g.result.final = !g.result.guessNeeded;
    setPhase('reveal');
    const rv = ms(TP().reveal);
    g.phaseUntil = now() + rv;
    schedule('revealEnd', rv);
    chatAfterReveal();
  }
  function outcome(g) {
    const R = g.result, parts = g.participants, spies = g.spies;
    const civ = parts.filter(id => !spies.includes(id));
    const d = {};
    parts.forEach(id => { d[id] = 0; });
    const votesOf = {};
    R.votes.forEach(v => { votesOf[v.from] = v.to; });
    const correct = id => !!votesOf[id] && votesOf[id].some(x => spies.includes(x));
    const guessed = !!(R.guess && R.guess.correct);
    let winner, reason;
    if (!spies.length) {
      if (R.verdict === 'nospy') { parts.forEach(id => { d[id] = 2; }); winner = 'players'; reason = 'noSpyRight'; }
      else { winner = 'draw'; reason = 'noSpyWrong'; }
    } else if (R.caught.length === spies.length) {
      if (guessed) { spies.forEach(id => { d[id] = 3; }); civ.forEach(id => { d[id] = 1; }); winner = 'spies'; reason = 'guessed'; }
      else { civ.forEach(id => { d[id] = 2 + (correct(id) ? 1 : 0); }); winner = 'players'; reason = 'caught'; }
    } else if (R.caught.length === 0) {
      spies.forEach(id => { d[id] = 3; }); civ.forEach(id => { d[id] = correct(id) ? 1 : 0; }); winner = 'spies'; reason = 'escaped';
    } else {
      civ.forEach(id => { d[id] = 1; }); spies.forEach(id => { d[id] = guessed ? 2 : 1; }); winner = 'draw'; reason = 'tie';
    }
    R.winner = winner; R.reason = reason; R.deltas = d;
    R.scores = {};
    S.players.forEach(p => { R.scores[p.id] = (p.score || 0) + (g.applied ? 0 : (d[p.id] || 0)); });
    R.awards = computeAwards(g);
  }
  // Награды партии: 2–3 штуки, детерминированно по голосам, ленте и подсказкам.
  function computeAwards(g) {
    const R = g.result, parts = g.participants, spies = g.spies;
    const entries = g.clue ? g.clue.entries : [];
    const nm = id => { const p = player(id); return p ? p.name : '?'; };
    const vf = id => R.tally[id] || 0;
    const ord = (a, b) => parts.indexOf(a) - parts.indexOf(b);
    const votesWord = n => n + ' ' + U.plural(n, ['голос', 'голоса', 'голосов']);
    const civ = parts.filter(id => !spies.includes(id));
    const cands = [];
    if (spies.length) {
      const s = spies.slice().sort((a, b) => vf(a) - vf(b) || ord(a, b))[0];
      if (g.mode === 'undercover') cands.push({ id: 'undercover', title: 'Подставной до конца', pid: s, text: `Было «${g.decoy}», у всех — «${g.word}»` });
      else if (!R.caught.includes(s)) cands.push({ id: 'disguise', title: 'Мастер маскировки', pid: s, text: vf(s) ? `Всего ${votesWord(vf(s))} против` : 'Ни одного голоса против' });
      const acc = S.feed.filter(f => f.g === g.n && f.kind === 'accuse' && civ.includes(f.from) && spies.includes(f.to)).sort((a, b) => a.id - b.id)[0];
      if (acc) cands.push({ id: 'sherlock', title: 'Шерлок', pid: acc.from, text: `Раньше всех указал(а) на шпиона: ${nm(acc.to)}` });
      else {
        const v = g.voteOrder.find(id => civ.includes(id) && (g.votes[id] || []).some(x => spies.includes(x)));
        if (v) cands.push({ id: 'sherlock', title: 'Шерлок', pid: v, text: 'Первый верный голос в партии' });
      }
    } else {
      const v = g.voteOrder.find(id => (g.votes[id] || [])[0] === 'nospy');
      if (v) cands.push({ id: 'coolhead', title: 'Холодная голова', pid: v, text: 'Первый голос за «шпиона нет»' });
    }
    const top = civ.slice().sort((a, b) => vf(b) - vf(a) || ord(a, b))[0];
    if (top && vf(top) > 0) cands.push({ id: 'target', title: 'Под прицелом', pid: top, text: `${votesWord(vf(top))} — а ведь не шпион` });
    const skips = {};
    entries.forEach(e => { if (e.skipped) skips[e.id] = (skips[e.id] || 0) + 1; });
    const sk = parts.filter(id => skips[id]).sort((a, b) => skips[b] - skips[a] || ord(a, b))[0];
    if (sk) cands.push({ id: 'silent', title: 'Молчун', pid: sk, text: `Пропусков: ${skips[sk]}` });
    const sharp = civ.filter(id => vf(id) === 0 && !skips[id] && entries.some(e => e.id === id && !e.skipped));
    if (sharp.length) cands.push({ id: 'sharp', title: 'Точный ум', pid: sharp[0], text: 'Все подсказки в точку — ни одного голоса против' });
    const firstClue = entries.find(e => !e.skipped);
    if (firstClue) cands.push({ id: 'opener', title: 'Первое слово', pid: firstClue.id, text: `Начал(а) партию с «${firstClue.text}»` });
    const out = [], used = new Set();
    for (const a of cands) { if (out.length < 3 && !used.has(a.pid)) { out.push(a); used.add(a.pid); } }
    for (const a of cands) { if (out.length < 2 && !out.includes(a)) out.push(a); }
    return out;
  }
  function afterReveal() {
    const g = S.game;
    if (g.result.guessNeeded) toGuess(); else toScores();
  }

  // ---------- угадывание ----------
  function toGuess() {
    const g = S.game, r = g.result;
    setPhase('guess');
    const pack = packOf(g.packId);
    const seen = new Set([U.norm(g.word)]);
    const others = [];
    for (const w of pack ? pack.words : []) { const k = U.norm(w && w.w); if (k && !seen.has(k)) { seen.add(k); others.push(w.w); } }
    const options = U.shuffle(U.shuffle(others, rnd).slice(0, 11).concat([g.word]), rnd);
    const dl = now() + ms(T.guess);
    g.guess = { deadline: dl, by: r.caught.slice(), options, done: [], guesses: [], resolved: false };
    g.phaseUntil = dl;
    schedule('guessEnd', dl - now());
    for (const id of g.guess.by) {
      const p = player(id);
      if (!p || !p.isBot) continue;
      const inOpts = w => typeof w === 'string' && options.some(o => U.norm(o) === U.norm(w));
      const res = brainCall(id, 'guess', { options: options.slice(), history: entriesCopy() }, x => x && inOpts(x.word));
      const w = res && inOpts(res.word) ? res.word : U.pick(options, rnd);

    noSpyRight: () => 'Шпиона не было — и вы это поняли!',

  function toScores() {

  // Ушедшие посреди партии (о них уже было событие 'left') убираются из списка молча.
  function enterLobby() {

    S.banned = [];
    S.game = null;

  }

  }

  // ---------- присутствие ----------

    else if (S.phase === 'clues' && g.clue && g.clue.turn === p.id && !p.isBot) {
      const lim = now() + (p.left ? 0 : ms(T.discTurn));
      if (g.clue.deadline == null || g.clue.deadline > lim) {

  function addBots(k) {

    for (const b of list) {

  // Убрать бота: в лобби — совсем; на экране итогов (он участник прошедшей партии) — пометить ушедшим,

    addBot(p) {

      if (!inLobby()) return fail(p, 'Ботов добавляют в лобби', 'phase');

    hero.style.setProperty('--mx', x.toFixed(3)); hero.style.setProperty('--my', y.toFixed(3)); hero.style.setProperty('--sy', String(Math.round(sy)));
    if (Math.abs(tx - x) > 0.002 || Math.abs(ty - y) > 0.002) rid = raf(loop);

  const onOri = e => { if (e.gamma == null || e.beta == null) return; tx = clamp(e.gamma / 28, -1, 1); ty = clamp((e.beta - 50) / 28, -1, 1); kick(); };
  const onScroll = () => { sy = scroller ? Math.min(400, scroller.scrollTop) : 0; kick(); };

  window.addEventListener('deviceorientation', onOri, { passive: true });

function parseCustom(text) {
  const words = [], errors = [], seen = new Set();
  String(text || '').split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    const k = line.indexOf(':');
    const w = (k >= 0 ? line.slice(0, k) : line).trim().replace(/\s+/g, ' ');
    const rest = k >= 0 ? line.slice(k + 1) : '';
    if (!w) { errors.push('Строка ' + (i + 1) + ': нет слова перед двоеточием'); return; }
    if (w.length > 22) { errors.push('Строка ' + (i + 1) + ': «' + w.slice(0, 14) + '…» длиннее 22 букв'); return; }
    if (U.norm(w).length < 2) { errors.push('Строка ' + (i + 1) + ': слишком короткое слово'); return; }
    const key = U.norm(w);
    if (seen.has(key)) { errors.push('Строка ' + (i + 1) + ': «' + w + '» уже есть'); return; }
    seen.add(key);
    const a = rest.split(/[,;]/).map(x => x.trim().toLowerCase().replace(/\s+/g, ' ')).filter(x => x && x.length <= 20 && U.similar(x, w) < 0.85);
    words.push({ w: w[0].toUpperCase() + w.slice(1), a: Array.from(new Set(a)).slice(0, 12) });
  });
  if (words.length > 150) errors.push('Слишком много слов: оставь до 150');
  return { words, errors };
}
