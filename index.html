/* =====================================================================
   4. Мелкие помощники
   ===================================================================== */
function gauss(r) { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
function mix32(a, b) {
  let h = Math.imul((a ^ b) >>> 0, 0x9E3779B1); h ^= h >>> 15; h = Math.imul(h, 0x85EBCA77); h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE3D); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const clip = (v, a, b) => v < a ? a : (v > b ? b : v);
function entropyN(ps) {
  if (ps.length < 2) return 0;
  let h = 0; for (const p of ps) if (p > 1e-12) h -= p * Math.log(p);
  return clip(h / Math.log(ps.length), 0, 1);
}
// То же, что U.similar, но на заранее нормализованных строках и стемах (горячий путь).
// Возвращает точное значение U.similar, если оно может быть ≥ need, иначе 0.
function simFast(x, sx, y, sy, need = MATCH_T) {
  if (!x || !y) return 0;
  if (x === y) return 1;
  if (sx === sy) return 0.95;
  const minL = Math.min(sx.length, sy.length);
  if (minL >= 4 && (sx.startsWith(sy) || sy.startsWith(sx))) return 0.85;
  if (minL >= 5 && (x.includes(sy) || y.includes(sx))) return 0.75;
  const m = Math.max(sx.length, sy.length);
  const sMax = 1 - Math.abs(sx.length - sy.length) / m;     // lev ≥ разницы длин
  if ((sMax > 0.6 ? sMax * 0.8 : sMax * 0.4) < need) return 0;
  const s = 1 - U.lev(sx, sy) / m;
  return s > 0.6 ? s * 0.8 : s * 0.4;
}
function tokensOf(n) {
  let t = n.split(/[\s-]+/).filter(x => x && !STOP.has(x));
  if (!t.length && n) t = [n.replace(/[\s-]+/g, '')];
  return t.slice(0, 3);
}
function parseLetter(n) {
  const m = /^(?:на )?(?:букв[ауы] )?([а-я])$/.exec(n) || /^(?:на|с|со) букв[уы] ([а-я])$/.exec(n);
  if (!m) return null;
  if (n.length === 1) return null;         // одинокая буква — не «буквенная» подсказка
  return m[1];
}
function vagueList() {
  const v = Spy.data && Array.isArray(Spy.data.vague) && Spy.data.vague.length ? Spy.data.vague : VAGUE_FALLBACK;
  return v;
}

/* =====================================================================
   5. Лексикон: все слова и ассоциации набора тем + инвертированный индекс
      (строится один раз на набор тем, общий для всех ботов)
   ===================================================================== */
const LEX_CACHE = new Map();
const PACK_KEY = new WeakMap();
let LIB = null, LIB_SRC = null;     // библиотека слов Spy.data для «заимствования» ассоциаций в своей теме

function packKey(p) {
  let k = PACK_KEY.get(p);
  if (!k) { k = p.id + ':' + p.words.length + ':' + U.hashStr(p.words.map(w => w.w + '/' + ((w.a && w.a.length) || 0)).join('|') + '#' + (p.generic || []).join(',')); PACK_KEY.set(p, k); }
  return k;
}
function library() {
  const src = Spy.data && Spy.data.packs;
  if (!src || !src.length) return null;
  if (LIB && LIB_SRC === src) return LIB;
  const byNorm = new Map(), byStem = new Map();
  for (const p of src) for (const w of p.words || []) {
    if (!w.a || !w.a.length) continue;
    const n = U.norm(w.w);
    if (!byNorm.has(n)) byNorm.set(n, w.a);
    const s = U.stem(n);
    if (!byStem.has(s)) byStem.set(s, w.a);
  }
  LIB = {byNorm, byStem}; LIB_SRC = src;
  return LIB;
}
// Своя тема без ассоциаций: если слово (или его часть) есть в библиотеке — берём ассоциации оттуда
function borrowAssoc(word) {
  const lib = library(); if (!lib) return null;
  const n = U.norm(word);
  const a = lib.byNorm.get(n) || lib.byStem.get(U.stem(n));
  if (a) return a;
  const toks = n.split(/[\s-]+/).filter(t => t.length >= 4);
  if (toks.length < 2) return null;
  for (const t of toks) { const b = lib.byNorm.get(t) || lib.byStem.get(U.stem(t)); if (b) return b.filter(x => simFast(U.norm(x), U.stem(x), t, U.stem(t)) < MATCH_T); }
  return null;
}

function getLex(packs) {
  const key = packs.map(packKey).join(',') + '|' + vagueList().length;
  let L = LEX_CACHE.get(key);
  if (!L) {
    if (LEX_CACHE.size > 12) LEX_CACHE.clear();
    L = buildLex(packs);
    LEX_CACHE.set(key, L);
  }
  return L;
}

function buildLex(packs) {
  const L = {packs, P: packs.length, words: [], keys: [], keyMap: new Map(), bucket: new Map(), wordBucket: new Map(),
    packWords: [], genKeys: [], genSize: [], vagueKeys: [], vagueSize: 1, cache: new Map(), hasAssoc: []};
  const addKey = (text) => {
    const n = U.norm(text); if (!n) return -1;
    let k = L.keyMap.get(n);
    if (k !== undefined) return k;
    k = L.keys.length;
    const s = U.stem(n);
    L.keys.push({n, s, text: String(text).trim().toLowerCase(), post: [], gen: null, vague: false, near: null, toks: null});
    L.keyMap.set(n, k);
    const b = s[0] || n[0];
    let arr = L.bucket.get(b); if (!arr) L.bucket.set(b, arr = []); arr.push(k);
    return k;
  };
  packs.forEach((p, pi) => {
    const pw = []; let any = false;
    for (const w of p.words || []) {
      if (!w || !w.w) continue;
      const j = L.words.length;
      let a = Array.isArray(w.a) ? w.a.filter(x => typeof x === 'string' && x.trim()) : [];
      let borrowed = false;
      if (!a.length) { const b = borrowAssoc(w.w); if (b && b.length) { a = b; borrowed = true; } }
      const n = U.norm(w.w);
      const toks = n.split(/[\s-]+/).filter(Boolean);
      let z = 0; for (let i = 0; i < a.length; i++) z += Math.pow(i + 1, -RANK_EXP);
      const ak = [], ar = [];
      a.forEach((x, i) => {
        const k = addKey(x); if (k < 0) return;
        const post = L.keys[k].post;
        if (post.some(pp => pp.j === j)) return;
        post.push({j, i, r: Math.pow(i + 1, -RANK_EXP) / z});
        ak.push(k); ar.push(i);
      });
      if (ak.length) any = true;
      const word = {w: w.w, n, toks, stoks: toks.map(t => U.stem(t)), p: pi, ak, ar, d: w.d || 2, borrowed, first: n[0] || '', h: U.hashStr(n)};
      L.words.push(word);
      pw.push(j);
      for (const st of word.stoks) { const b = st[0]; if (!b) continue; let arr = L.wordBucket.get(b); if (!arr) L.wordBucket.set(b, arr = []); if (arr[arr.length - 1] !== j) arr.push(j); }
    }
    L.packWords.push(pw);
    L.hasAssoc.push(any);
    const gk = [];
    for (const g of p.generic || []) {
      const k = addKey(g); if (k < 0) continue;
      const key = L.keys[k];
      if (!key.gen) key.gen = [];
      if (!key.gen.includes(pi)) { key.gen.push(pi); gk.push(k); }
    }
    L.genKeys.push(gk);
    L.genSize.push(Math.max(gk.length, 1));
  });
  for (const v of vagueList()) {
    const k = addKey(v); if (k < 0) continue;
    if (!L.keys[k].vague) { L.keys[k].vague = true; L.vagueKeys.push(k); }
  }
  L.vagueSize = Math.max(1, L.vagueKeys.length);
  return L;
}

// Слова-кандидаты, почти совпадающие с токенами подсказки (по similar ≥ NEAR_T)
function nearWords(L, toks) {
  const out = [];
  for (const [t, st] of toks) {
    const b = L.wordBucket.get(st[0]); if (!b) continue;
    for (const j of b) {
      const w = L.words[j];
      for (let q = 0; q < w.toks.length; q++) {
        if (simFast(t, st, w.toks[q], w.stoks[q], NEAR_T) >= NEAR_T) { out.push(j); break; }
      }
    }
  }
  return out;
}

// Разбор произвольной подсказки: какие ключи словаря она «задевает» (по каждому токену)
function lexMatch(L, text) {
  const n = U.norm(text);
  let m = L.cache.get(n);
  if (m) return m;
  const toks = tokensOf(n).map(t => [t, U.stem(t)]);
  const per = [];
  for (const [t, st] of toks) {
    const hits = new Map();
    const ex = L.keyMap.get(t);
    if (ex !== undefined) hits.set(ex, 1);
    const b = L.bucket.get(st[0]);
    if (b) for (const k of b) {
      if (hits.has(k)) continue;
      const key = L.keys[k];
      if (key.s[1] !== st[1] && Math.abs(key.s.length - st.length) > 2) continue;   // быстрый отсев
      const s = simFast(t, st, key.n, key.s);
      if (s >= MATCH_T) hits.set(k, s);
    }
    per.push([...hits]);
  }
  if (toks.length > 1) { const ex = L.keyMap.get(n); if (ex !== undefined) per.push([[ex, 1]]); }
  m = {n, toks, per, near: nearWords(L, toks), letter: parseLetter(n)};
  if (L.cache.size > 5000) L.cache.clear();
  L.cache.set(n, m);
  return m;
}
// Ключ словаря как подсказка-кандидат (точное совпадение, без нечёткого поиска — быстро)
function keyMatch(L, k) {
  const key = L.keys[k];
  if (!key.toks) key.toks = tokensOf(key.n).map(t => [t, U.stem(t)]);
  if (!key.near) key.near = nearWords(L, key.toks);
  return {n: key.n, toks: key.toks, per: [[[k, 1]]], near: key.near, letter: null, key: k};
}

/* =====================================================================
   6. Мозг бота
   ===================================================================== */
function personaOf(name) { return PERSONA_BY.get(name) || PERSONAS[0]; }

function createBrain(bot, env) {
  bot = bot || {}; env = env || {};
  const dName = DIFF[env.difficulty] ? env.difficulty : 'normal';
  const D = DIFF[dName];
  const P = personaOf(bot.persona);
  const T = Object.assign({}, P.t);
  if (bot.traits) for (const k in bot.traits) if (typeof bot.traits[k] === 'number' && isFinite(bot.traits[k])) T[k] = bot.traits[k];
  const name = bot.name || 'Бот';
  const gender = bot.gender || genderOf(name) || 'm';
  const r = typeof env.rng === 'function' ? U.rng(((Math.floor(env.rng() * 4294967296) ^ U.hashStr(name)) >>> 0) || 1) : U.rng(name + '#' + (bot.face || 0));
  const seedH = (Math.floor(r() * 4294967296) ^ U.hashStr(name + '/' + (bot.persona || ''))) >>> 0;
  const speed = env.speed > 0 ? env.speed : 1;
  let selfId = bot.id != null ? bot.id : (env.me != null ? env.me : (env.selfId != null ? env.selfId : null));
  let games = 0;
  let G = null;

  const findSelf = () => {
    if (selfId == null) { const p = (env.players || []).find(p => p && p.isBot && p.name === name); if (p) selfId = p.id; }
    return selfId;
  };
  const note = s => { if (G) { G.notes.push(s); if (G.notes.length > 40) G.notes.shift(); } };
  const nameOf = id => { const p = (env.players || []).find(p => p && p.id === id); return p ? p.name : String(id); };

  /* ---------- знания бота ----------
     Асимметрия: зная слово, ассоциацию легко ПРОВЕРИТЬ («коробка» — ну конечно, пицца);
     не зная слова, по тонкой ассоциации трудно ДОГАДАТЬСЯ (коробка — от чего угодно).
     fwd — проверка знающим, rev — догадка шпиона (падает с «тонкостью» ассоциации). */
  const kFwd = i => clip(D.know - D.decay * i, 0.3, 0.995);
  const kRev = (i, d) => clip(d.rev0 - d.revDecay * i, 0.05, 0.98);
  const hashJI = (j, i, salt) => mix32(seedH ^ G.L.words[j].h ^ salt, (i + 1) * 0x27d4eb2d);
  function knowsFwd(j, i) {
    let k = kFwd(i);
    if (j === G.jStar) k = 1 - (1 - k) * 0.4;      // своё слово мирный знает лучше
    return hashJI(j, i, 0) < k;
  }
  const knowsRev = (j, i) => hashJI(j, i, 0x5bd1e995) < kRev(i, D);
  const recogFwd = i => clip(0.97 - 0.02 * i, 0.5, 1);   // «типичный знающий узнает ассоциацию ранга i»
  // Вес совпадения (j, i) в модели бота: шпион — по своей «догадливости» (знает связь или нет);
  // мирный моделирует шпиона смесью «понял связь (вероятность kc) / не понял» — см. ev.kc в updateQ/postAfter
  const revWeight = (j, i) => G.role === 'spy' ? (knowsRev(j, i) ? 1 : 0) : 1;

  /* ---------- оценка подсказки ---------- */
  function evalMatch(m) {
    const cacheKey = m.key != null ? '#' + m.key : m.n;
    let ev = G.evCache.get(cacheKey);
    if (ev) return ev;
    const L = G.L;
    const A = new Map();
    let Aself = 0;
    const g = new Float64Array(L.P);
    let v = 0;
    let kcSelf = -1, kcAny = -1;
    const Ap = new Map();      // «мог бы так сказать шпион»: шпион называет ассоциацию, только если сам знает связь (тонкие — редко)
    for (const hits of m.per) {
      const best = new Map(), bestP = new Map();
      let bself = 0;
      const gb = new Float64Array(L.P);
      let vb = 0;
      for (const [k, s] of hits) {
        const key = L.keys[k];
        for (const pp of key.post) {
          const vp = pp.r * s * kRev(pp.i, DIFF.normal);
          if (vp > (bestP.get(pp.j) || 0)) bestP.set(pp.j, vp);
          // проверка «подходит ли к моему слову» — ожидаемая (знающий почти всегда видит связь, даже если сам бы не придумал)
          if (pp.j === G.jStar) {
            const v = pp.r * s * (1 - (1 - kFwd(pp.i)) * 0.4); if (v > bself) bself = v;
            kcSelf = Math.max(kcSelf, kRev(pp.i, DIFF.normal));
          } else if (G.candPos[pp.j] >= 0) kcAny = Math.max(kcAny, kRev(pp.i, DIFF.normal));
          const wgt = revWeight(pp.j, pp.i);
          if (!wgt) continue;
          const val = pp.r * s * wgt;
          if (val > (best.get(pp.j) || 0)) best.set(pp.j, val);
        }
        if (key.gen) for (const p of key.gen) if (s > gb[p]) gb[p] = s;
        if (key.vague && s > vb) vb = s;
      }
      for (const [j, val] of best) A.set(j, (A.get(j) || 0) + val);
      for (const [j, val] of bestP) Ap.set(j, (Ap.get(j) || 0) + val);
      Aself += bself;
      for (let p = 0; p < L.P; p++) if (gb[p]) g[p] += gb[p] / L.genSize[p];
      v += vb / L.vagueSize;
    }
    // Ложная память шпиона: подсказка «напоминает» пару случайных слов темы («кошка… может, Оцелот?»).
    // Детерминированно от (бот, подсказка); generic/vague не трогаем — они ни на что конкретное не похожи.
    if (G.role === 'spy' && D.falseLinks > 0 && m.key == null && G.cand.length > 3) {
      const isGV = g.some(x => x > 0) || v > 0;
      if (!isGV) {
        // путает с правдоподобными словами: если кандидатов много (тема неизвестна) — среди ~50 самых вероятных
        let pool = G.cand;
        if (pool.length > 60) pool = topIdx(G.q, 50).map(ci => G.cand[ci]);
        const h0 = U.hashStr(m.n);
        for (let f = 0; f < D.falseLinks; f++) {
          const j = pool[Math.floor(mix32(seedH ^ h0, 0x51ed + f * 7919) * pool.length)];
          A.set(j, (A.get(j) || 0) + D.falseW);
        }
      }
    }
    // kc — шанс, что «типичный шпион» вообще поймёт, к чему эта ассоциация (тонкие — редко); для generic/vague = 1
    const kc = G.role === 'spy' ? 1 : (kcSelf >= 0 ? kcSelf : (kcAny >= 0 ? kcAny : 1));
    ev = {m, A, Ap, Aself, g, v, kc, near: new Set(m.near), letter: m.letter};
    if (G.evCache.size > 3000) G.evCache.clear();
    G.evCache.set(cacheKey, ev);
    return ev;
  }
  const evalText = text => evalMatch(lexMatch(G.L, text));
  const evalKey = k => evalMatch(keyMatch(G.L, k));

  // P(подсказка | игрок знает слово j). bm — «израсходованная» доля ассоциаций слова (уже названы другими):
  // когда ассоциации кончаются, знающий вынужден говорить generic/vague — это не улика.
  // fwd=true — «как проверит знающий» (для своего слова мирного), иначе — модель догадки шпиона.
  function Pk(ev, j, bm, fwd) {
    const w = G.L.words[j];
    const ci = G.candPos[j];
    const b = ci >= 0 ? (bm || G.bm)[ci] : 0;
    const a = fwd && j === G.jStar ? ev.Aself : (ev.A.get(j) || 0);
    let p = MK.A * a + (MK.G + FLOW_G * MK.A * b) * ev.g[w.p] + (MK.V + FLOW_V * MK.A * b) * ev.v + (MK.O + (1 - FLOW_G - FLOW_V) * MK.A * b) * EPS;
    if (ev.letter) p += w.first === ev.letter ? LETTER_P : LETTER_P * 0.02;
    if (ev.near.has(j)) p *= 0.15;            // мирным нельзя называть само слово — почти невозможно
    return p;
  }
  // Σ q·bm — сколько ассоциаций «израсходовано» с точки зрения распределения q
  function blockedMass(q, bm) { let s = 0; for (let i = 0; i < q.length; i++) s += q[i] * bm[i]; return s; }
  // P(подсказка | шпион без слова); шпион «целится» в смесь η·q + (1−η)·равномерно
  function Pspy(ev, q, pm, eta, Bq) {
    const cand = G.cand, n = cand.length || 1;
    let aq = 0, au = 0;
    for (const [j, s] of ev.Ap) { const ci = G.candPos[j]; if (ci < 0) continue; aq += q[ci] * s; au += s; }
    au /= n;
    let gq = 0, gu = 0;
    for (let p = 0; p < G.L.P; p++) if (ev.g[p]) { gq += pm[p] * ev.g[p]; gu += G.pu[p] * ev.g[p]; }
    const B = eta * (Bq == null ? (q === G.q ? G.Bq : blockedMass(q, G.bm)) : Bq) + (1 - eta) * G.Bu;
    let res = MS.A * (eta * aq + (1 - eta) * au) + (MS.G + FLOW_G * MS.A * B) * (eta * gq + (1 - eta) * gu) + (MS.V + FLOW_V * MS.A * B) * ev.v + MS.O * EPS;
    if (ev.letter) {
      let lm = 0; for (let i = 0; i < cand.length; i++) if (G.L.words[cand[i]].first === ev.letter) lm += eta * q[i] + (1 - eta) / n;
      res += LETTER_P * (0.02 + 0.5 * lm);
    }
    return res;
  }
  const llrOf = (ev, j, lps, bm, fwd) => clip(Math.log(Pk(ev, j, bm, fwd)) - lps, LLR_LO, LLR_HI);
  function packMass(q) {
    const pm = new Float64Array(G.L.P);
    for (let i = 0; i < q.length; i++) pm[G.L.words[G.cand[i]].p] += q[i];
    return pm;
  }
  // Байесовское обновление апостериора q по подсказке (устойчивое: ρ — шанс, что говорил шпион/ошибка)
  function updateQ(ev, rho, lam) {
    const q = G.q, n = q.length; if (!n) return;
    if (ev.kc < 1) { if (!G.qPrev || G.qPrev.length !== n) G.qPrev = new Float64Array(n); G.qPrev.set(q); }
    const ps = Pspy(ev, q, G.pm, 1);
    let z = 0;
    for (let i = 0; i < n; i++) { const l = (1 - rho) * Pk(ev, G.cand[i]) + rho * ps; q[i] *= lam === 1 ? l : Math.pow(l, lam); z += q[i]; }
    if (!(z > 0)) { q.fill(1 / n); z = 1; }
    const floor = 1e-7 / n;
    let z2 = 0;
    for (let i = 0; i < n; i++) { q[i] = Math.max(q[i] / z, floor); z2 += q[i]; }
    for (let i = 0; i < n; i++) q[i] /= z2;
    if (ev.kc < 1 && G.qPrev) {        // модель мирного: шпион понял связь с вероятностью kc, иначе ничего не узнал
      for (let i = 0; i < n; i++) q[i] = ev.kc * q[i] + (1 - ev.kc) * G.qPrev[i];
    }
    G.pm = packMass(q);
    G.Bq = blockedMass(q, G.bm);
  }
  // Подсказка прозвучала: похожие ключи больше нельзя повторять, у слов «расходуются» ассоциации
  function block(m) {
    let changed = false;
    for (const hits of m.per) for (const [k] of hits) {
      if (G.blocked.has(k)) continue;
      G.blocked.add(k);
      for (const pp of G.L.keys[k].post) {
        const ci = G.candPos[pp.j];
        if (ci < 0) continue;
        const wgt = pp.j === G.jStar ? (knowsFwd(pp.j, pp.i) ? 1 : 0) : revWeight(pp.j, pp.i);
        if (!wgt) continue;
        if (!G.bm[ci]) G.bmList.push(ci);
        G.bm[ci] = Math.min(1, G.bm[ci] + pp.r * wgt); changed = true;
      }
    }
    if (changed) {
      G.Bq = blockedMass(G.q, G.bm);
      let s = 0; for (let i = 0; i < G.bm.length; i++) s += G.bm[i];
      G.Bu = G.bm.length ? s / G.bm.length : 0;
    }
  }
  // Ожидаемое (по весам w) лог-отношение «знает слово / шпион» для подсказки — как её увидят мирные.
  // lps — log P(подсказка | шпион) на момент подсказки (если не задан — считается сейчас), bm — снимок «расхода».
  function expLLR(ev, w, wpm, lps, bm) {
    if (lps == null) lps = Math.log(Pspy(ev, G.q, G.pm, D.eta));
    bm = bm || G.bm;
    const L = G.L;
    let e = 0, e2 = 0;
    if (ev.letter || w.length <= 64) {
      for (let i = 0; i < w.length; i++) { if (w[i] < 1e-9) continue; const x = llrOf(ev, G.cand[i], lps, bm); e += w[i] * x; e2 += w[i] * x * x; }
    } else {
      // разреженно: отдельно — слова с совпадениями и с «расходом», остальные — одним числом на тему
      const rest = Float64Array.from(wpm);
      const done = new Set();
      const visit = ci => {
        if (ci < 0 || done.has(ci)) return;
        done.add(ci);
        const x = llrOf(ev, G.cand[ci], lps, bm);
        e += w[ci] * x; e2 += w[ci] * x * x; rest[L.words[G.cand[ci]].p] -= w[ci];
      };
      for (const j of ev.near) visit(G.candPos[j]);
      for (const j of ev.A.keys()) visit(G.candPos[j]);
      let gv = ev.v > 0;
      for (let p = 0; p < L.P && !gv; p++) if (ev.g[p] > 0) gv = true;
      if (gv) for (const ci of G.bmList) visit(ci);
      for (let p = 0; p < L.P; p++) {
        if (rest[p] <= 1e-12) continue;
        const x = clip(Math.log(MK.G * ev.g[p] + MK.V * ev.v + MK.O * EPS) - lps, LLR_LO, LLR_HI);
        e += rest[p] * x; e2 += rest[p] * x * x;
      }
    }
    return {mean: e, std: Math.sqrt(Math.max(0, e2 - e * e))};
  }
  // Апостериор «слушателя-шпиона» на слово после подсказки (для оценки риска мирного «выдать слово»)
  function postAfter(ev, ci) {
    const q = G.q, n = q.length;
    const ps = Pspy(ev, q, G.pm, 1);
    let z = 0, t = 0;
    for (let i = 0; i < n; i++) { const v = q[i] * ((1 - G.rhoPub) * Pk(ev, G.cand[i]) + G.rhoPub * ps); z += v; if (i === ci) t = v; }
    return z > 0 ? t / z : 0;
  }
  // Риск «выдать слово»: насколько вырастет уверенность шпиона (в лог-шансах) × шанс, что он вообще поймёт связь.
  // Лог-шансы, а не вероятность: даже «добивающая» подсказка заметно укрепляет догадку шпиона.
  const logit = p => { const x = clip(p, 1e-4, 1 - 1e-4); return Math.log(x / (1 - x)); };
  function leakOf(ev, ci) {
    const q0 = G.q[ci];
    const full = postAfter(ev, ci);
    return ev.kc * Math.max(0, logit(full) - logit(q0));
  }

  /* ---------- игроки, события ---------- */
  function rec(id) {
    let p = G.pl.get(id);
    if (!p) {
      p = {id, Epos: 0, Eneg: 0, Pneg: 0, n: 0, skips: 0, imit: 0, worst: null, gut: gauss(r) * D.gut * (0.4 + T.noise), clues: [], ents: []};
      G.pl.set(id, p);
    }
    return p;
  }
  const addE = (p, v) => { if (v >= 0) p.Epos += v; else p.Eneg += v; };
  const addP = (p, v) => { p.Pneg += v; };

  function ingest(e) {
    if (!G || !e || e.id == null) return;
    const cnt = G.cnt.get(e.id) || 0;
    const round = e.round != null ? e.round : cnt + 1;
    const key = e.id + '|' + round;
    if (G.seen.has(key)) return;
    G.seen.add(key);
    G.cnt.set(e.id, cnt + 1);
    if (round > G.maxRound) G.maxRound = round;
    const isMe = e.id === selfId;
    const text = e.skipped ? '' : String(e.text == null ? '' : e.text).trim();
    G.entries.push({id: e.id, round, text, skipped: !text});
    if (!text) {
      if (!isMe) { const p = rec(e.id); p.skips++; addE(p, SKIP_LLR); }
      return;
    }
    const m = lexMatch(G.L, text);
    const ev = evalMatch(m);
    if (isMe) {
      G.said.push({id: e.id, toks: m.toks});
      if (G.role === 'word') updateQ(ev, G.rhoPub, DIFF.normal.lam);
      G.saidNorm.add(m.n); block(m);
      return;
    }
    const p = rec(e.id);
    p.n++; p.clues.push(text);
    // подражание: подсказка почти повторяет чужую
    let imit = 0;
    for (const s of G.said) {
      if (s.id === e.id) continue;
      for (const [a, sa] of m.toks) for (const [b, sb] of s.toks) { const v = simFast(a, sa, b, sb); if (v > imit) imit = v; }
    }
    G.said.push({id: e.id, toks: m.toks});
    if (imit >= MATCH_T) { p.imit++; addE(p, IMIT_LLR * imit); addP(p, IMIT_LLR * imit); }
    // оценка — на состоянии ДО этой подсказки
    const lps = Math.log(Pspy(ev, G.q, G.pm, D.eta));
    if (G.role === 'word') {
      const llr = G.jStar >= 0 ? llrOf(ev, G.jStar, lps, null, true) : 0;
      addE(p, llr);
      if (!p.worst || llr < p.worst.v) p.worst = {text, v: llr};
      updateQ(ev, G.rhoPub, DIFF.normal.lam);
    } else {
      // шпион запоминает, как подсказку увидят мирные; пересчитывает по свежему апостериору при голосовании
      p.ents.push({ev, lps, bm: Float32Array.from(G.bm), text});
      if (!G.fellows.has(e.id)) {
        updateQ(ev, G.rhoSpy, D.lam);
        G.lastEv.push(ev); if (G.lastEv.length > 2) G.lastEv.shift();
      }
    }
    G.saidNorm.add(m.n); block(m);
  }
  // Шпион: как мирные (знающие слово) видят подсказки игрока — по текущему апостериору
  function pubEvidence(p) {
    let pos = 0, neg = 0, worst = null;
    for (const en of p.ents) {
      const x = expLLR(en.ev, G.q, G.pm, en.lps, en.bm).mean;
      if (x >= 0) pos += x; else neg += x;
      if (!worst || x < worst.v) worst = {text: en.text, v: x};
    }
    const extra = SKIP_LLR * p.skips + p.Pneg;      // пропуски и подражание
    return {pos, neg: neg + extra, worst};
  }
  function ingestAccuse(from, to) {
    if (!G || from == null || to == null || from === to) return;
    const k = from + '>' + to;
    if (G.accSeen.has(k)) return;
    G.accSeen.add(k);
    let s = G.accusers.get(to); if (!s) G.accusers.set(to, s = new Set());
    s.add(from);
    if (to === selfId) G.accusedMe.add(from);
  }
  function sync(ctx) {
    if (!G || !ctx) return;
    if (Array.isArray(ctx.history)) for (const e of ctx.history) ingest(e);
    if (Array.isArray(ctx.feed)) for (const f of ctx.feed) if (f && f.kind === 'accuse') ingestAccuse(f.from, f.to);
  }
  // Кто реально участвует в партии (есть в истории) — за наблюдателей не голосуем
  function others() {
    const ids = [];
    const inHist = new Set(G.entries.map(e => e.id));
    for (const p of env.players || []) if (p && p.id !== selfId && (inHist.has(p.id) || !inHist.size)) ids.push(p.id);
    for (const id of inHist) if (id !== selfId && !ids.includes(id)) ids.push(id);
    return ids;
  }

  /* ---------- подозрения ---------- */
  // Мирный: свои оценки. Шпион (pub=true): как, по его мнению, видят игроков мирные.
  function suspicion(pub) {
    const ids = others();
    const negW = 0.7 + 0.6 * T.suspicion;
    const wE = D.evid * (0.75 + 0.5 * T.confidence);
    const evid = ids.map(id => {
      const p = rec(id);
      if (pub) { const pe = pubEvidence(p); p.worstPub = pe.worst; return {pos: pe.pos, neg: pe.neg}; }
      return {pos: p.Epos, neg: p.Eneg};
    });
    const s0 = ids.map((id, i) => -wE * (evid[i].pos + evid[i].neg * negW) + (pub ? 0.5 : 1) * rec(id).gut);
    G.lastEvid = new Map(ids.map((id, i) => [id, +(evid[i].pos + evid[i].neg).toFixed(2)]));
    const K = G.K;
    const sm = U.softmax(s0, 1);
    const pS0 = new Map(ids.map((id, i) => [id, Math.min(0.99, K * sm[i])]));
    const hW = 0.2 + 1.1 * (pub ? 0.6 : T.herd);
    const S = ids.map((id, i) => {
      let h = 0;
      const acc = G.accusers.get(id);
      if (acc) for (const a of acc) {
        if (a === selfId) continue;
        const cred = a === selfId ? 1 : clip(1 - (pS0.get(a) ?? K / Math.max(1, ids.length)), 0.15, 1);
        h += cred * hW;
      }
      h = Math.min(h, 3 * hW);
      let ret = 0;
      if (!pub && G.role === 'word' && G.accusedMe.has(id)) ret = 0.4 + 0.6 * T.suspicion;
      return s0[i] + h + ret;
    });
    return {ids, S};
  }
  function suspicionMap(pub) {
    const {ids, S} = suspicion(pub);
    const sm = U.softmax(S, 1);
    const out = {};
    ids.forEach((id, i) => { out[id] = +Math.min(0.99, G.K * sm[i]).toFixed(3); });
    return out;
  }

  /* ---------- время «на подумать» ---------- */
  function think(base, spread, H) {
    const raw = T.pace * (base + spread * H + r() * 700) * (G ? G.fatigue : 1);
    return Math.round(clip(raw, 900, 4500) / speed);
  }

  /* ---------- текст подсказки: без повторов и не слишком близко к слову ---------- */
  // Не слишком ли близко к секретному слову (движок отклонит «Это слишком очевидно!»); с запасом
  function closeText(n, toks) {
    if (!G.wordToks) return false;
    for (const [t, st] of toks) for (const [a, sa] of G.wordToks) {
      if (simFast(t, st, a, sa, 0.6) >= 0.6) return true;
      if (sa.length >= 4 && t.includes(sa)) return true;
      if (st.length >= 4 && a.includes(st)) return true;
      if (a.length >= 3 && sa.length >= 3 && t.startsWith(sa) && t.length <= sa.length + 4) return true;   // как в движке
    }
    return U.similar(n, G.word) >= 0.6 || n.replace(/[\s-]/g, '') === G.word.replace(/[\s-]/g, '');
  }
  function closeToWord(k) {
    let v = G.closeCache.get(k);
    if (v !== undefined) return v;
    const key = G.L.keys[k];
    if (!key.toks) key.toks = tokensOf(key.n).map(t => [t, U.stem(t)]);
    v = closeText(key.n, key.toks);
    G.closeCache.set(k, v);
    return v;
  }
  const okShape = text => text.length <= 28 && U.norm(text).split(' ').filter(Boolean).length <= 2;
  const usable = k => !G.blocked.has(k) && !G.saidNorm.has(G.L.keys[k].n) && okShape(G.L.keys[k].text) && !closeToWord(k);
  function fallbackText() {
    const vv = U.shuffle(vagueList(), r);
    const fine = t => { const n = U.norm(t); return n && !G.saidNorm.has(n) && okShape(t) && !closeText(n, tokensOf(n).map(x => [x, U.stem(x)])); };
    for (const v of vv) if (fine(v)) return v;
    for (let i = 0; i < 80; i++) {
      const t = vv[i % vv.length] + ' ' + vv[(i * 7 + 3) % vv.length];
      if (fine(t)) return t;
    }
    return 'что-то знакомое';
  }

  /* ---------- подсказка мирного ---------- */
  function wordClue(ctx) {
    const L = G.L;
    const round = ctx.round || G.maxRound;
    const ci = G.jStar >= 0 ? G.candPos[G.jStar] : -1;
    const w = G.jStar >= 0 ? L.words[G.jStar] : null;
    const cands = [];
    if (w) {
      for (let t = 0; t < w.ak.length; t++) { const i = w.ar[t]; if (knowsFwd(G.jStar, i)) cands.push({k: w.ak[t], kind: 'a', rank: i}); }
      for (const k of L.genKeys[w.p] || []) cands.push({k, kind: 'g'});
    }
    for (const k of U.shuffle(L.vagueKeys, r).slice(0, 5)) cands.push({k, kind: 'v'});   // «вода» — пара вариантов, а не 40
    const list = [];
    const seen = new Set();
    for (const c of cands) { if (seen.has(c.k) || !usable(c.k)) continue; seen.add(c.k); c.text = L.keys[c.k].text; list.push(c); }
    // своя тема без ассоциаций: «на букву …» как редкий ход со 2-го круга
    if (w && !w.ak.length && round >= 2 && w.first && /[а-я]/.test(w.first)) {
      const t = 'буква ' + w.first.toUpperCase();
      if (!G.saidNorm.has(U.norm(t))) list.push({kind: 'l', text: t});
    }
    if (!list.length) return {text: fallbackText(), H: 0.5};

    const accused = G.accusedMe.size > 0;
    // доказать своим (уверенные — сильнее), не выдать шпиону (осторожные — сильнее)
    // уже доказал своим, что знаешь слово, — дальше важнее не подсказать шпиону (убывающая отдача)
    const aP = (0.6 + 0.7 * T.confidence) * (round >= 2 ? 1.25 : 1) * (accused ? 1.3 : 1) / (1 + D.proofDecay * clip(0.4 + 0.1 * G.nPl, 0.7, 1.6) * G.myProof);
    // чем больше игроков, тем больше подсказок услышит шпион — каждому нужно быть осторожнее
    const crowd = clip(0.4 + 0.1 * G.nPl, 0.7, 1.6);
    const aL = D.leak * crowd * (0.3 + 1.2 * T.caution) * (round >= 2 ? 0.85 : 1) * (accused ? 0.75 : 1);
    // вкус: осторожные любят тонкие и «общие на несколько слов» ассоциации, болтливые — самые очевидные
    const style = T.caution - 0.5;
    const lpsCache = new Map();
    const util = list.map(c => {
      const ev = c.kind === 'l' ? evalText(c.text) : evalKey(c.k);
      let lps = lpsCache.get(ev); if (lps === undefined) { lps = Math.log(Pspy(ev, G.q, G.pm, D.eta)); lpsCache.set(ev, lps); }
      const llr = G.jStar >= 0 ? llrOf(ev, G.jStar, lps, null, true) : 0;
      const proof = (c.kind === 'a' ? recogFwd(c.rank) : 1) * llr;              // поймут ли свои
      const leak = ci >= 0 ? leakOf(ev, ci) : 0;               // насколько догадается шпион
      let taste = 0;
      if (c.kind === 'a') {
        let share = 0; for (const pp of L.keys[c.k].post) if (L.words[pp.j].p === w.p) share++;
        taste = style * (0.22 * (c.rank - 4) + 0.5 * Math.log(share));
      } else if (c.kind === 'g') taste = style * 1.2;
      else if (c.kind === 'v') taste = style * 1.2 - 0.4;       // «вода» — запасной вариант, generic всегда приятнее
      c.proof = proof; c.leak = leak;
      return aP * proof - aL * leak + taste - (c.kind === 'l' ? 2.0 : 0) + gauss(r) * 0.15 * T.noise;
    });
    const temp = 0.45 * D.temp * (0.6 + T.noise) * G.fatigue * (round >= 3 ? 1.1 : 1);
    const probs = U.softmax(util, temp);
    let choice = U.weightedPick(list, probs, r);
    // человеческие ошибки (Новичок чаще): случайная из своих или «перепутал» с соседним словом
    const slip = T.slip * D.mist;
    if (r() < slip) {
      if (r() < 0.3 && w) {
        const alt = confusedClue(w);
        if (alt) { choice = alt; note('Ошибка: перепутал(а) с соседним словом → «' + alt.text + '»'); }
      } else {
        const nv = list.filter(c => c.kind !== 'v');
        choice = U.pick(nv.length ? nv : list, r); note('Ошибка: подсказка наугад');
      }
    }
    G.myProof += Math.max(0, choice.proof ?? 0);
    note(`Подсказка «${choice.text}»: доказ. ${(choice.proof ?? 0).toFixed(2)}, риск ${(choice.leak ?? 0).toFixed(2)}`);
    return {text: choice.text, H: entropyN(probs)};
  }
  // «Перепутал»: ассоциация соседнего слова (делит с моим словом хотя бы одну ассоциацию)
  function confusedClue(w) {
    const L = G.L;
    const mine = new Set(w.ak);
    const nb = new Set();
    for (const k of w.ak) for (const pp of L.keys[k].post) if (pp.j !== G.jStar && L.words[pp.j].p === w.p) nb.add(pp.j);
    const arr = U.shuffle([...nb], r);
    for (const j of arr) for (const k of L.words[j].ak) if (!mine.has(k) && usable(k)) return {k, kind: 'x', text: L.keys[k].text};
    return null;
  }

  /* ---------- подсказка шпиона ---------- */
  function topIdx(q, m) {
    const idx = Array.from(q.keys());
    idx.sort((a, b) => q[b] - q[a]);
    return idx.slice(0, Math.min(m, idx.length));
  }
  function lastPosterior() {
    if (!G.lastEv.length || !G.q.length) return null;
    const n = G.q.length;
    const ql = new Float64Array(n).fill(1 / n);
    for (const ev of G.lastEv) {
      const ps = Pspy(ev, ql, packMass(ql), 1);
      let z = 0;
      for (let i = 0; i < n; i++) { ql[i] *= (1 - G.rhoSpy) * Pk(ev, G.cand[i]) + G.rhoSpy * ps; z += ql[i]; }
      for (let i = 0; i < n; i++) ql[i] /= z || 1;
    }
    return ql;
  }
  function spyClue(ctx) {
    const L = G.L;
    const round = ctx.round || G.maxRound;

// ---------------------------------------------------------------- размеры и нарезка

}

}

  for (let i = 0; i < s.length;) {
    const [w, k] = escCost(s, i);
    if (n + w > max && i > start) { out.push(s.slice(start, i)); start = i; n = 0; }
    n += w; i += k;
  }
  out.push(s.slice(start));

}

// ---------------------------------------------------------------- общий «канал» драйвера
// impl = {send(frame), close()}. Драйвер зовёт _data(frame) / _ended(); ядро — attach(onData, onClose).
// Локальный close() не вызывает onClose (ядро знает, что закрыло само).
function makeConn(impl) {

  const c = {
    open: true, ended: false, closedLocal: false,
    send(f) { if (!c.open) return false; impl.send(f); return true; },
    close() { if (c.closedLocal || c.ended) return; c.closedLocal = true; c.open = false; buf = []; try { impl.close(); } catch (e) { } },
    attach(d, cl) { onData = d; onClose = cl; const b = buf; buf = []; for (const f of b) d(f); if (c.ended) cl(); },
    _data(f) { if (c.ended || c.closedLocal) return; if (onData) onData(f); else buf.push(f); },
    _ended() { if (c.ended || c.closedLocal) return; c.ended = true; c.open = false; if (onClose) onClose(); },
  };
  return c;
}

// ---------------------------------------------------------------- глобальные хуки страницы (ставятся лениво)
const LIVE = new Set();       // экземпляры с активной сессией
const PAGEHIDE = new Set();   // функции, которые надо дёрнуть при уходе со страницы
let hooked = false;
function hookPage() {
  if (hooked) return; hooked = true;
  const w = G.window, d = G.document;
  if (!w || typeof w.addEventListener !== 'function') return;
  const fire = why => { for (const n of [...LIVE]) { try { n._wake(why); } catch (e) { console.error('[net] wake:', e); } } };
  if (d && typeof d.addEventListener === 'function') {
    d.addEventListener('visibilitychange', () => { if (d.visibilityState === 'visible') fire('visible'); });
    d.addEventListener('resume', () => fire('resume'));
  }
  w.addEventListener('online', () => fire('online'));
  w.addEventListener('pageshow', e => { if (e && e.persisted) fire('pageshow'); });
  // уход со страницы (закрытие вкладки, перезагрузка): Chrome не всегда успевает закрыть data channel «вежливо»,
  // поэтому сами говорим «away» — собеседник сразу считает линк потерянным (клиент — переподключается, не сдаётся)
  w.addEventListener('pagehide', () => {
    for (const n of [...LIVE]) { try { n._away(); } catch (e) { } }
    for (const fn of [...PAGEHIDE]) { try { fn(); } catch (e) { } }

// ================================================================= memory: in-process шина

  reset() { for (const p of BUS.pairs) p.killed = p.closed = true; BUS.pairs.clear(); BUS.hosts.clear(); BUS.off.clear(); },
  // «выдернуть сеть»: кадры узла молча теряются, новые соединения не устанавливаются (обрыв без события close)
  offline(net, on = true) { const n = nodeOf(net); if (on) BUS.off.add(n); else BUS.off.delete(n); },
  // резкий обрыв всех соединений узла (обе стороны получают close)

  hosts() { return [...BUS.hosts.keys()]; },
  links() { return BUS.pairs.size; },

  const pair = {na, nb, closed: false, killed: false, a: null, b: null};
  const blocked = () => BUS.off.has(na) || BUS.off.has(nb);
  const side = other => ({
    send(f) {
      if (pair.closed || blocked()) return;
      const copy = JSON.parse(JSON.stringify(f));   // как настоящая сериализация
      micro(() => { if (!pair.killed) other()._data(copy); });
    },
    close() {
      if (pair.closed) return; pair.closed = true; BUS.pairs.delete(pair);
      const o = other(); micro(() => { if (!pair.killed) o._ended(); });
    },
  });
  pair.a = makeConn(side(() => pair.b));
  pair.b = makeConn(side(() => pair.a));
  pair.kill = () => {
    if (pair.killed) return; pair.killed = pair.closed = true; BUS.pairs.delete(pair);
    micro(() => { pair.a._ended(); pair.b._ended(); });
  };

  return {
    name: 'memory', maxFrame: 0,
    available: () => true,
    listen(addr, h) {
      return new Promise((res, rej) => micro(() => {
        const cur = BUS.hosts.get(addr);
        if (cur && !cur.closed) return rej(netError('taken'));

        const entry = {node, onConn: h.onConn, closed: false};

// ================================================================= local: BroadcastChannel (вкладки одного браузера)
function localDriver(ctx) {
  const {clock, T} = ctx;
  const BC = () => ctx.env.BroadcastChannel || G.BroadcastChannel;
  const open = new Set();   // клиентские каналы этого экземпляра
  return {
    name: 'local', maxFrame: 0,
    available: () => typeof BC() === 'function',
    listen(addr, h) {

        const finAll = () => { for (const [cid, x] of conns) post({k: 'fin', f: me, to: cid, n: x.n}); };
        const L = {
          name: 'local', up: true, wake() { },
          close() { if (phase === 'closed') return; phase = 'closed'; finAll(); for (const x of conns.values()) x.conn._ended(); conns.clear(); PAGEHIDE.delete(finAll); clock.clearTimeout(probeT); try { ch.close(); } catch (e) { } },
        };

            if ((m.k === 'here' && m.to === me) || (m.k === 'probe' && m.f < me)) { phase = 'closed'; clock.clearTimeout(probeT); try { ch.close(); } catch (e) { } rej(netError('taken')); }

          }

            const old = conns.get(m.f);
            if (old && old.n === m.n) { post({k: 'ack', f: me, to: m.f, n: m.n}); return; }
            if (old) { conns.delete(m.f); old.conn._ended(); }

            const conn = makeConn({
              send: f => post({k: 'd', f: me, to: cid, n, d: f}),
              close: () => { if (conns.get(cid) && conns.get(cid).conn === conn) conns.delete(cid); post({k: 'fin', f: me, to: cid, n}); },
            });

            post({k: 'ack', f: me, to: cid, n});

            return;
          }
          if (m.to !== me) return;
          const x = conns.get(m.f);
          if (!x || x.n !== m.n) return;
          if (m.k === 'd') x.conn._data(m.d);
          else if (m.k === 'fin') { conns.delete(m.f); x.conn._ended(); }

      return new Promise((res, rej) => {
        let ch; try { ch = new (BC())(addr); } catch (e) { return rej(netError('net_unavailable', e)); }
        const me = 'c' + uid(10), n = uid(6);
        let host = null, conn = null, synT = null, done = false;
        const t0 = clock.now();

        const fin = () => { if (host) post({k: 'fin', f: me, to: host, n}); };
        const cleanup = () => { clock.clearTimeout(synT); PAGEHIDE.delete(fin); open.delete(cleanup); try { ch.close(); } catch (e) { } };

          if (done) return;

    wake() { },
    close() { for (const fn of [...open]) fn(); },
  };
}

// ================================================================= peer: WebRTC через PeerJS cloud
function peerDriver(ctx) {
  const {clock, T} = ctx;

    dc.on('data', f => c._data(f));

    dc.on('error', e => { if (e && e.type === 'message-too-big') console.warn('[net] PeerJS: слишком большой кадр'); });

        reject(e);

    available: () => typeof PeerC() === 'function',
    listen, connect,
    wake() { },
    close() { const p = cp; cp = null; cpReady = null; try { p && p.destroy(); } catch (e) { } },

}

// ================================================================= room: capability claude.use('room')
// Всё идёт одним топиком 'm'. Поверх «широковещания» — виртуальные соединения с надёжной доставкой:
//   конверт emit: {f: мой cid, k?: 'syn'|'ack'|'fin'|'nop', to?, n?, a?: {n: последний принятый seq}, p?: [[n, seq, кусок, последний?]]}

    if (ctx.roomP) return ctx.roomP;

    const rooms = ctx.rooms || (ctx.rooms = new Map());

  return {
    name: 'room', maxFrame: 0,
    available: async () => !!(await getRoom()),
    listen, connect,
    wake() { for (const ep of eps) kick(ep); },
    close() { for (const ep of [...eps]) ep.destroy(); },
  };
}

const DRIVERS = {memory: memoryDriver, local: localDriver, peer: peerDriver, room: roomDriver};
