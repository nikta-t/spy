.ui-warn { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; background: rgba(255,198,41,.12); border: var(--bw-thin) solid var(--yellow); border-radius: 10px; color: var(--paper); font-size: 13.5px; line-height: 1.35; }
.ui-warn--bad { background: rgba(242,90,71,.14); border-color: var(--red-hi); }
.ui-warn .ui-ico { color: var(--yellow); margin-top: 1px; }
.ui-warn--bad .ui-ico { color: var(--red-hi); }
.ui-set__done { position: sticky; bottom: calc(-18px - var(--safe-b)); margin: 6px -18px calc(-18px - var(--safe-b)); padding: 14px 18px calc(14px + var(--safe-b)); background: linear-gradient(to top, var(--bg-2) 70%, rgba(15,69,71,0)); z-index: 3; }

/* редактор своей темы */
.ui-edit { display: flex; flex-direction: column; gap: 12px; }
.ui-edit__ex { padding: 10px 12px; background: var(--ink-2); border: 2px dashed var(--line-2); border-radius: 10px; font: 500 13px/1.6 var(--font-mono); color: var(--paper-dim); white-space: pre-wrap; }
.ui-edit__stat { display: flex; align-items: center; gap: 8px; font: 600 13px/1.3 var(--font-mono); color: var(--paper-dim); }
.ui-edit__stat.is-ok { color: var(--mint); }
.ui-edit__errs { margin: 0; padding: 0 0 0 18px; color: var(--red-hi); font-size: 13.5px; line-height: 1.4; }
.ui-edit__btns { display: flex; gap: 10px; }
.ui-edit__btns > .ui-btn { flex: 1 1 0; }

/* ---------- «Как играть» ---------- */
.ui-tour { position: absolute; inset: 0; z-index: 85; display: flex; flex-direction: column; background: var(--bg); animation: ui-fade 300ms var(--ease-out) both; padding-top: var(--safe-t); }
.ui-tour::before { content: ''; position: absolute; inset: 0; background: var(--halftone-paper) 0 0 / 8px 8px; opacity: .7; pointer-events: none; -webkit-mask-image: linear-gradient(to bottom, #000, transparent 50%); mask-image: linear-gradient(to bottom, #000, transparent 50%); }
.ui-tour.is-out { animation: ui-fade-out 240ms linear both; }
.ui-tour__top { position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 10px 0 18px; min-height: 56px; }
.ui-tour__step { flex: 1 1 auto; font: 700 11px/1 var(--font-mono); letter-spacing: .16em; color: var(--paper-mute); text-transform: uppercase; }
.ui-tour__view { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; touch-action: pan-y; }
.ui-tour__track { display: flex; height: 100%; will-change: transform; transition: transform 460ms var(--ease-spring); }
.ui-tour__track.is-drag { transition: none; }
.ui-tour__slide { flex: 0 0 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 8px 24px; text-align: center; overflow: hidden; }
.ui-tour__art { position: relative; width: min(100%, 320px); height: clamp(180px, 34dvh, 260px); flex: 0 0 auto; }
.ui-tour__no { font: 700 12px/1 var(--font-mono); letter-spacing: .16em; color: var(--yellow); }
.ui-tour__t { font: 800 clamp(24px, 7.4vw, 30px)/1.1 var(--font-display); letter-spacing: -.01em; }
.ui-tour__d { font-size: 16px; line-height: 1.45; color: var(--paper-dim); max-width: 330px; }
.ui-tour__d b { color: var(--paper); }
.ui-tour__foot { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 8px 18px calc(18px + var(--safe-b)); }
.ui-tour__dots { display: flex; gap: 0; }
.ui-tour__dot { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; padding: 0; }
.ui-tour__dot::before { content: ''; width: 10px; height: 10px; border-radius: 5px; background: var(--paper-mute); border: 2px solid var(--ink); transition: width var(--t-med) var(--ease-spring), background var(--t-med); }
.ui-tour__dot[aria-current="true"]::before { width: 28px; background: var(--yellow); }
.ui-tour__swipe { display: flex; align-items: center; gap: 6px; font: 600 12px/1 var(--font-mono); color: var(--paper-mute); letter-spacing: .06em; }
.ui-tour__swipe svg { animation: ui-g-swipe 1.8s var(--ease-out) infinite; }

/* мини-иллюстрации */
.tt-row { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: space-around; }
.tt-col { position: relative; display: flex; flex-direction: column; align-items: center; }
.tt-card {
  position: relative; width: 54px; height: 72px; border: 2.5px solid var(--ink); border-radius: 8px 3px 8px 3px; background: var(--manila);
  box-shadow: 0 3px 0 var(--ink); display: grid; place-items: center; font: 800 9px/1 var(--font-display); color: var(--ink);
}
.tt-card::before { content: ''; position: absolute; inset: 5px; border: 1.5px dashed rgba(6,25,26,.35); border-radius: 5px 2px 5px 2px; }
.tt-card__face { position: absolute; inset: -2.5px; display: grid; place-items: center; border-radius: inherit; background: var(--paper); border: 2.5px solid var(--ink); opacity: 0; font: 800 9.5px/1 var(--font-display); letter-spacing: -.01em; }
.tt-card__face.is-spy { color: var(--red-deep); background: #FFE3DE; }
.tt-deal .tt-card { position: absolute; left: calc(var(--x) - 27px); bottom: 64px; }
.ui-tour__slide.is-active .tt-deal .tt-card { animation: tt-deal 5.2s var(--ease-spring) infinite; animation-delay: calc(var(--i) * 160ms); }
.ui-tour__slide.is-active .tt-deal .tt-card__face { animation: tt-face 5.2s linear infinite; animation-delay: calc(var(--i) * 160ms); }
.tt-deck { position: absolute; left: 50%; top: 4px; width: 60px; height: 78px; margin-left: -30px; }
.tt-deck i { position: absolute; inset: 0; background: var(--manila); border: 2.5px solid var(--ink); border-radius: 8px 3px 8px 3px; }
.tt-deck i:nth-child(1) { transform: translate(4px, 4px) rotate(4deg); }
.tt-deck i:nth-child(2) { transform: translate(2px, 2px) rotate(2deg); }
.tt-deck i:nth-child(3) { display: grid; place-items: center; }

.tt-peek { position: absolute; left: 50%; top: 50%; width: 132px; height: 176px; margin: -96px 0 0 -66px; perspective: 700px; }
.tt-peek__in { position: absolute; inset: 0; transform-style: preserve-3d; }
.ui-tour__slide.is-active .tt-peek__in { animation: tt-peek 4.4s var(--ease-spring) infinite; }
.tt-peek__f { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 3px solid var(--ink); border-radius: 12px 4px 12px 4px; box-shadow: 0 5px 0 var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.tt-peek__f--c { background: var(--manila); }
.tt-peek__f--c .ui-stamp { font-size: 13px; }
.tt-peek__f--w { background: var(--paper); color: var(--ink); transform: rotateY(180deg); }
.tt-peek__w { font: 900 22px/1 var(--font-display); }
.tt-peek__m { font: 700 10px/1 var(--font-mono); letter-spacing: .12em; color: var(--ink-soft); }
.tt-finger { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin-left: 4px; margin-top: 14px; color: var(--ink); z-index: 2; }
.tt-finger svg { width: 100%; height: 100%; filter: drop-shadow(2px 2px 0 var(--ink)); }
.ui-tour__slide.is-active .tt-finger { animation: tt-finger 4.4s var(--ease-out) infinite; }
.tt-ripple { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: 0 0 0 4px; border-radius: 50%; border: 3px solid var(--yellow); opacity: 0; z-index: 2; }
.ui-tour__slide.is-active .tt-ripple { animation: tt-ripple 4.4s var(--ease-out) infinite; }

.tt-talk .tt-row { bottom: 14px; }
.tt-bub {
  position: absolute; bottom: calc(100% + 10px); left: 50%; margin-left: -14px; padding: 6px 9px; white-space: nowrap;
  background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 12px 12px 12px 3px;
  font: 700 13px/1 var(--font-body); box-shadow: 2px 2px 0 var(--ink); opacity: 0; transform-origin: 0 100%;
}
.tt-bub.is-spy { background: #FFE3DE; }
.tt-bub.is-right { left: auto; right: 50%; margin-left: 0; margin-right: -14px; transform-origin: 100% 100%; border-radius: 12px 12px 3px 12px; }
.tt-col:nth-child(even) .tt-bub { bottom: calc(100% + 52px); }
.ui-tour__slide.is-active .tt-bub { animation: tt-bub 6s var(--ease-spring) infinite; animation-delay: calc(var(--i) * 700ms); }
.tt-no { position: absolute; left: 50%; top: 2px; transform: translateX(-50%) rotate(-4deg); padding: 6px 12px; background: var(--paper); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 10px; font: 700 14px/1 var(--font-body); white-space: nowrap; }
.tt-no::after { content: ''; position: absolute; left: -4px; right: -4px; top: 52%; height: 2.5px; background: var(--red); border-radius: 2px; transform: rotate(-4deg); }

.tt-vote .tt-row { bottom: 14px; }
.tt-ballot { position: absolute; width: 22px; height: 16px; background: var(--yellow); border: 2px solid var(--ink); border-radius: 3px; left: var(--x0); bottom: 64px; opacity: 0; }
.ui-tour__slide.is-active .tt-ballot { animation: tt-ballot 5s var(--ease-in) infinite; animation-delay: calc(var(--i) * 180ms); }
.tt-vote .ui-stamp { position: absolute; left: calc(87.5% - 52px); bottom: 26px; z-index: 2; font-size: 15px; opacity: 0; }
.ui-tour__slide.is-active .tt-vote .ui-stamp { animation: tt-stamp 5s var(--ease-spring) infinite; }
.tt-plus { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); padding: 3px 7px; background: var(--mint); color: var(--ink); border: 2px solid var(--ink); border-radius: 6px; font: 800 12px/1 var(--font-display); opacity: 0; }
.ui-tour__slide.is-active .tt-plus { animation: tt-plus 5s var(--ease-out) infinite; }

/* ---------- ключевые кадры ---------- */
@keyframes ui-spin { to { transform: rotate(360deg); } }
@keyframes ui-blink { 50% { opacity: 0; } }
@keyframes ui-fade { from { opacity: 0; } }
@keyframes ui-fade-out { to { opacity: 0; } }
@keyframes ui-rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes ui-pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
@keyframes ui-bob { 50% { transform: translateY(-3px); } }
@keyframes ui-ping { 0% { transform: scale(.95); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }
@keyframes ui-throb { 50% { transform: scale(1.08); } }
@keyframes ui-slam {
  0% { opacity: 0; transform: rotate(calc(var(--rot) - 16deg)) scale(2.6); }
  55% { opacity: 1; transform: rotate(var(--rot)) scale(.9); }
  75% { transform: rotate(var(--rot)) scale(1.06); }
  100% { opacity: 1; transform: rotate(var(--rot)) scale(1); }
}
@keyframes ui-toast-in { from { opacity: 0; transform: translateY(-18px) rotate(-2deg) scale(.96); } }
@keyframes ui-toast-out { to { opacity: 0; transform: translateY(-10px) scale(.96); } }
@keyframes ui-modal-in { from { opacity: 0; transform: translateY(24px) rotate(-1.5deg) scale(.94); } }
@keyframes ui-modal-out { to { opacity: 0; transform: translateY(12px) scale(.96); } }
@keyframes ui-sheet-in { from { transform: translateY(100%); } }
@keyframes ui-sheet-out { to { transform: translateY(100%); } }
@keyframes ui-hint-in { from { opacity: 0; transform: translateY(8px) scale(.85); } }
@keyframes ui-hint-out { to { opacity: 0; transform: scale(.85); } }
@keyframes ui-float { 50% { transform: translateY(-4px); } }
@keyframes ui-g-hold { 0%, 100% { transform: translate(0, 4px); } 25%, 70% { transform: translate(0, 0) scale(.9); } }
@keyframes ui-g-ring { 0%, 20% { opacity: 0; transform: scale(.4); } 30% { opacity: 1; } 70% { opacity: 0; transform: scale(2.1); } 100% { opacity: 0; } }
@keyframes ui-g-tap { 0%, 100% { transform: translateY(4px); } 30% { transform: translateY(0) scale(.88); } 50% { transform: translateY(3px); } }
@keyframes ui-g-swipe { 0%, 100% { transform: translateX(6px); } 50% { transform: translateX(-8px); } }
@keyframes ui-react { 0% { opacity: 0; transform: translateY(20px) scale(.6); } 12% { opacity: 1; transform: translateY(0) scale(1.05); } 20% { transform: scale(1); } 80% { opacity: 1; transform: translateY(-40px); } 100% { opacity: 0; transform: translateY(-70px); } }
@keyframes ui-drop { 0% { opacity: 0; transform: translateY(-36px) rotate(-8deg); } 60% { opacity: 1; transform: translateY(4px) rotate(2deg); } 100% { opacity: 1; transform: none; } }
@keyframes ui-beam { from { transform: rotate(-24deg); } to { transform: rotate(24deg); } }
@keyframes ui-sun { from { transform: translate(-6px, 4px); } to { transform: translate(6px, -4px); } }
@keyframes ui-sway { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
@keyframes ui-eyes { 0%, 44%, 50%, 92%, 100% { transform: scaleY(1); } 47%, 95% { transform: scaleY(.1); } }
@keyframes ui-lens { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-9deg) translate(-2px, -4px); } 60% { transform: rotate(6deg) translate(2px, -1px); } }
@keyframes ui-glint { 0%, 60%, 100% { opacity: .9; } 70% { opacity: .2; } 80% { opacity: 1; } }
@keyframes ui-slide-in { from { opacity: 0; transform: translateX(-24px); } }
@keyframes ui-slide-out { to { opacity: 0; transform: translateX(30px); } }
@keyframes ui-search { 0%, 100% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(4px, -3px) rotate(10deg); } 50% { transform: translate(0, -5px) rotate(0); } 75% { transform: translate(-4px, -2px) rotate(-10deg); } }
@keyframes ui-dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75%, 100% { content: '...'; } }

@keyframes tt-deal {
  0% { opacity: 0; transform: translate(0, -78px) rotate(-12deg) scale(.9); }
  6% { opacity: 1; }
  18%, 92% { opacity: 1; transform: translate(0, 0) rotate(var(--r)); }
  100% { opacity: 0; transform: translate(0, 0) rotate(var(--r)); }
}
@keyframes tt-face { 0%, 30% { opacity: 0; } 36%, 92% { opacity: 1; } 100% { opacity: 0; } }
@keyframes tt-peek { 0%, 26% { transform: rotateY(0); } 36%, 66% { transform: rotateY(180deg); } 78%, 100% { transform: rotateY(0); } }
@keyframes tt-finger {
  0% { opacity: 0; transform: translate(60px, 60px); }
  12% { opacity: 1; transform: translate(10px, 10px); }
  22%, 66% { opacity: 1; transform: translate(0, 0) scale(.9); }
  76% { opacity: 1; transform: translate(14px, 18px); }
  90%, 100% { opacity: 0; transform: translate(60px, 60px); }
}
@keyframes tt-ripple { 0%, 22% { opacity: 0; transform: scale(.3); } 26% { opacity: 1; } 48% { opacity: 0; transform: scale(2.6); } 100% { opacity: 0; } }
@keyframes tt-bub { 0% { opacity: 0; transform: scale(.4); } 6% { opacity: 1; transform: scale(1.06); } 9%, 82% { opacity: 1; transform: scale(1); } 90%, 100% { opacity: 0; transform: scale(.9); } }
@keyframes tt-ballot {
  0%, 8% { opacity: 0; left: var(--x0); bottom: 60px; }
  12% { opacity: 1; left: var(--x0); bottom: 84px; transform: rotate(-10deg); }
  34% { opacity: 1; left: var(--x1); bottom: 74px; transform: rotate(14deg); }
  40%, 100% { opacity: 0; left: var(--x1); bottom: 62px; transform: scale(.6); }
}
@keyframes tt-stamp { 0%, 40% { opacity: 0; transform: rotate(-24deg) scale(2.4); } 48% { opacity: 1; transform: rotate(-10deg) scale(.92); } 54%, 92% { opacity: 1; transform: rotate(-10deg) scale(1); } 100% { opacity: 0; transform: rotate(-10deg) scale(1); } }
@keyframes tt-plus { 0%, 56% { opacity: 0; transform: translate(-50%, 8px); } 62%, 90% { opacity: 1; transform: translate(-50%, -6px); } 100% { opacity: 0; transform: translate(-50%, -14px); } }

/* ---------- меньше движения ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 1ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important;
    transition-duration: 1ms !important; scroll-behavior: auto !important;
  }
  .ui-hero__beam, .ui-hero__sun, .ui-hero__agent, .ag-eyes, .ag-lens { animation: none !important; }
}

/* ---------- очень узкие экраны ---------- */
@media (max-width: 370px) {
  .ui-page { padding-left: calc(12px + var(--safe-l)); padding-right: calc(12px + var(--safe-r)); }
  .ui-foot { margin-left: calc(-12px - var(--safe-l)); margin-right: calc(-12px - var(--safe-r)); padding-left: calc(12px + var(--safe-l)); padding-right: calc(12px + var(--safe-r)); }
  .ui-hero { margin: 0 -12px; }
  .ui-range { width: 56px; }
  .ui-btn { padding: 0 16px; }
  .ui-home__pair .ui-btn { font-size: 12.5px; }
  .ui-packs { gap: 7px; }
  .ui-ptile__t { font-size: 12px; }
}
@media (max-height: 680px) {
  .ui-hero { height: clamp(170px, 30dvh, 220px); }
  .ui-home { gap: 14px; }
}

/* ===== game.css ===== */
/* game.css — игровые экраны (агент UISCREENS). Префикс g-. Цвета/шрифты/движение — токены ui.css. */

/* ---------- каркас экрана: шапка, прокручиваемое тело, док снизу ---------- */
.screen > .g-screen { flex: 1 1 0; min-height: 0; }
.g-screen {
  position: relative; display: flex; flex-direction: column; height: 100%; min-height: 0;
  padding: 10px calc(16px + var(--safe-r, 0px)) 0 calc(16px + var(--safe-l, 0px));
  color: var(--paper); font-family: var(--font-body); overflow: hidden; overflow: clip;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
.g-screen input { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
.g-body {
  position: relative; flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto;
  overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  margin: 0 calc(-16px - var(--safe-r, 0px)) 0 calc(-16px - var(--safe-l, 0px));
  padding: 6px calc(16px + var(--safe-r, 0px)) 18px calc(16px + var(--safe-l, 0px));
  scrollbar-width: thin; scrollbar-color: var(--line-2) transparent;
}
.g-dock {
  position: relative; z-index: 4; flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px;
  margin: 0 calc(-16px - var(--safe-r, 0px)) 0 calc(-16px - var(--safe-l, 0px));
  padding: 12px calc(16px + var(--safe-r, 0px)) calc(12px + var(--safe-b, 0px)) calc(16px + var(--safe-l, 0px));
  background: var(--bg-2); border-top: var(--bw) solid var(--ink);
  box-shadow: 0 -6px 0 var(--bg-deep);
}
.g-dock::before { /* полоска «перфорации» */
  content: ''; position: absolute; left: 0; right: 0; top: -9px; height: 6px; pointer-events: none;
  background: radial-gradient(circle at 4px 6px, var(--ink) 2px, transparent 2.5px) 0 0 / 12px 6px; opacity: .5;
}
.g-dock-row { display: flex; gap: 8px; align-items: stretch; min-width: 0; }
.g-dock-row > .g-slot { flex: 1 1 auto; min-width: 0; display: flex; }
.g-dock-row > .g-slot > * { flex: 1 1 auto; }
.g-slot { min-width: 0; }
.g-slot > .ui-btn--full, .g-slot > .g-fb-btn.is-full { width: 100%; }
.g-dock-note { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 0; text-align: center; color: var(--paper-dim); font: 500 14px/1.35 var(--font-body); }
.g-dock-note .g-ic { width: 18px; height: 18px; flex: 0 0 auto; }
.g-status {
  display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 0 16px; width: 100%;
  border: var(--bw) dashed var(--line-2); border-radius: 14px 5px 14px 5px; color: var(--paper); font: 700 16px/1.2 var(--font-body);
}
.g-status.is-ok { border-style: solid; border-color: var(--ink); background: var(--mint); color: var(--ink); box-shadow: 0 4px 0 var(--ink); animation: g-pop .42s var(--ease-spring) both; }
.g-status .g-ic { width: 22px; height: 22px; stroke-width: 3; }
.g-link {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 4px; margin: 0;
  background: none; border: 0; color: var(--sky); font: 700 14px/1 var(--font-body); white-space: nowrap;
}
.g-link .g-ic { width: 17px; height: 17px; }
.g-link:active { transform: scale(.96); }

/* иконки */
.g-ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.g-ic .f { fill: currentColor; stroke: none; }
.g-ic--crown path { stroke: var(--ink); stroke-width: 1.6; fill: var(--yellow); }

/* точки «печатает…» */
.g-dots { display: inline-flex; gap: 3px; margin-left: 4px; vertical-align: middle; }
.g-dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; animation: g-dot 1.1s ease-in-out infinite; }
.g-dots i:nth-child(2) { animation-delay: .15s; }
.g-dots i:nth-child(3) { animation-delay: .3s; }

/* ---------- шапка ---------- */
.g-head { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; }
.g-steps { display: flex; align-items: center; gap: 6px; margin: 0; padding: 0; list-style: none; font: 700 10px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--paper-mute); min-width: 0; }
.g-step { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.g-step + .g-step::before { content: ''; width: 12px; height: 2px; background: var(--line-2); margin-right: 1px; }
.g-step-dot { width: 9px; height: 9px; border-radius: 50%; border: 2px solid currentColor; flex: 0 0 auto; }
.g-step.is-done { color: var(--paper-dim); }
.g-step.is-done .g-step-dot { background: var(--mint); border-color: var(--ink); }
.g-step.is-now { color: var(--yellow); }
.g-step.is-now .g-step-dot { background: var(--yellow); border-color: var(--ink); box-shadow: 0 0 0 2px var(--yellow); animation: g-throb 1.6s var(--ease-out) infinite; }
.g-head-row { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.g-head-txt { flex: 1 1 auto; min-width: 0; }
.g-title { margin: 0; font: 800 23px/1.1 var(--font-display); letter-spacing: -.01em; color: var(--paper); }
.g-sub { margin: 4px 0 0; font: 500 14px/1.35 var(--font-body); color: var(--paper-dim); }
.g-head-right { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
.g-timer { flex: 0 0 auto; display: grid; place-items: center; }

/* подсказки кита в своих контейнерах */
.g-hintbox { position: absolute; left: 50%; bottom: 18px; z-index: 3; transform: translateX(-50%); width: max-content; max-width: calc(100% - 8px); pointer-events: auto; }
.g-hintbox.is-inline { position: relative; left: auto; transform: none; margin: 2px 0 12px; }

/* ---------- DEAL ---------- */
.g-deal-stage { position: relative; flex: 1 1 auto; min-height: 180px; display: grid; place-items: center; padding: 6px 0 10px; }
.g-dcard-wrap {
  position: relative; display: block; width: 240px; height: 320px; outline: none; touch-action: none; cursor: pointer;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  transition: transform var(--t-med) var(--ease-spring);
  animation: g-deal-in .62s var(--ease-spring) both;
}
.g-dcard-wrap:focus-visible { outline: 3px solid var(--sky); outline-offset: 6px; border-radius: 18px; }
.g-dcard-wrap.is-open { transform: scale(1.035); }
.g-dcard-wrap > .g-c3 { --w: 100%; width: 100% !important; height: 100% !important; aspect-ratio: auto; }
.g-dcard-wrap::after { /* ореол удержания */
  content: ''; position: absolute; inset: -10px; border-radius: 22px 10px 22px 10px; border: 3px solid var(--yellow);
  opacity: 0; transform: scale(.96); transition: opacity var(--t-fast), transform var(--t-med) var(--ease-spring); pointer-events: none;
}
.g-dcard-wrap.is-open::after { opacity: .9; transform: none; }

/* лица карточки внутри kit.card3d */
.g-c3 .g-c3-face, .g-c3 .g-c3-cover { padding: 0 !important; gap: 0 !important; }
.g-c3 .g-c3-face::before, .g-c3 .g-c3-face::after { z-index: 0; }
.g-c3 .g-c3-face > .g-face, .g-c3 .g-c3-cover > .g-face { position: relative; z-index: 1; }
.g-face { flex: 1 1 auto; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; min-height: 0; }
.g-face-k { width: 100%; display: flex; justify-content: space-between; gap: 8px; font: 700 calc(var(--cw, 260px) * .04)/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; }

/* рубашка — папка-манила */
.g-cover { justify-content: space-between; padding: 8% 9% 9%; color: var(--ink); }
.g-cover-top { width: 100%; display: flex; justify-content: space-between; gap: 6px; font: 700 calc(var(--cw, 260px) * .038)/1 var(--font-mono); letter-spacing: .14em; color: var(--ink-soft); }
.g-cover-mid { position: relative; width: 62%; aspect-ratio: 1; display: grid; place-items: center; }
.g-art-key { width: 100%; height: 100%; overflow: visible; }
.g-k-disc { fill: var(--ink); }
.g-k-ring { fill: none; stroke: var(--manila); stroke-width: 3; stroke-dasharray: 5 4; }
.g-k-hole { fill: var(--manila); }
.g-cover-stamp { position: absolute; left: 50%; top: 72%; transform: translateX(-50%); font-size: calc(var(--cw, 260px) * .085); }
.g-cover-stamp .ui-stamp, .g-cover-stamp .g-fb-stamp { font-size: 1em; background: var(--manila); }
.g-cover-cta {
  position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 8px; padding: .55em 1em; border-radius: 999px; white-space: nowrap;
  background: var(--ink); color: var(--yellow); font: 800 calc(var(--cw, 260px) * .052)/1 var(--font-display); letter-spacing: .02em;
  box-shadow: 0 3px 0 var(--ink-soft); animation: g-nudge 2.2s ease-in-out infinite;
}
.g-cover-cta .g-ic { width: 1.25em; height: 1.25em; }
.g-dcard-wrap.is-open .g-cover-cta { animation: none; }

/* лицо: слово */
.g-wface { justify-content: space-between; padding: 9% 8% 8%; color: var(--ink); }
.g-wface .g-face-k { color: var(--ink-soft); padding-left: 6%; }
.g-wface-word {
  flex: 1 1 auto; display: grid; place-items: center; width: 100%; padding: 4px 0 4px 6%;
  font: 900 40px/1.04 var(--font-display); letter-spacing: -.02em; color: var(--ink);
  overflow-wrap: normal; word-break: normal; hyphens: manual; text-wrap: balance; overflow: hidden;
}
.g-face-pack { display: flex; align-items: center; gap: 10px; max-width: 100%; text-align: left; padding: 8px 12px 8px 8px; border: var(--bw-thin) solid var(--ink); border-radius: 10px 4px 10px 4px; background: var(--paper-2); color: var(--ink); }
.g-face-pack > .ui-pack, .g-face-pack > .g-fb-pack { flex: 0 0 auto; }
.g-face-pack-t { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.g-face-pack-t small { font: 700 10px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.g-face-pack-t b { font: 800 calc(var(--cw, 260px) * .056)/1.15 var(--font-body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-face-foot { margin: 10px 0 0; font: 600 calc(var(--cw, 260px) * .046)/1.3 var(--font-body); color: var(--ink-soft); max-width: 92%; }

/* лицо: шпион — красное поле, полутон, комикс-буквы */
.g-c3 .g-c3-spy { background: var(--red) !important; color: var(--paper); }
.g-c3 .g-c3-spy::before {
  content: '' !important; position: absolute !important; inset: 0 !important; width: auto !important; height: auto !important; border: 0 !important; border-radius: 0 !important; transform: none !important;
  background: var(--halftone-ink) 0 0 / 7px 7px !important; opacity: .55;
  -webkit-mask-image: radial-gradient(110% 80% at 50% 0%, transparent 35%, #000 95%); mask-image: radial-gradient(110% 80% at 50% 0%, transparent 35%, #000 95%);
}
.g-c3 .g-c3-spy::after { display: none !important; }
.g-sface { justify-content: space-between; padding: 8% 8% 8%; color: var(--paper); }
.g-sface .g-face-k { color: var(--paper); opacity: .85; }
.g-art-spy { width: 56%; height: auto; margin-top: 2%; }
.g-s-ink { fill: var(--ink); }
.g-s-band { fill: var(--red-deep); }
.g-s-bridge { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; fill: none; }
.g-s-glint { stroke: var(--paper); stroke-width: 2.5; stroke-linecap: round; opacity: .7; }
.g-sface-title {
  font: 900 calc(var(--cw, 260px) * .148)/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; color: var(--paper);
  text-shadow: 3px 3px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink), 4px 5px 0 var(--ink);
}
.g-c3-face.g-c3-spy .g-face-pack { background: var(--paper); }
.g-sface .g-face-foot { color: var(--paper); opacity: .92; margin-top: 6px; }
.g-sface-mates { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; max-width: 100%; font-size: calc(var(--cw, 260px) * .045); }
.g-sface-mates small { font: 700 10px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; }
.g-mate { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 9px 3px 3px; border-radius: 999px; background: var(--ink); color: var(--paper); }
.g-mate b { font: 700 13px/1 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }

/* анимированная подсказка «нажми и держи» */
.g-finger { position: absolute; left: 50%; top: 48%; width: 96px; height: 96px; margin: -48px 0 0 -48px; pointer-events: none; z-index: 4; transition: opacity var(--t-med); }
.g-finger.is-gone { opacity: 0; }
.g-finger-ring { position: absolute; inset: 0; border-radius: 50%; border: 4px solid var(--yellow); box-shadow: 0 0 0 3px var(--ink); opacity: 0; animation: g-ripple 2.2s var(--ease-out) infinite; }
.g-finger-ring.is-2 { animation-delay: .35s; }
.g-finger-hand { position: absolute; left: 34px; top: 30px; width: 54px; height: 54px; display: grid; place-items: center; color: var(--ink); animation: g-press 2.2s var(--ease-out) infinite; }
.g-finger-hand .g-ic { width: 54px; height: 54px; fill: var(--paper); stroke: var(--ink); stroke-width: 1.9; filter: drop-shadow(3px 3px 0 var(--ink)); }
.g-nudge {
  position: absolute; left: 50%; bottom: 0; transform: translate(-50%, 8px); max-width: 92%; z-index: 4;
  padding: 7px 12px; border-radius: 999px; background: var(--yellow); color: var(--ink); border: var(--bw-thin) solid var(--ink);
  font: 700 13px/1.2 var(--font-body); text-align: center; opacity: 0; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.g-nudge.is-on { animation: g-nudge-in 2.6s var(--ease-out) both; }

/* памятка «что дальше» */
.g-memo { flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 0 0 12px; padding: 0; list-style: none; }
.g-memo li { display: flex; align-items: flex-start; gap: 6px; min-width: 0; padding: 7px 7px 7px 6px; border: var(--bw-thin) dashed var(--line-2); border-radius: 8px; animation: ui-rise var(--t-slow) var(--ease-spring) both; animation-delay: calc(300ms + var(--i) * 80ms); }
.g-memo b { flex: 0 0 auto; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; background: var(--yellow); color: var(--ink); border: 2px solid var(--ink); font: 800 11px/1 var(--font-display); }
.g-memo span { min-width: 0; font: 700 12px/1.2 var(--font-body); color: var(--paper); }
.g-memo small { display: block; margin-top: 2px; font: 500 11px/1.2 var(--font-body); color: var(--paper-mute); }
.g-deal.is-ready .g-memo li:first-child { border-style: solid; border-color: var(--mint); }

/* кто готов */
.g-ready { display: flex; flex-direction: column; gap: 6px; }
.g-ready-lbl { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font: 500 13px/1.2 var(--font-body); color: var(--paper-mute); }
.g-ready-lbl b { font: 700 11px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--paper); }
.g-ready-row { display: flex; flex-wrap: wrap; gap: 4px; min-height: 30px; }
.g-ready-row.is-dense { gap: 0; }
.g-ready-row.is-dense .g-ready-av + .g-ready-av { margin-left: -3px; }
.g-ready-av { position: relative; display: inline-flex; border-radius: 50%; }
.g-ready-av.is-pop { animation: g-pop .5s var(--ease-spring) both; }
.g-ready-av.is-off::after { content: ''; position: absolute; left: 3px; right: 3px; top: 50%; height: 3px; background: var(--red); border-radius: 2px; transform: rotate(-30deg); }

/* наблюдатель */
.g-obs { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 320px; padding: 22px 18px; text-align: center; border: var(--bw) dashed var(--line-2); border-radius: 16px 6px 16px 6px; }
.g-obs-ic { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; background: var(--sky); color: var(--ink); border: var(--bw) solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.g-obs-ic .g-ic { width: 34px; height: 34px; }
.g-obs h2 { font: 800 19px/1.2 var(--font-display); }
.g-obs p { color: var(--paper-dim); font-size: 14px; line-height: 1.45; }

/* ---------- CLUES ---------- */
.g-round { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; padding: 6px 10px; border: var(--bw-thin) solid var(--ink); border-radius: 10px 4px 10px 4px; background: var(--ink-2); }
.g-round-t { font: 700 12px/1 var(--font-mono); letter-spacing: .06em; color: var(--paper-dim); white-space: nowrap; }
.g-round-t b { color: var(--yellow); font-size: 14px; }
.g-round-dots { display: flex; gap: 4px; }
.g-round-dots i { width: 14px; height: 5px; border-radius: 3px; background: var(--line-2); }
.g-round-dots i.is-done { background: var(--mint); }
.g-round-dots i.is-now { background: var(--yellow); }
.g-round.is-bump { animation: g-pop .5s var(--ease-spring); }

.g-turn {
  position: relative; flex: 0 0 auto; margin-bottom: 8px; padding: 10px 12px; color: var(--ink);
  background: var(--paper); border: var(--bw) solid var(--ink); border-radius: 6px 14px 6px 14px; box-shadow: var(--shadow-comic);
  transition: background var(--t-med);
}
.g-turn::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: var(--grain); opacity: .3; mix-blend-mode: multiply; pointer-events: none; }
.g-turn > * { position: relative; }
.g-turn-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
.g-turn-av { flex: 0 0 auto; width: 46px; height: 46px; display: grid; place-items: center; }
.g-turn-ic { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--yellow); }
.g-turn-ic .g-ic { width: 24px; height: 24px; }
.g-turn-txt { flex: 1 1 auto; min-width: 0; }
.g-turn-k { font: 700 10.5px/1.2 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-turn-name { margin-top: 2px; font: 800 20px/1.15 var(--font-display); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-turn-sub { margin-top: 2px; font: 600 13px/1.25 var(--font-body); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-turn .g-timer .ui-timer__bg { fill: var(--ink); }
.g-turn-last { margin-top: 9px; padding-top: 8px; border-top: 2px dashed var(--paper-3); display: flex; align-items: baseline; gap: 6px; min-width: 0; font: 500 13px/1.3 var(--font-body); color: var(--ink); white-space: nowrap; overflow: hidden; }
.g-turn-last small { flex: 0 0 auto; font: 700 10px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.g-turn-last-t { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.g-turn-last q { font-weight: 800; quotes: '«' '»'; }
.g-turn-last.is-new { animation: g-slide-in .42s var(--ease-spring) both; }
.g-turn.is-swap .g-turn-main { animation: g-swap .45s var(--ease-spring) both; }
.g-turn.is-me { background: var(--yellow); }
.g-turn.is-me .g-turn-k { color: var(--ink); }
.g-turn.is-me .g-turn-name { font-size: 24px; }
.g-turn.is-me .g-turn-sub { color: var(--ink); }
.g-turn.is-me .g-turn-last { border-top-color: var(--yellow-2); }
.g-turn.is-me::after { /* бегущая лента «ТВОЙ ХОД» */
  content: ''; position: absolute; left: 0; right: 0; bottom: -3px; height: 6px; border-radius: 0 0 6px 14px;
  background: repeating-linear-gradient(-45deg, var(--ink) 0 8px, transparent 8px 16px); opacity: .35; animation: g-stripes .8s linear infinite;
}
.g-turn.is-urgent { border-color: var(--red); }
.g-turn.is-urgent .g-turn-name { color: var(--red-deep); }
.g-turn.is-idle { background: var(--paper-2); }

.g-ticker {
  flex: 0 0 auto; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; margin: 0 0 6px; padding: 6px 8px 6px 10px;
  background: var(--ink-2); color: var(--paper); border: var(--bw-thin) solid var(--ink); border-radius: 10px; text-align: left; font: 500 13px/1.25 var(--font-body);
}
.g-ticker-ic { flex: 0 0 auto; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--sky); color: var(--ink); }
.g-ticker.is-acc .g-ticker-ic { background: var(--red-hi); }
.g-ticker-ic .g-ic { width: 14px; height: 14px; stroke-width: 3; }
.g-ticker-t { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-ticker-t b { color: var(--yellow); }
.g-ticker-n { flex: 0 0 auto; display: flex; align-items: center; gap: 5px; font: 700 10px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--paper-mute); }
.g-ticker-n b { min-width: 20px; height: 20px; padding: 0 5px; display: grid; place-items: center; border-radius: 10px; background: var(--paper); color: var(--ink); font-size: 11px; }
.g-ticker.is-new { animation: g-ticker-in .5s var(--ease-spring) both; }
.g-ticker:active { transform: scale(.98); }

.g-table { display: flex; flex-direction: column; }
.g-row {
  position: relative; display: grid; grid-template-columns: 16px 40px minmax(0, 1fr) 30px; align-items: center; gap: 8px;
  min-height: 60px; padding: 8px 6px 8px 4px; border-bottom: 2px dashed var(--line); border-radius: 10px; cursor: pointer;
  transition: background var(--t-med), box-shadow var(--t-med);
  animation: ui-rise var(--t-slow) var(--ease-spring) both; animation-delay: calc(var(--i) * 40ms);
}
.g-row.is-me { cursor: default; }
.g-table.is-dense .g-row { grid-template-columns: 14px 34px minmax(0, 1fr) 28px; min-height: 54px; padding: 6px 6px 6px 4px; }
.g-row-n { font: 700 11px/1 var(--font-mono); color: var(--paper-mute); text-align: right; }
.g-row-av { position: relative; display: grid; place-items: center; }
.g-row-main { min-width: 0; }
.g-row-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.g-row-name { min-width: 0; flex: 0 1 auto; font: 700 15px/1.2 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-row-tag { flex: 0 0 auto; padding: 2px 6px; border-radius: 5px; border: 1.5px solid var(--line-2); font: 700 9.5px/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--paper-mute); max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-row-tag.is-off { border-color: var(--red); color: var(--red-hi); }
.g-row.is-me .g-row-tag { border-color: var(--yellow); color: var(--yellow); }
.g-row-acc { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 2px; padding: 2px 6px 2px 4px; border-radius: 999px; background: var(--red-hi); color: var(--ink); border: 1.5px solid var(--ink); font: 800 11px/1 var(--font-mono); }
.g-row-acc .g-ic { width: 11px; height: 11px; stroke-width: 3.2; }
.g-row-acc.is-pop { animation: g-pop .5s var(--ease-spring); }
.g-cslots { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px; margin-top: 5px; }
.g-clue {
  position: relative; display: flex; align-items: center; gap: 2px; min-width: 0; min-height: 28px; padding: 4px 8px;
  border-radius: 8px 8px 8px 3px; font: 700 14px/1.15 var(--font-body);
  border: 2px dashed var(--line-2); color: var(--paper-mute);
}
.g-clue-t { min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.g-clue[data-s="empty"] { opacity: .45; }
.g-clue[data-s="miss"] { opacity: .3; }
.g-clue[data-s="said"] { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); }
.g-clue[data-s="skip"] { border-color: var(--red); color: var(--red-hi); font: 700 11px/1.1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; }
.g-clue[data-s="now"] { border: 2px solid var(--yellow); color: var(--yellow); font: 700 11px/1.1 var(--font-mono); letter-spacing: .04em; text-transform: uppercase; animation: g-breathe 1.4s ease-in-out infinite; }
.g-clue[data-s="now"] .g-dots i { width: 4px; height: 4px; }
.g-clue.is-new { animation: g-clue-pop .6s var(--ease-spring) both; }
.g-row-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: var(--paper-mute); border: 2px dashed var(--line-2); transition: background var(--t-fast), color var(--t-fast), transform var(--t-med) var(--ease-spring); }
.g-row-mark.is-me { border: 0; }
.g-row-mark .g-ic { width: 15px; height: 15px; }
.g-row.is-turn { background: var(--bg-2); box-shadow: inset 0 0 0 3px var(--yellow); border-bottom-color: transparent; }
.g-row.is-turn .g-row-n { color: var(--yellow); }
.g-row.is-off .g-row-name { color: var(--paper-mute); }
.g-row.is-marked { background: linear-gradient(90deg, rgba(229, 57, 43, .18), transparent 70%); }
.g-row.is-marked .g-row-mark { background: var(--red-hi); color: var(--ink); border: 2px solid var(--ink); transform: rotate(-12deg) scale(1.08); }
.g-row.is-marked .g-row-av::after {
  content: '?'; position: absolute; right: -4px; top: -4px; width: 18px; height: 18px; display: grid; place-items: center;
  border-radius: 50%; background: var(--red-hi); color: var(--ink); border: 2px solid var(--ink); font: 900 11px/1 var(--font-display);
}
.g-row.is-stamp .g-row-mark { animation: g-pop .45s var(--ease-spring); }
.g-row:active:not(.is-me) { transform: scale(.985); }
.g-table-note { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 12px 0 0; font: 500 12px/1.35 var(--font-body); color: var(--paper-mute); text-align: center; }
.g-table-note .g-ic { width: 14px; height: 14px; }

/* док подсказок */
.g-cdock.is-me { background: var(--ink-2); }
.g-rule { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.g-rule p { margin: 0; min-width: 0; font: 500 13px/1.3 var(--font-body); color: var(--paper-dim); }
.g-rule p b { color: var(--yellow); }
.g-rule .g-slot { flex: 0 0 auto; }
.g-inrow { align-items: center; }
.g-input {
  flex: 1 1 auto; min-width: 0; height: 54px; padding: 0 14px; margin: 0;
  font: 700 18px/1 var(--font-body); color: var(--ink); background: var(--paper);
  border: var(--bw) solid var(--ink); border-radius: 12px 4px 12px 4px; box-shadow: inset 0 3px 0 var(--paper-3);
  -webkit-appearance: none; appearance: none;
}
.g-input::placeholder { color: var(--ink-soft); opacity: .7; font-weight: 500; }
.g-input:focus { outline: 3px solid var(--yellow); outline-offset: 2px; }
.g-dock-row > .g-slot.g-send { flex: 0 0 auto; }
.g-send .ui-btn, .g-send .g-fb-btn { min-height: 54px; padding: 0 16px; gap: 7px; }
.g-send .ui-ico, .g-send .g-ic { width: 20px; height: 20px; }
.g-err { margin: 0; min-height: 0; font: 700 13px/1.3 var(--font-body); color: var(--red-hi); }
.g-err:empty { display: none; }
.g-screen.has-err .g-input { border-color: var(--red); }

/* «Моя карта» (удержание) */
.g-peekbtn {
  position: relative; flex: 0 0 auto; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 12px 0 8px;
  background: var(--manila); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 12px 4px 12px 4px; box-shadow: 0 4px 0 var(--ink);
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  transition: transform var(--t-fast) var(--ease-spring), box-shadow var(--t-fast);
}
.g-peekbtn-card { width: 30px; height: 36px; display: grid; place-items: center; border-radius: 5px 2px 5px 2px; background: var(--ink); color: var(--manila); }
.g-peekbtn-card .g-ic { width: 20px; height: 20px; }
.g-peekbtn-t { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
.g-peekbtn-t b { font: 800 13px/1 var(--font-body); white-space: nowrap; }
.g-peekbtn-t small { font: 700 10px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.g-peekbtn.is-compact { padding: 0; width: 52px; justify-content: center; }
.g-peekbtn.is-compact .g-peekbtn-t { display: none; }
.g-peekbtn.is-on { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.g-peek {
  position: absolute; left: 50%; bottom: 110px; z-index: 30; width: min(280px, calc(100% - 32px));
  transform: translateX(-50%) perspective(700px) rotateX(-80deg) scale(.86); transform-origin: 50% 100%;
  opacity: 0; pointer-events: none; transition: transform .32s var(--ease-spring), opacity .16s linear;
}
.g-peek.is-on { opacity: 1; transform: translateX(-50%) perspective(700px) rotateX(0) scale(1); }
.g-mini {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 16px 14px; text-align: center;
  background: var(--paper); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 14px 5px 14px 5px; box-shadow: 0 6px 0 var(--ink);
}
.g-mini small { font: 700 10px/1 var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.g-mini-w { font: 900 30px/1.05 var(--font-display); letter-spacing: -.02em; overflow-wrap: anywhere; hyphens: auto; }
.g-mini span { font: 600 13px/1.3 var(--font-body); color: var(--ink-soft); }
.g-mini em { font: 600 12px/1.3 var(--font-body); font-style: normal; opacity: .9; }
.g-mini.is-spy { background: var(--red); color: var(--paper); }
.g-mini.is-spy small, .g-mini.is-spy span { color: var(--paper); opacity: .9; }
.g-mini.is-spy .g-mini-w { text-transform: uppercase; text-shadow: 2px 2px 0 var(--ink); }

/* полоса «Круг N» */
.g-flash { position: absolute; left: 0; right: 0; top: 42%; z-index: 20; display: grid; place-items: center; padding: 10px 0; pointer-events: none; opacity: 0; overflow: hidden; overflow: clip; }
.g-flash.is-on { animation: g-flash 1.8s var(--ease-out) both; }
.g-flash-in {
  display: flex; flex-direction: column; align-items: center; gap: 4px; width: 112%; padding: 12px 20px; transform: rotate(-4deg);
  background: var(--yellow); color: var(--ink); border-top: var(--bw) solid var(--ink); border-bottom: var(--bw) solid var(--ink); box-shadow: 0 6px 0 var(--ink);
}
.g-flash-in b { font: 900 30px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
.g-flash-in span { font: 700 13px/1.2 var(--font-body); }

/* шторки: списки */
.g-sheet-note { margin: 0 0 12px; font: 500 14px/1.4 var(--font-body); color: var(--paper-dim); }
.g-pick { display: flex; flex-direction: column; gap: 8px; }
.g-pick-row {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 12px 8px 8px; text-align: left;
  background: var(--paper); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 12px 4px 12px 4px; box-shadow: 0 3px 0 var(--ink);
}
.g-pick-row:active { transform: translateY(3px); box-shadow: none; }

.g-feed-to { color: var(--paper-mute); font-weight: 700; }
.g-feed-ic { width: 32px; height: 32px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; background: var(--sky); color: var(--ink); }

.g-hist { display: flex; flex-direction: column; gap: 6px; }

/* ---------- VOTE ---------- */

.g-vgrid { --cols: 2; display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 12px 10px; padding-top: 10px; }
.g-vcard {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; min-height: 44px; margin: 0;
  padding: 12px 8px 10px; text-align: center; color: var(--ink); background: var(--paper);

}

}
.g-vcard-clues { position: relative; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 100%; max-height: 46px; overflow: hidden; }
.g-vcard-clues span { max-width: 100%; padding: 2px 6px; border: 1.5px solid var(--ink); border-radius: 6px 6px 6px 2px; font: 700 12px/1.2 var(--font-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-vcard-clues span.is-skip { border-style: dashed; color: var(--ink-soft); font: 700 10px/1.25 var(--font-mono); text-transform: uppercase; }
.g-vcard-flags { position: absolute; left: 6px; top: 6px; display: flex; flex-direction: column; gap: 3px; }
.g-flag { min-width: 22px; height: 22px; padding: 0 4px; display: grid; place-items: center; border-radius: 11px; border: 2px solid var(--ink); font: 800 10px/1 var(--font-mono); }
.g-flag .g-ic { width: 12px; height: 12px; stroke-width: 3.2; }
.g-flag.is-mark { background: var(--red-hi); }
.g-flag.is-acc { background: var(--paper); color: var(--red-deep); }
.g-flag.is-left { background: var(--ink); color: var(--paper); padding: 0 6px; }
.g-vcard-pick {
  position: absolute; right: -9px; top: -10px; z-index: 2; width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 50%; background: var(--red); color: var(--paper); border: var(--bw) solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
  transform: scale(0) rotate(-40deg); transition: transform var(--t-med) var(--ease-spring);
}

.g-vcard.is-on { background: var(--yellow); transform: translateY(-3px) rotate(-1.2deg); box-shadow: 0 7px 0 var(--ink); }

.g-vcard.is-hit { animation: g-hit .4s var(--ease-spring); }

.g-vnospy {
  position: relative; grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; min-height: 58px; margin: 0; padding: 8px 14px; text-align: left;

  transition: background var(--t-fast), transform var(--t-med) var(--ease-spring);
}

.g-vnospy.is-on { background: var(--yellow); color: var(--ink); border: var(--bw) solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.g-vnospy.is-on small { color: var(--ink-soft); }
.g-vnospy.is-on .g-vnospy-ic { background: var(--ink); color: var(--yellow); border-color: var(--ink); }
.g-vote .g-dock-note { min-height: 18px; font-size: 13px; }

/* ---------- REVEAL ---------- */
.g-rv-body { display: flex; flex-direction: column; gap: 12px; }
.g-rv-stage { position: relative; flex: 0 0 auto; height: 246px; }

.g-rv-votes.is-off { transform: translateY(-14px) scale(.96); }
.g-rv-k { display: flex; justify-content: space-between; margin-bottom: 2px; font: 700 10.5px/1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--paper-mute); }
.g-tl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) 30px; align-items: center; gap: 8px; min-height: 34px; padding: 2px 6px; border-radius: 8px; transition: background var(--t-med), color var(--t-med); }
.g-tl-who { display: flex; align-items: center; gap: 7px; min-width: 0; }

.g-tl-more, .g-tl-empty { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px; font: 600 13px/1.2 var(--font-body); color: var(--paper-mute); }
.g-tl-empty .g-ic { width: 22px; height: 22px; }
.g-rv-cards { transform: scale(.9); }
.g-rv-cardrow { display: flex; align-items: center; justify-content: center; gap: 16px; height: 100%; }
.g-rcard { --w: 168px; width: var(--w) !important; animation: g-card-in .55s var(--ease-spring) both; }
.g-rv-cardrow.is-two .g-rcard { --w: 146px; }

.g-rf, .g-rb { justify-content: flex-start; gap: 7px; padding: 18px 10px 12px; color: var(--ink); }
.g-rf small, .g-rb small { font: 700 10px/1.1 var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.g-rf-q { width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--manila); font: 900 34px/1 var(--font-display); }
.g-rf-name { max-width: 100%; font: 800 15px/1.15 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-rb-role { padding: 4px 10px; border-radius: 6px; border: 2px solid var(--ink); font: 900 14px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; background: var(--paper); }
.g-rb.is-spy { color: var(--paper); }

.g-rb.is-spy .g-rb-role { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.g-rb.is-civ .g-rb-role { background: var(--mint); }
.g-rb.is-none .g-rb-role { background: var(--mint); }
.g-rb-ic { width: 60px; height: 60px; display: grid; place-items: center; border-radius: 50%; background: var(--ink); color: var(--mint); }
.g-rb-ic .g-ic { width: 34px; height: 34px; }
.g-c3 .g-c3-civ, .g-c3 .g-c3-none { background: var(--paper) !important; }
.g-c3 .g-c3-civ::before, .g-c3 .g-c3-civ::after, .g-c3 .g-c3-none::before, .g-c3 .g-c3-none::after { display: none !important; }
.g-c3 .g-c3-none { background: repeating-linear-gradient(-45deg, transparent 0 10px, var(--paper-2) 10px 13px), var(--paper) !important; }
.g-rv-stampbox { position: absolute; left: 0; right: 0; top: 80%; transform: translateY(-50%); z-index: 5; display: grid; place-items: center; pointer-events: none; }
.g-rv-stampbox .ui-stamp, .g-rv-stampbox .g-fb-stamp { background: var(--bg-deep); box-shadow: 0 0 0 4px var(--bg-deep); }
.g-reveal.is-yellow .g-rv-stampbox .ui-stamp { background: var(--ink); }
.g-rv-verdict, .g-rv-facts > *, .g-rv-mini { opacity: 0; transform: translateY(14px); }
.g-reveal.is-final .g-rv-verdict, .g-reveal.is-final .g-rv-facts > *, .g-reveal.is-final .g-rv-mini { opacity: 1; transform: none; transition: opacity .38s var(--ease-out), transform .5s var(--ease-spring); }
.g-reveal.is-final .g-rv-facts > :nth-child(1) { transition-delay: .08s; }
.g-reveal.is-final .g-rv-facts > :nth-child(2) { transition-delay: .16s; }
.g-reveal.is-final .g-rv-facts > :nth-child(3) { transition-delay: .24s; }
.g-reveal.is-final .g-rv-mini { transition-delay: .32s; }
.g-reveal.is-fast .g-rv-scene { transition: none; }
.g-rv-vrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.g-rv-verdict h2 { font: 800 22px/1.15 var(--font-display); letter-spacing: -.01em; }
.g-rv-verdict p { margin-top: 4px; font: 500 14px/1.4 var(--font-body); color: var(--paper-dim); }
.g-res { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; padding: 5px 6px 5px 10px; border-radius: 8px; border: 2px solid var(--ink); color: var(--ink); transform: rotate(3deg); box-shadow: 3px 3px 0 var(--ink); }

.g-rv-dock { gap: 10px; }
.g-auto { display: flex; flex-direction: column; gap: 6px; }
.g-auto-t { font: 600 12px/1.2 var(--font-mono); letter-spacing: .04em; color: var(--paper-mute); text-align: center; }
.g-auto-bar { display: block; height: 5px; border-radius: 3px; background: var(--ink); overflow: hidden; }

.g-votes { display: flex; flex-direction: column; gap: 6px; }
.g-vote-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) 16px minmax(0, 1fr); align-items: center; gap: 8px; padding: 6px 0; border-bottom: 2px dashed var(--line); font: 600 14px/1.2 var(--font-body); }

/* ---------- GUESS ---------- */

.g-gs-spy { display: flex; align-items: center; gap: 16px; padding: 12px 14px; background: var(--ink-2); border: var(--bw) solid var(--ink); border-radius: 6px 14px 6px 14px; }
.g-gs-avs { display: flex; gap: 10px; flex: 0 0 auto; }
.g-orbit { position: relative; display: grid; place-items: center; padding: 8px; }
.g-orbit-lens { position: absolute; inset: -4px; animation: g-orbit 2.6s linear infinite; pointer-events: none; }
.g-orbit-lens .g-ic { position: absolute; left: 50%; top: -6px; width: 26px; height: 26px; margin-left: -13px; color: var(--yellow); stroke-width: 3; filter: drop-shadow(2px 2px 0 var(--ink)); animation: g-orbit 2.6s linear infinite reverse; }
.g-gs-spyt { min-width: 0; display: flex; flex-direction: column; gap: 3px; }

.g-gs-res-t { min-width: 0; display: flex; flex-direction: column; gap: 4px; }

.g-ggrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.g-gopt {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; margin: 0; padding: 8px 8px;
  background: var(--paper); color: var(--ink); border: var(--bw) solid var(--ink); border-radius: 10px 4px 10px 4px; box-shadow: 0 3px 0 var(--ink); text-align: center;
