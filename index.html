    out.push({ name: nm, hue: Math.floor(r() * 360), face: Math.floor(r() * 12), persona, bio, traits: {} });
  }
  let k = 1;
  while (out.length < n) {
    const nm = 'Бот ' + (k++);
    if (used.has(U.norm(nm))) continue;
    used.add(U.norm(nm));
    out.push({ name: nm, hue: Math.floor(r() * 360), face: Math.floor(r() * 12), persona: 'Новичок', bio: 'Только учится шпионить', traits: {} });
  }
  return out;
}

// Простой запасной мозг: когда Spy.AI нет или настоящий мозг сломался.
function fallbackBrain(desc, env) {
  const r = env.rng || Math.random, sp = env.speed || 1;
  let info = { role: 'word', word: null, packId: null, fellowSpies: [] };
  const used = new Set(), sus = {};
  const think = (a, b) => Math.round((a + r() * (b - a)) / sp);
  const packOfId = id => (env.packs || []).find(p => p && p.id === id) || null;
  return {
    start(i) { info = Object.assign({ fellowSpies: [] }, i || {}); used.clear(); },
    observe(e) {
      if (!e) return;
      if (e.type === 'clue' && e.entry && e.entry.text) used.add(U.norm(e.entry.text));
      if (e.type === 'accuse' && e.to) sus[e.to] = (sus[e.to] || 0) + 1;
    },
    clue(arg) {
      for (const h of (arg && arg.history) || []) if (h && h.text) used.add(U.norm(h.text));
      const p = info.packId ? packOfId(info.packId) : null;
      let pool;
      if (info.role === 'word') {
        const w = p && (p.words || []).find(x => U.norm(x.w) === U.norm(info.word));
        pool = [...((w && w.a) || []).slice(0, 8), ...((p && p.generic) || [])].filter(x => !obvious(x, info.word));
      } else {
        pool = [...((p && p.generic) || []), ...vagueList()];
      }
      pool = pool.filter(x => x && String(x).length <= 28 && !used.has(U.norm(x)));
      if (!pool.length) pool = vagueList().filter(x => !used.has(U.norm(x)));
      const text = pool.length ? U.pick(pool.slice(0, Math.min(pool.length, 5)), r) : '';
      if (text) used.add(U.norm(text));
      return { text, thinkMs: think(900, 2800) };
    },
    vote(arg) {
      const need = (arg && arg.need) || 1;
      const others = (env.players || []).map(p => p.id).filter(id => id !== desc.id && !(info.fellowSpies || []).includes(id));
      const ranked = U.shuffle(others, r).sort((a, b) => (sus[b] || 0) - (sus[a] || 0));
      return { picks: ranked.slice(0, need), thinkMs: think(900, 3000) };
    },
    guess(arg) { const o = (arg && arg.options) || []; return { word: o.length ? U.pick(o, r) : '', thinkMs: think(1200, 3500) }; },
    accuse() { return null; },
    debug() { return { suspicion: Object.assign({}, sus), posterior: [], notes: ['fallback brain'] }; },
  };
}

// ======================================================================
//                               ЯДРО
// ======================================================================
// opts: { code, online, hostId, hostProfile, clock, rng, speed, data, ai, onEvent(ev, toPid|null), onChange(), onPhase(phase), onError(e, tag) }
function createRoom(opts, snap) {
  opts = opts || {};
  const clock = opts.clock || realClock();
  const rnd = opts.rng || Math.random;
  const speed = Math.max(0.05, Number(opts.speed) || ((Spy.config && Spy.config.fast) ? 5 : 1));
  const dataSrc = () => opts.data || Spy.data || null;
  const aiSrc = () => ('ai' in opts ? opts.ai : Spy.AI) || null;
  const now = () => clock.now();
  const ms = base => Math.max(0, Math.round(base / speed));

  let S = null;
  let destroyed = false;
  const handles = new Map();
  const brains = {};
  const reactAt = {};
  let seenSinceRestore = null;

  function report(e, tag) {
    if (opts.onError) { try { opts.onError(e, tag || 'engine'); } catch (x) { /* ignore */ } return; }
    if (typeof console !== 'undefined') (tag === 'brain' ? console.warn : console.error)('[Spy.Engine]', tag || '', e);
  }
  const changed = () => { if (!destroyed && opts.onChange) { try { opts.onChange(); } catch (e) { report(e); } } };
  function emit(ev, to) { if (destroyed || !opts.onEvent) return; try { opts.onEvent(ev, to == null ? null : to); } catch (e) { report(e); } }

  // ---------- данные ----------
  function allPacks() { const d = dataSrc(); return d && Array.isArray(d.packs) ? d.packs : []; }
  function dataPack(id) {
    const d = dataSrc();
    if (!d || !id) return null;
    try { return (typeof d.get === 'function' && d.get(id)) || (d.byId && d.byId[id]) || allPacks().find(p => p.id === id) || null; } catch (e) { return null; }
  }
  function packOf(id) {
    if (id === 'custom') return (S.game && S.game.custom) || (S.settings.custom ? buildCustomPack(S.settings.custom) : null);
    return dataPack(id);
  }

  // ---------- игроки ----------
  const player = id => S.players.find(p => p.id === id) || null;
  const seated = () => S.players.filter(p => !p.left).length;
  const isPart = id => !!(S.game && S.game.participants.includes(id));
  const isSpy = id => !!(S.game && S.game.spies.includes(id));
  const present = p => !!p && !p.left && (p.isBot || p.connected);

  function feedPush(item) {
    const it = Object.assign({ id: ++S.feedSeq, ts: now(), g: S.round }, item);
    it.text = String(it.text || '').slice(0, 140);
    S.feed.push(it);
    if (S.feed.length > FEED_MAX) S.feed.splice(0, S.feed.length - FEED_MAX);
    return it;
  }
  const sys = text => feedPush({ kind: 'sys', text });
  function toast(pid, text, kind) { const p = player(pid); if (p && p.isBot) return; emit({ type: 'toast', text, kind: kind || 'warn' }, pid); }
  function fail(p, text, code) { if (p && text) toast(p.id, text, 'warn'); return { ok: false, error: code || 'rejected', text }; }

  // ---------- таймеры (сериализуемые) ----------
  function arm(t) {
    if (destroyed) return;
    const h = clock.setTimeout(() => fire(t.id), Math.max(0, t.at - now()));
    handles.set(t.id, h);
  }
  function schedule(kind, delay, data) {
    const t = { id: ++S.timerSeq, at: now() + Math.max(0, Math.round(delay)), kind, data: data || null };
    S.timers.push(t);
    arm(t);
    return t.id;
  }
  function cancel(pred) {
    S.timers = S.timers.filter(t => {
      if (!pred(t)) return true;
      if (handles.has(t.id)) { clock.clearTimeout(handles.get(t.id)); handles.delete(t.id); }
      return false;
    });
  }
  const cancelKind = (...kinds) => cancel(t => kinds.includes(t.kind));
  function fire(id) {
    handles.delete(id);
    if (destroyed) return;
    const i = S.timers.findIndex(t => t.id === id);
    if (i < 0) return;
    const t = S.timers[i];
    S.timers.splice(i, 1);
    const fn = HANDLERS[t.kind];
    try { if (fn) fn(t.data || {}); } catch (e) { report(e); }
    changed();
  }
  function setPhase(ph) {
    cancel(t => t.kind !== 'gc' && t.kind !== 'restoreCheck');
    S.phase = ph;
    if (opts.onPhase) { try { opts.onPhase(ph); } catch (e) { report(e); } }
  }

  // ---------- настройки ----------
  function defaultSettings() {
    return {
      packs: allPacks().map(p => p.id), custom: null, useCustom: false, spies: 1, noSpyChance: 0,
      clueRounds: 2, turnSeconds: 25, voteSeconds: 45, spyKnowsTheme: true, spyGuess: true, spiesKnowEachOther: true, difficulty: 'normal',
    };
  }
  function recomputeSpies() { S.settings.spies = (S.spiesWanted === 2 && seated() >= 6) ? 2 : 1; }
  function applySettings(p, patch) {
    const s = S.settings;
    if ('packs' in patch && Array.isArray(patch.packs)) {
      const known = allPacks().map(x => x.id);
      const out = [];
      for (const id of patch.packs) { const k = String(id); if ((!known.length || known.includes(k) || dataPack(k)) && k !== 'custom' && !out.includes(k)) out.push(k); }
      s.packs = out;
    }
    if ('custom' in patch) s.custom = patch.custom ? cleanCustom(patch.custom) : null;
    if ('useCustom' in patch) s.useCustom = !!patch.useCustom;
    if ('spies' in patch) {
      S.spiesWanted = Number(patch.spies) === 2 ? 2 : 1;
      if (S.spiesWanted === 2 && seated() < 6) toast(p.id, 'Два шпиона — когда за столом от 6 игроков', 'info');
    }
    for (const k of ['noSpyChance', 'clueRounds', 'turnSeconds', 'voteSeconds']) if (k in patch) s[k] = nearest(patch[k], CHOICES[k], s[k]);
    for (const k of ['spyKnowsTheme', 'spyGuess', 'spiesKnowEachOther']) if (k in patch) s[k] = !!patch[k];
    if ('difficulty' in patch && DIFFS.includes(patch.difficulty)) s.difficulty = patch.difficulty;
    recomputeSpies();
  }

  // ---------- состояние ----------
  function freshState() {
    const hp = cleanProfile(opts.hostProfile, null, rnd);
    const hostId = String(opts.hostId || 'host');
    return {
      v: 1, code: opts.code || null, online: !!opts.online, hostId,
      phase: 'lobby', round: 0, settings: defaultSettings(), spiesWanted: 1,
      players: [Object.assign({ id: hostId }, hp, { isBot: false, isHost: true, connected: true, waiting: false, score: 0 })],
      banned: [], recent: [], feed: [], feedSeq: 0, game: null, timers: [], timerSeq: 0,
    };
  }

  // ---------- мозги ботов ----------
  function brainEnv(p) {
    const g = S.game;
    return {
      rng: U.rng(Math.floor(rnd() * 4294967296)), difficulty: S.settings.difficulty,
      packs: g.packIds.map(packOf).filter(Boolean),
      players: g.participants.map(id => { const q = player(id); return { id, name: q ? q.name : '?', isBot: !!(q && q.isBot) }; }),
      speed, me: p.id,
    };
  }
  function initBrain(p, replay) {
    const g = S.game;
    const env = brainEnv(p);
    const desc = Object.assign({}, p.ai || {}, { id: p.id, name: p.name, hue: p.hue, face: p.face, persona: p.persona, bio: p.bio });
    const rec = { brain: null, broken: false, fb: fallbackBrain(desc, Object.assign({}, env, { rng: U.rng(Math.floor(rnd() * 4294967296)) })), desc };
    const AI = aiSrc();
    if (AI && typeof AI.createBrain === 'function') {
      try { rec.brain = AI.createBrain(desc, env); } catch (e) { report(e, 'brain'); rec.brain = null; }
    }
    if (!rec.brain || typeof rec.brain !== 'object') rec.broken = true;
    brains[p.id] = rec;
    const info = clone(g.startInfo[p.id]);
    try { rec.fb.start(clone(info)); } catch (e) { report(e, 'brain'); }
    if (!rec.broken) { try { rec.brain.start(info); } catch (e) { report(e, 'brain'); rec.broken = true; } }
    if (replay) for (const ev of g.pub) feedBrain(rec, ev);
  }
  function feedBrain(rec, ev) {
    try { rec.fb.observe(clone(ev)); } catch (e) { /* запасной мозг не должен падать */ }
    if (rec.broken || typeof rec.brain.observe !== 'function') return;
    try { rec.brain.observe(clone(ev)); } catch (e) { report(e, 'brain'); rec.broken = true; }
  }
  // Вызов метода мозга; если мозг сломан/бросил/вернул мусор (valid → false) — ответ запасного мозга.
  function brainCall(pid, method, arg, valid) {
    const rec = brains[pid];
    if (!rec) return null;
    if (!rec.broken && typeof rec.brain[method] === 'function') {
      try {
        const res = rec.brain[method](clone(arg));
        if (!valid || valid(res)) return res;
      } catch (e) { report(e, 'brain'); rec.broken = true; }
    }
    try { return rec.fb[method](clone(arg)); } catch (e) { report(e, 'brain'); return null; }
  }
  function publish(ev) {
    const g = S.game;
    if (!g) return;
    g.pub.push(clone(ev));
    for (const id of g.participants) if (brains[id]) feedBrain(brains[id], ev);
  }
  const thinkTime = v => U.clamp(Number(v) > 0 ? Number(v) : ms(1800), 40, 12000);
  const entriesCopy = () => (S.game && S.game.clue ? S.game.clue.entries.map(e => Object.assign({}, e)) : []);
  const feedView = f => { const o = { id: f.id, ts: f.ts, kind: f.kind, text: f.text }; if (f.from != null) o.from = f.from; if (f.to != null) o.to = f.to; return o; };
  const botFeed = () => S.feed.filter(f => f.g === S.round).map(feedView);

  // ---------- партия ----------
  function candidatePacks() {
    const out = [];
    for (const id of S.settings.packs) { const p = dataPack(id); if (p && Array.isArray(p.words) && p.words.length >= CUSTOM_MIN) out.push(p); }
    if (S.settings.useCustom && S.settings.custom && S.settings.custom.words.length >= CUSTOM_MIN) out.push(buildCustomPack(S.settings.custom));
    return out;
  }
  function chooseWord(cands) {
    const key = (p, w) => p.id + ':' + U.norm(w);
    for (const p of U.shuffle(cands, rnd)) {
      const fresh = p.words.filter(w => w && w.w && !S.recent.includes(key(p, w.w)));
      if (fresh.length) return { pack: p, word: U.pick(fresh, rnd) };
    }
    let best = null, bi = Infinity;
    for (const p of cands) for (const w of p.words) { if (!w || !w.w) continue; const i = S.recent.indexOf(key(p, w.w)); if (i < bi) { bi = i; best = { pack: p, word: w }; } }
    return best;
  }
  function startGame(by) {
    const parts = S.players.filter(p => !p.left && (p.isBot || p.connected));
    if (parts.length < MINP) return fail(by, 'Нужно минимум 3 игрока — добавь ботов', 'not_enough');
    if (parts.length > MAXP) return fail(by, 'Максимум 10 игроков', 'too_many');
    const cands = candidatePacks();
    if (!cands.length) return fail(by, S.settings.useCustom ? 'В своей теме нужно хотя бы 3 слова' : 'Выбери хотя бы одну тему', 'no_packs');
    const ch = chooseWord(cands);
    if (!ch) return fail(by, 'Не нашлось слова для партии', 'no_words');

    S.players = S.players.filter(p => !p.left);
    S.banned = [];
    for (const k in brains) delete brains[k];
    S.round++;
    const st = S.settings;
    const ids = parts.map(p => p.id);
    const need = (ids.length >= 6 && S.spiesWanted === 2) ? 2 : 1;
    const noSpy = st.noSpyChance > 0 && rnd() < st.noSpyChance;
    const spies = noSpy ? [] : U.shuffle(ids, rnd).slice(0, need);
    const k0 = Math.floor(rnd() * ids.length);
    const order = ids.slice(k0).concat(ids.slice(0, k0));
    const pack = ch.pack, word = ch.word.w;
    const cards = {}, startInfo = {};
    for (const id of ids) {
      const spy = spies.includes(id);
      cards[id] = spy
        ? { kind: 'spy', pack: st.spyKnowsTheme ? pack.id : null, packTitle: st.spyKnowsTheme ? pack.title : null, fellow: st.spiesKnowEachOther ? spies.filter(x => x !== id) : [] }
        : { kind: 'word', word, pack: pack.id, packTitle: pack.title };
      startInfo[id] = {
        role: spy ? 'spy' : 'word', word: spy ? null : word, packId: (!spy || st.spyKnowsTheme) ? pack.id : null,
        packKnown: !spy || !!st.spyKnowsTheme, spiesCount: need,
        fellowSpies: spy && st.spiesKnowEachOther ? spies.filter(x => x !== id) : [], noSpyPossible: st.noSpyChance > 0,
      };
    }
    for (const p of S.players) p.waiting = !ids.includes(p.id);
    S.recent.push(pack.id + ':' + U.norm(word));
    while (S.recent.length > RECENT_MAX) S.recent.shift();
    S.game = {
      n: S.round, packId: pack.id, packTitle: pack.title, word, packIds: cands.map(p => p.id),
      custom: pack.id === 'custom' ? pack : (cands.find(p => p.id === 'custom') || null),
      participants: ids, order, spies, noSpy, need, allowNoSpy: st.noSpyChance > 0,
      cards, startInfo, deal: { deadline: null, ready: [] }, clue: null, accusedBy: {},
      votes: {}, voteOrder: [], voteDeadline: null, voteClosing: false,
      result: null, guess: null, pub: [], phaseUntil: null, applied: false,
    };
    for (const id of ids) { const p = player(id); if (p.isBot) initBrain(p, false); }
    setPhase('deal');
    const dl = now() + ms(T.deal);
    S.game.deal.deadline = dl;
    schedule('dealEnd', dl - now());
    for (const id of ids) {
      if (player(id).isBot) schedule('botSeen', ms(T.botSeenMin + rnd() * (T.botSeenMax - T.botSeenMin)), { pid: id });
    }
    sys(`Партия ${S.round}: карточки розданы`);
    return { ok: true };
  }
  function checkDealDone() {
    const g = S.game;
    if (S.phase !== 'deal' || !g) return;
    const humans = g.participants.map(player).filter(p => p && !p.isBot && present(p));
    const ready = id => g.deal.ready.includes(id);
    if (humans.length ? humans.every(p => ready(p.id)) : g.participants.every(ready)) toClues();
  }
  function toClues() {
    const g = S.game;
    setPhase('clues');
    g.clue = { round: 1, rounds: S.settings.clueRounds, idx: -1, turn: null, thinking: null, deadline: null, entries: [], seq: 0, turnMs: S.settings.turnSeconds * 1000 };
    nextTurn();
  }
  function nextTurn() {
    const g = S.game, c = g.clue, n = g.order.length;
    c.idx++; c.seq++;
    c.thinking = null;
    if (c.idx >= n * c.rounds) {
      c.turn = null; c.deadline = null;
      schedule('toVote', ms(T.toVote));
      return;
    }
    const r = Math.floor(c.idx / n) + 1;
    if (r !== c.round) { roundBoundary(c.round); c.round = r; sys(`Круг ${r} из ${c.rounds}`); }
    const pid = g.order[c.idx % n];
    const p = player(pid);
    c.turn = pid;
    const turnMs = c.turnMs > 0 ? ms(c.turnMs) : 0;
    c.deadline = turnMs > 0 ? now() + turnMs : null;
    if (!p || p.left) {
      c.deadline = now();
    } else if (p.isBot) {
      const res = brainCall(pid, 'clue', { round: c.round, rounds: c.rounds, history: entriesCopy(), feed: botFeed() },
        x => x && typeof x.text === 'string' && x.text.trim());
      let think = thinkTime(res && res.thinkMs);
      if (turnMs > 0) think = Math.min(think, Math.max(40, turnMs - ms(400)));
      c.thinking = pid;
      schedule('botClue', think, { seq: c.seq, pid, text: res && typeof res.text === 'string' ? res.text : '' });
    } else if (!p.connected) {
      const lim = now() + ms(T.discTurn);
      if (c.deadline == null || c.deadline > lim) c.deadline = lim;
    }
    if (c.deadline != null) schedule('turnEnd', c.deadline - now(), { seq: c.seq });
  }
  function roundBoundary(done) {
    const g = S.game;
    const bots = U.shuffle(g.participants.filter(id => { const p = player(id); return p && p.isBot && !p.left; }), rnd);
    let k = 0;
    for (const id of bots) {
      const res = brainCall(id, 'accuse', { history: entriesCopy(), feed: botFeed(), round: done });
      if (!res || !res.to || res.to === id || !g.participants.includes(res.to)) continue;
      const delay = ms(T.accuseMin + k * T.accuseStep + rnd() * T.accuseStep);
      k++;
      schedule('botAccuse', delay, { pid: id, to: res.to, text: typeof res.text === 'string' ? res.text : '', cr: done });
    }
  }
  function validateClue(pid, raw) {
    const g = S.game;
    const text = String(raw == null ? '' : raw).replace(/[\u0000-\u001f]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!text) return { ok: false, error: 'empty', msg: 'Напиши подсказку' };
    if (text.length > 28) return { ok: false, error: 'long', msg: 'Не длиннее 28 символов' };
    const n = U.norm(text);
    const words = n.split(' ').filter(w => /[a-zа-я0-9]/.test(w));
    if (!words.length) return { ok: false, error: 'empty', msg: 'Нужно слово из букв' };
    if (words.length > 2) return { ok: false, error: 'words', msg: 'Подсказка — одно или два слова' };
    if (g.clue.entries.some(e => !e.skipped && U.norm(e.text) === n)) return { ok: false, error: 'dup', msg: 'Такую подсказку уже называли' };
    if (!isSpy(pid) && obvious(text, g.word)) return { ok: false, error: 'obvious', msg: 'Это слишком очевидно!' };
    return { ok: true, text };
  }
  function submitClue(pid, text) {
    const c = S.game.clue;
    cancelKind('turnEnd', 'botClue');
    const entry = { id: pid, round: c.round, text };
    c.entries.push(entry);
    publish({ type: 'clue', entry: Object.assign({}, entry) });
    nextTurn();
  }
  function skipTurn(pid) {
    const c = S.game.clue;
    cancelKind('turnEnd', 'botClue');
    const entry = { id: pid, round: c.round, text: '', skipped: true };
    c.entries.push(entry);
    publish({ type: 'skip', id: pid, entry: Object.assign({}, entry) });
    nextTurn();
  }
  function postAccuse(fromId, toId, text) {
    const g = S.game;
    const to = player(toId);
    feedPush({ kind: 'accuse', from: fromId, to: toId, text: (text && String(text).trim()) || `Подозреваю: ${to ? to.name : '?'}` });
    publish({ type: 'accuse', from: fromId, to: toId });
    if (g && g.clue) g.accusedBy[fromId] = g.clue.round;
  }

  // ---------- голосование ----------
  function cleanPicks(pid, picks) {
    const g = S.game;
    if (!Array.isArray(picks)) return { error: 'Выбери, за кого голосуешь' };
    if (picks.length === 1 && picks[0] === 'nospy') return g.allowNoSpy ? { picks: ['nospy'] } : { error: 'Вариант «шпиона нет» выключен' };
    const u = [...new Set(picks.map(String))];
    if (u.includes('nospy')) return { error: '«Шпиона нет» — отдельный вариант' };
    if (u.includes(pid)) return { error: 'За себя голосовать нельзя' };
    if (u.some(x => !g.participants.includes(x))) return { error: 'Такого игрока нет в партии' };
    if (u.length !== g.need) return { error: g.need === 1 ? 'Выбери одного игрока' : 'Выбери двух игроков' };
    return { picks: u };
  }
  function randomPicks(pid) {
    const g = S.game;
    const others = U.shuffle(g.participants.filter(x => x !== pid), rnd);
    return others.slice(0, g.need);
  }
  function toVote() {
    const g = S.game;
    setPhase('vote');
    g.votes = {}; g.voteOrder = []; g.voteClosing = false;
    const vs = S.settings.voteSeconds;
    g.voteDeadline = vs > 0 ? now() + ms(vs * 1000) : null;
    if (g.voteDeadline != null) schedule('voteEnd', g.voteDeadline - now());
    sys('Голосование: кто шпион?');
    for (const id of g.participants) {
      const p = player(id);
      if (!p || !p.isBot || p.left) continue;
      const arg = { history: entriesCopy(), feed: botFeed(), need: g.need, allowNoSpy: g.allowNoSpy };
      const res = brainCall(id, 'vote', arg, x => x && !cleanPicks(id, x.picks).error);
      const cp = res ? cleanPicks(id, res.picks) : { error: 1 };
      schedule('botVote', thinkTime(res && res.thinkMs), { pid: id, picks: cp.picks || randomPicks(id) });
    }
    checkVoteDone();
  }
  function castVote(pid, picks) {
    const g = S.game;
    if (!g.votes[pid]) g.voteOrder.push(pid);
    g.votes[pid] = picks.slice();
    checkVoteDone();
  }
  function checkVoteDone() {
    const g = S.game;
    if (S.phase !== 'vote' || !g || g.voteClosing) return;
    const must = g.participants.map(player).filter(present);
    if (must.every(p => g.votes[p.id])) {
      g.voteClosing = true;
      schedule('voteClose', ms(T.voteGrace));
    }
  }
  function closeVote() {
    const g = S.game;
    const tally = {};
    g.participants.forEach(id => { tally[id] = 0; });
    if (g.allowNoSpy) tally.nospy = 0;
    const votes = [];
    for (const id of g.participants) {
      const v = g.votes[id];
      if (!v) continue;
      votes.push({ from: id, to: v.slice() });
      for (const x of v) if (Object.prototype.hasOwnProperty.call(tally, x)) tally[x]++;
    }
    const cands = g.participants.filter(id => tally[id] > 0).sort((a, b) => tally[b] - tally[a]);
    const maxP = cands.length ? tally[cands[0]] : 0;
    let accused = [], verdict;
    if (g.allowNoSpy && tally.nospy > 0 && tally.nospy > maxP) verdict = 'nospy';
    else {
      const K = g.need;
      if (cands.length <= K) accused = cands.slice();
      else {
        const edge = tally[cands[K - 1]];
        accused = tally[cands[K]] === edge ? cands.filter(id => tally[id] > edge) : cands.slice(0, K);
      }
      verdict = accused.length ? 'accused' : 'none';
    }
    const caught = accused.filter(id => g.spies.includes(id));
    g.result = {
      noSpy: g.spies.length === 0, spies: g.spies.slice(), word: g.word, pack: g.packId, packTitle: g.packTitle,
      accused, caught, tally, votes, verdict,
      guessNeeded: !!(g.spies.length && caught.length && S.settings.spyGuess),
      guess: null, guesses: [], winner: null, reason: null, deltas: {}, scores: {}, final: false,
    };
    outcome(g);
    g.result.final = !g.result.guessNeeded;
    setPhase('reveal');
    g.phaseUntil = now() + ms(T.reveal);
    schedule('revealEnd', ms(T.reveal));
  }
  function outcome(g) {
    const R = g.result, parts = g.participants, spies = g.spies;
    const civ = parts.filter(id => !spies.includes(id));
    const d = {};
    parts.forEach(id => { d[id] = 0; });
    const votesOf = {};
    R.votes.forEach(v => { votesOf[v.from] = v.to; });
    const correct = id => !!votesOf[id] && votesOf[id].some(x => spies.includes(x));
    const guessed = !!(R.guess && R.guess.correct);
    let winner, reason;
    if (!spies.length) {
      if (R.verdict === 'nospy') { parts.forEach(id => { d[id] = 2; }); winner = 'players'; reason = 'noSpyRight'; }
      else { winner = 'draw'; reason = 'noSpyWrong'; }
    } else if (R.caught.length === spies.length) {
      if (guessed) { spies.forEach(id => { d[id] = 3; }); civ.forEach(id => { d[id] = 1; }); winner = 'spies'; reason = 'guessed'; }
      else { civ.forEach(id => { d[id] = 2 + (correct(id) ? 1 : 0); }); winner = 'players'; reason = 'caught'; }
    } else if (R.caught.length === 0) {
      spies.forEach(id => { d[id] = 3; }); civ.forEach(id => { d[id] = correct(id) ? 1 : 0; }); winner = 'spies'; reason = 'escaped';
    } else {
      civ.forEach(id => { d[id] = 1; }); spies.forEach(id => { d[id] = guessed ? 2 : 1; }); winner = 'draw'; reason = 'tie';
    }
    R.winner = winner; R.reason = reason; R.deltas = d;
    R.scores = {};
    S.players.forEach(p => { R.scores[p.id] = (p.score || 0) + (g.applied ? 0 : (d[p.id] || 0)); });
  }
  function afterReveal() {
    const g = S.game;
    if (g.result.guessNeeded) toGuess(); else toScores();
  }

  // ---------- угадывание ----------
  function toGuess() {
    const g = S.game, r = g.result;
    setPhase('guess');
    const pack = packOf(g.packId);
    const seen = new Set([U.norm(g.word)]);
    const others = [];
    for (const w of pack ? pack.words : []) { const k = U.norm(w && w.w); if (k && !seen.has(k)) { seen.add(k); others.push(w.w); } }
    const options = U.shuffle(U.shuffle(others, rnd).slice(0, 11).concat([g.word]), rnd);
    const dl = now() + ms(T.guess);
    g.guess = { deadline: dl, by: r.caught.slice(), options, done: [], guesses: [], resolved: false };
    g.phaseUntil = dl;
    schedule('guessEnd', dl - now());
    for (const id of g.guess.by) {
      const p = player(id);
      if (!p || !p.isBot) continue;
      const inOpts = w => typeof w === 'string' && options.some(o => U.norm(o) === U.norm(w));
      const res = brainCall(id, 'guess', { options: options.slice(), history: entriesCopy() }, x => x && inOpts(x.word));
      const w = res && inOpts(res.word) ? res.word : U.pick(options, rnd);
      schedule('botGuess', thinkTime(res && res.thinkMs), { pid: id, word: w });
    }
    checkGuessAbsent();
  }
  function submitGuess(pid, word) {
    const g = S.game, gs = g.guess;
    const opt = gs.options.find(o => U.norm(o) === U.norm(word));
    gs.done.push(pid);
    gs.guesses.push({ by: pid, word: opt, correct: U.norm(opt) === U.norm(g.word) });
    if (gs.by.every(id => gs.done.includes(id))) resolveGuess();
  }
  function checkGuessAbsent() {
    const g = S.game, gs = g && g.guess;
    if (S.phase !== 'guess' || !gs || gs.resolved) return;
    const left = gs.by.filter(id => !gs.done.includes(id)).map(player);
    if (left.length && left.every(p => !present(p))) {
      const lim = now() + (left.every(p => !p || p.left) ? 0 : ms(T.discTurn));
      if (gs.deadline == null || gs.deadline > lim) {
        gs.deadline = lim; g.phaseUntil = lim;
        cancelKind('guessEnd');
        schedule('guessEnd', lim - now());
      }
    }
  }
  function resolveGuess() {
    const g = S.game, gs = g.guess, r = g.result;
    cancelKind('guessEnd', 'botGuess');
    gs.resolved = true; gs.deadline = null;
    const good = gs.guesses.find(x => x.correct);
    r.guess = good ? Object.assign({}, good) : gs.guesses[0] ? Object.assign({}, gs.guesses[0]) : { by: gs.by[0] || null, word: null, correct: false };
    r.guesses = gs.guesses.map(x => Object.assign({}, x));
    outcome(g);
    r.final = true;
    g.phaseUntil = now() + ms(T.guessShow);
    schedule('guessShown', ms(T.guessShow));
  }

  // ---------- итоги / лобби ----------
  const SUMMARY = {
    caught: n => n > 1 ? 'Шпионы пойманы — победа мирных!' : 'Шпион пойман — победа мирных!',
    guessed: () => 'Шпиона поймали, но он угадал слово!',
    escaped: n => n > 1 ? 'Шпионы ушли от ответа' : 'Шпион ушёл от ответа',
    tie: () => 'Один шпион пойман, второй ушёл — ничья',
    noSpyRight: () => 'Шпиона не было — и вы это поняли!',
    noSpyWrong: () => 'Шпиона не было… а вы кого-то обвинили',
  };
  function toScores() {
    const g = S.game, r = g.result;
    if (!g.applied) {
      for (const id in r.deltas) { const p = player(id); if (p) p.score = (p.score || 0) + r.deltas[id]; }
      g.applied = true;
    }
    r.final = true;
    r.scores = {};
    S.players.forEach(p => { r.scores[p.id] = p.score || 0; });
    setPhase('scores');
    g.phaseUntil = now() + ms(T.scores);
    schedule('scoresEnd', ms(T.scores));
    const fn = SUMMARY[r.reason];
    if (fn) sys(`Итог партии ${g.n}: ${fn(g.spies.length)} Слово — «${g.word}»`);
  }
  // Ушедшие посреди партии (о них уже было событие 'left') убираются из списка молча.
  function enterLobby() {
    setPhase('lobby');
    S.players = S.players.filter(p => !p.left);
    S.players.forEach(p => { p.waiting = false; });
    S.banned = [];
    S.game = null;
    for (const k in brains) delete brains[k];
    recomputeSpies();
    for (const p of S.players) if (!p.isBot && !p.isHost && !p.connected) scheduleGc(p);
  }
  function scheduleGc(p) {
    cancel(t => t.kind === 'gc' && t.data && t.data.pid === p.id);
    const at = (p.discAt || now()) + ms(T.gc);
    schedule('gc', Math.max(0, at - now()), { pid: p.id });
  }

  // ---------- присутствие ----------
  function onAbsent(p) {
    const g = S.game;
    if (!g || !isPart(p.id)) return;
    if (S.phase === 'deal') checkDealDone();
    else if (S.phase === 'clues' && g.clue && g.clue.turn === p.id && !p.isBot) {
      const lim = now() + (p.left ? 0 : ms(T.discTurn));
      if (g.clue.deadline == null || g.clue.deadline > lim) {
        g.clue.deadline = lim;
        cancelKind('turnEnd');
        schedule('turnEnd', lim - now(), { seq: g.clue.seq });
      }
    } else if (S.phase === 'vote') checkVoteDone();
    else if (S.phase === 'guess') checkGuessAbsent();
  }
  function dropPlayer(p) {
    if (S.game && isPart(p.id) && S.phase !== 'lobby') {
      p.left = true; p.connected = false;
      onAbsent(p);
    } else {
      S.players = S.players.filter(x => x.id !== p.id);
      cancel(t => t.kind === 'gc' && t.data && t.data.pid === p.id);
    }
    recomputeSpies();
    emit({ type: 'left', id: p.id });
  }
  function addBots(k) {
    const taken = S.players.map(p => p.name);
    let list = null;
    const AI = aiSrc();
    if (AI && typeof AI.makeBots === 'function') {
      try { list = AI.makeBots(k, { taken, rng: rnd }); } catch (e) { report(e, 'brain'); list = null; }
    }
    if (!Array.isArray(list)) list = [];
    list = list.filter(b => b && typeof b === 'object').slice(0, k);
    if (list.length < k) list = list.concat(fallbackBots(k - list.length, taken.concat(list.map(b => b.name || '')), rnd));
    const added = [];
    for (const b of list) {
      let id;
      do { id = 'bot-' + U.uid(6, rnd); } while (player(id));
      const pr = cleanProfile(b, null, rnd);
      const p = {
        id, name: pr.name, hue: pr.hue, face: pr.face, isBot: true, persona: String(b.persona || 'Бот').slice(0, 24),
        bio: String(b.bio || '').slice(0, 60), isHost: false, connected: true, waiting: S.phase !== 'lobby' && S.phase !== 'scores', score: 0,
        ai: clone(b),
      };
      S.players.push(p);
      added.push(p);
      emit({ type: 'joined', id });
    }
    recomputeSpies();
    return added;
  }
  // Убрать бота: в лобби — совсем; на экране итогов (он участник прошедшей партии) — пометить ушедшим,
  // чтобы result ещё мог показать его имя; удалится при старте следующей партии.
  function removeBot(id) {
    const b = player(id);
    if (!b) return;
    if (S.game && isPart(id) && S.phase !== 'lobby') b.left = true;
    else S.players = S.players.filter(x => x.id !== id);
    recomputeSpies();
    emit({ type: 'left', id });
  }
  const liveBots = () => S.players.filter(x => x.isBot && !x.left);

  // ---------- действия ----------
  const inLobby = () => S.phase === 'lobby' || S.phase === 'scores';
  const hostOnly = p => (p.isHost ? null : fail(p, 'Это может только хост', 'not_host'));
  const argOf = (payload, ...keys) => {
    if (payload && typeof payload === 'object' && !Array.isArray(payload)) { for (const k of keys) if (k in payload) return payload[k]; }
    return payload;
  };
  const ACTIONS = {
    setSettings(p, patch) {
      const e = hostOnly(p); if (e) return e;
      if (!inLobby()) return fail(p, 'Настройки меняются в лобби', 'phase');
      if (!patch || typeof patch !== 'object') return fail(null, null, 'bad_args');
      applySettings(p, patch);
      return { ok: true };
    },
    addBot(p) {
      const e = hostOnly(p); if (e) return e;
      if (!inLobby()) return fail(p, 'Ботов добавляют в лобби', 'phase');
      if (seated() >= MAXP) return fail(p, 'Максимум 10 игроков', 'full');
      addBots(1);
      return { ok: true };
    },
    fillBots(p, payload) {
      const e = hostOnly(p); if (e) return e;
      if (!inLobby()) return fail(p, 'Ботов добавляют в лобби', 'phase');
      const want = Math.round(Number(argOf(payload, 'total', 'n', 'count')));
      if (!Number.isFinite(want)) return fail(null, null, 'bad_args');
      const humans = S.players.filter(x => !x.isBot && !x.left).length;
      const target = U.clamp(want, Math.max(humans, 1), MAXP);
      if (seated() < target) addBots(target - seated());
      while (seated() > target) {
        const bots = liveBots();
        if (!bots.length) break;
        removeBot(bots[bots.length - 1].id);
      }
      return { ok: true };
    },
    removeBot(p, payload) {
      const e = hostOnly(p); if (e) return e;
      const id = argOf(payload, 'id');
      const b = player(id);
      if (!b || !b.isBot || b.left) return fail(p, 'Такого бота нет', 'bad_args');
      if (!inLobby()) return fail(p, 'Ботов убирают в лобби', 'phase');
      removeBot(b.id);
      return { ok: true };
    },
    kick(p, payload) {
      const e = hostOnly(p); if (e) return e;
      const id = argOf(payload, 'id');
      const t = player(id);
      if (!t || t.isHost) return fail(p, 'Этого игрока нельзя исключить', 'bad_args');
      if (t.isBot) return ACTIONS.removeBot(p, t.id);
      // в лобби просто убираем (зайти снова по коду можно); посреди партии — не пускаем обратно до её конца
      if (S.phase !== 'lobby' && !S.banned.includes(t.id)) S.banned.push(t.id);
      emit({ type: 'kicked' }, t.id);
      sys(`Хост исключил игрока ${t.name}`);
      dropPlayer(t);
      return { ok: true };
    },
    start(p) {
      const e = hostOnly(p); if (e) return e;
      if (!inLobby()) return fail(p, 'Партия уже идёт', 'phase');
      return startGame(p);
    },
    seen(p) {
      const g = S.game;
      if (S.phase !== 'deal' || !isPart(p.id)) return fail(null, null, 'phase');
      if (!g.deal.ready.includes(p.id)) g.deal.ready.push(p.id);
      checkDealDone();
      return { ok: true };
    },
    clue(p, payload) {
      const g = S.game;
      if (S.phase !== 'clues' || !g || !g.clue) return fail(p, 'Сейчас не время подсказок', 'phase');
      if (g.clue.turn !== p.id) return fail(p, 'Сейчас не твой ход', 'not_turn');
      const v = validateClue(p.id, argOf(payload, 'text'));
      if (!v.ok) return fail(p, v.msg, v.error);
      submitClue(p.id, v.text);
      return { ok: true };
    },
    skip(p) {
      const g = S.game;
      if (S.phase !== 'clues' || !g || !g.clue || g.clue.turn !== p.id) return fail(p, 'Сейчас не твой ход', 'not_turn');
      skipTurn(p.id);
      return { ok: true };
    },
    accuse(p, payload) {
      const g = S.game;
      if (S.phase !== 'clues' || !g || !g.clue) return fail(p, 'Подозревать можно во время подсказок', 'phase');
      if (!isPart(p.id) || p.left) return fail(p, 'Ты сейчас наблюдаешь', 'not_player');
      const to = String(argOf(payload, 'id', 'to'));
      if (to === p.id || !isPart(to)) return fail(p, 'Выбери другого игрока', 'bad_args');
      if (g.accusedBy[p.id] === g.clue.round) return fail(p, 'Подозревать можно раз за круг', 'limit');
      postAccuse(p.id, to, '');
      return { ok: true };
    },
    vote(p, payload) {
      const g = S.game;
      if (S.phase !== 'vote' || !g) return fail(p, 'Голосование закрыто', 'phase');
      if (!isPart(p.id) || p.left) return fail(p, 'Ты сейчас наблюдаешь', 'not_player');
      const cp = cleanPicks(p.id, argOf(payload, 'picks'));
      if (cp.error) return fail(p, cp.error, 'bad_vote');
      castVote(p.id, cp.picks);
      return { ok: true };
    },
    guess(p, payload) {
      const g = S.game, gs = g && g.guess;
      if (S.phase !== 'guess' || !gs || gs.resolved) return fail(p, 'Сейчас нельзя угадывать', 'phase');
      if (!gs.by.includes(p.id) || gs.done.includes(p.id)) return fail(p, 'Угадывает пойманный шпион', 'not_guesser');
      const w = argOf(payload, 'word');
      if (typeof w !== 'string' || !gs.options.some(o => U.norm(o) === U.norm(w))) return fail(p, 'Выбери слово из списка', 'bad_args');
      submitGuess(p.id, w);
      return { ok: true };
    },
    next(p) {
      const e = hostOnly(p); if (e) return e;
      if (S.phase === 'reveal') { afterReveal(); return { ok: true }; }
      if (S.phase === 'guess' && S.game.guess && S.game.guess.resolved) { toScores(); return { ok: true }; }
      if (S.phase === 'scores') return startGame(p);
      return fail(null, null, 'phase');
    },
    toLobby(p) {
      const e = hostOnly(p); if (e) return e;
      if (S.phase === 'lobby') return { ok: true };
      enterLobby();
      sys('Все в лобби');
      return { ok: true };
    },
    react(p, payload) {
      const emoji = String(argOf(payload, 'emoji') || '').trim();
      if (!emoji || emoji.length > 16) return fail(null, null, 'bad_args');
      const t = now();
      if (reactAt[p.id] && t - reactAt[p.id] < T.react) return fail(null, null, 'limit');
      reactAt[p.id] = t;
      emit({ type: 'react', from: p.id, emoji });
      return { ok: true };
    },
    rename(p, payload) {
      if (p.isBot) return fail(null, null, 'bad_args');
      const pr = cleanProfile(payload, p, rnd);
      p.name = pr.name; p.hue = pr.hue; p.face = pr.face;
      return { ok: true };
    },
  };

  // ---------- обработчики таймеров ----------
  const HANDLERS = {
    botSeen({ pid }) {
      const g = S.game;
      if (S.phase !== 'deal' || !g) return;
      if (!g.deal.ready.includes(pid)) g.deal.ready.push(pid);
      checkDealDone();
    },
    dealEnd() { if (S.phase === 'deal') toClues(); },
    turnEnd({ seq }) {
      const c = S.game && S.game.clue;
      if (S.phase !== 'clues' || !c || c.seq !== seq || !c.turn) return;
      skipTurn(c.turn);
    },
    botClue({ seq, pid, text }) {
      const c = S.game && S.game.clue;
      if (S.phase !== 'clues' || !c || c.seq !== seq || c.turn !== pid) return;
      c.thinking = null;
      let v = text ? validateClue(pid, text) : { ok: false };
      if (!v.ok) {
        // мозг ошибся (повтор/очевидно) — пробуем запасной вариант
        const rec = brains[pid];
        let alt = null;
        try { alt = rec && rec.fb.clue({ round: c.round, rounds: c.rounds, history: entriesCopy(), feed: botFeed() }); } catch (e) { alt = null; }
        v = alt && alt.text ? validateClue(pid, alt.text) : { ok: false };
      }
      if (v.ok) submitClue(pid, v.text); else skipTurn(pid);
    },
    botAccuse({ pid, to, text, cr }) {
      const g = S.game, p = player(pid);
      if (!g || S.phase !== 'clues' || !p || p.left || !isPart(to)) return;
      if (g.accusedBy[pid] != null && g.accusedBy[pid] >= cr + 1) return;
      postAccuse(pid, to, text);
    },
    toVote() { if (S.phase === 'clues') toVote(); },
    botVote({ pid, picks }) {
      const g = S.game;
      if (S.phase !== 'vote' || !g) return;
      const cp = cleanPicks(pid, picks);
      castVote(pid, cp.picks || randomPicks(pid));
    },
    voteEnd() { if (S.phase === 'vote') closeVote(); },
    voteClose() { if (S.phase === 'vote') closeVote(); },
    revealEnd() { if (S.phase === 'reveal') afterReveal(); },
    botGuess({ pid, word }) {
      const gs = S.game && S.game.guess;
      if (S.phase !== 'guess' || !gs || gs.resolved || gs.done.includes(pid)) return;
      submitGuess(pid, gs.options.some(o => U.norm(o) === U.norm(word)) ? word : gs.options[0]);
    },
    guessEnd() { if (S.phase === 'guess' && S.game.guess && !S.game.guess.resolved) resolveGuess(); },
    guessShown() { if (S.phase === 'guess') toScores(); },

function parseCustom(text) {
  const words = [], errors = [], seen = new Set();
  String(text || '').split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim(); if (!line) return;
    const k = line.indexOf(':');
    const w = (k >= 0 ? line.slice(0, k) : line).trim().replace(/\s+/g, ' ');
    const rest = k >= 0 ? line.slice(k + 1) : '';
    if (!w) { errors.push('Строка ' + (i + 1) + ': нет слова перед двоеточием'); return; }
    if (w.length > 22) { errors.push('Строка ' + (i + 1) + ': «' + w.slice(0, 14) + '…» длиннее 22 букв'); return; }
    if (U.norm(w).length < 2) { errors.push('Строка ' + (i + 1) + ': слишком короткое слово'); return; }
    const key = U.norm(w);
    if (seen.has(key)) { errors.push('Строка ' + (i + 1) + ': «' + w + '» уже есть'); return; }
    seen.add(key);
    const a = rest.split(/[,;]/).map(x => x.trim().toLowerCase().replace(/\s+/g, ' ')).filter(x => x && x.length <= 20 && U.similar(x, w) < 0.85);
    words.push({ w: w[0].toUpperCase() + w.slice(1), a: Array.from(new Set(a)).slice(0, 12) });
  });
  if (words.length > 150) errors.push('Слишком много слов: оставь до 150');
  return { words, errors };
